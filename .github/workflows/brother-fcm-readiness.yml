name: Brother Matrizes - Verificar Firebase sem envio

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brother-fcm-readiness.yml'
      - '.github/scripts/check-brother-fcm-readiness.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-fcm-preflight
  cancel-in-progress: false

jobs:
  verify-firebase:
    name: Validar credenciais FCM em modo de teste
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: brother-release-signing
    steps:
      - name: Checkout oficial
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar SDK Firebase Admin
        run: npm install --prefix .github/scripts --no-save --ignore-scripts --no-audit --no-fund firebase-admin@14.5.0

      - name: Verificar credencial, projeto e Firebase (dry run sem envio)
        env:
          BROTHER_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.BROTHER_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node .github/scripts/check-brother-fcm-readiness.mjs
