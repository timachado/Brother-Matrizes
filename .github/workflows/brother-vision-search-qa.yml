name: Brother Vision Search — QA isolada

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "docs/BROTHER_VISION_SEARCH_V1.md"
      - ".github/workflows/brother-vision-search-qa.yml"
  workflow_dispatch:

concurrency:
  group: brother-vision-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Testes unitários, lint e compilação debug
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace

      - name: Guardar APK apenas para testes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Vision-Search-DIAGNOSTIC-NOT-STABLE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
