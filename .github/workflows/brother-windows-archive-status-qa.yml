name: Brother Matrizes - status de cotas sem mutacao (QA)

on:
  push:
    branches:
      - feature/windows-fiel-android-1-11-8-20261106
    paths:
      - "supabase/functions/brother-usage/index.ts"
      - "supabase/functions/brother-usage/read-status.ts"
      - "supabase/functions/brother-usage/read-status_test.ts"
      - "supabase/functions/brother-usage/read-pro-status-v2.ts"
      - "supabase/functions/brother-usage/read-pro-status-v2_test.ts"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopBrotherArchiveUsageGateway.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopArchiveQuotaRecoveryAssessment.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopArchiveQuotaReadOnlyDiagnostic.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopArchiveQuotaReadOnlyDiagnosticTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopBrotherArchiveUsageGatewayTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopArchiveQuotaRecoveryAssessmentTest.kt"
      - ".github/workflows/brother-windows-archive-status-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-contract:
    name: Contrato read-only Edge Function, Deno sem permissoes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Conferir preservacao de reserva/finalizacao Android
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server = Path('supabase/functions/brother-usage/index.ts').read_text()
          helper = Path('supabase/functions/brother-usage/read-status.ts').read_text()
          required = [
            'readKnownImportStatus(', 'payload.action === "status"',
            '.eq("request_id", requestId)',
            '.eq("user_id", verifiedUserId)',
            '.eq("operation", operation)',
            'payload.action === "reserve"',
            'payload.action === "finalize"',
            'admin.rpc("brother_matrizes_reserve_import"',
            'admin.rpc("brother_matrizes_finalize_import"',
          ]
          assert all(t in server for t in required), "Server contract changed"
          pro = Path('supabase/functions/brother-usage/read-pro-status-v2.ts').read_text()
          assert 'readProReceiptStatusV2(' in server
          assert 'payload.action === "status_pro_v2"' in server
          assert '.from("brother_matrizes_pro_import_receipts")' in server
          assert 'Deno.env.get("BROTHER_PRO_V2_ENABLED") === "true"' in server
          assert all(s in pro for s in (
            'authenticatedUserId', 'requestKey', 'requestId',
          )), "Pro lookup must scope reads"
          assert ('createClient' not in helper and 'createClient' not in pro), "Read-only helpers must have no DB client"
          assert 'delete(' not in helper and 'update(' not in helper
          print("BROTHER_KNOWN_QUOTA_STATUS_SERVER_READ_ONLY_OK")
          PY
      - name: Testar status de cotas com DB simulada sem rede e sem secrets
        shell: bash
        run: |
          deno check supabase/functions/brother-usage/read-pro-status-v2.ts
          deno check supabase/functions/brother-usage/read-pro-status-v2_test.ts
          deno check supabase/functions/brother-usage/index.ts
          deno test --no-check supabase/functions/brother-usage/read-status_test.ts
          deno test --no-check supabase/functions/brother-usage/read-pro-status-v2_test.ts
          echo "BROTHER_KNOWN_QUOTA_STATUS_DENO_FAKE_DB_OK"

  windows-contract:
    name: Contrato Android Windows e journal imutavel, sem rede
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      BROTHER_WINDOWS_QA_GOOGLE_AUTH: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Garantir que nenhuma interface habilitou importacao ou reconcilia automaticamente
        shell: pwsh
        run: |
          $ui = Get-Content "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/FielMain.kt" -Raw
          if ($ui.Contains('DesktopArchiveQuotaRecoveryAssessment') -or
              $ui.Contains('DesktopArchiveCommercialImportGate') -or
              $ui.Contains('DesktopBrotherArchiveUsageGateway')) {
            throw "Interface comercial alterada em QA de status read-only."
          }
          $assessment = Get-Content "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopArchiveQuotaRecoveryAssessment.kt" -Raw
          if (!$assessment.Contains('permitsAutomaticFinalize: Boolean = false') -or
              !$assessment.Contains('permitsAutomaticCleanup: Boolean = false')) {
            throw "Plano de recuperacao nao pode liquidar cota nem apagar o journal."
          }
          "BROTHER_WINDOWS_STATUS_NOT_WIRED_TO_PRODUCTION_OK"
      - name: Testar status HTTP simulado, estados desconhecidos e protecao contra recarga
        shell: pwsh
        run: |
          gradle -p windows-fiel test --no-daemon --stacktrace --tests '*DesktopBrotherArchiveUsageGatewayTest' --tests '*DesktopArchiveQuotaRecoveryAssessmentTest' --tests '*DesktopArchiveQuotaJournalTest' --tests '*DesktopArchiveQuotaReadOnlyDiagnosticTest'
          if ($LASTEXITCODE -ne 0) { throw "Status de quota Windows reprovado." }
          "BROTHER_WINDOWS_KNOWN_RESERVATION_READ_ONLY_QA_OK"
      - name: Anexar apenas XMLs sinteticos da QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brother-windows-known-quota-status-test-reports
          path: windows-fiel/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14
