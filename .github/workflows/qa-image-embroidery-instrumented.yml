name: Image to Embroidery Android Instrumented QA

on:
  push:
    branches: ["qa/image-to-embroidery-android-smoke-20261015"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify official app and simulator are not changed
        shell: bash
        run: |
          grep -F 'versionCode = 184' app/build.gradle.kts
          grep -F 'versionName = "1.10.8"' app/build.gradle.kts
          for file in MachineSimulationCanvas.kt SimulatorScreen.kt EmbroideryCanvas.kt EmbroideryDisplay.kt; do
            git diff origin/main --exit-code -- "app/src/main/java/com/timachado/brothermatrizes/$file"
          done

      - name: Compile dedicated Android UI tests
        run: gradle :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Run image-to-embroidery Android emulator smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_3a
          disable-animations: true
          emulator-boot-timeout: 600
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.timachado.brothermatrizes.ImageToEmbroideryInstrumentedQaTest

      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: imagem-para-bordado-android-instrumented-report
          path: |
            app/build/outputs/androidTest-results/connected
            app/build/reports/androidTests/connected
          if-no-files-found: ignore
