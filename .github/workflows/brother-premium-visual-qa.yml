name: Brother Matrizes — Premium Visual QA

on:
  push:
    branches:
      - feature/brother-premium-visual-20261020
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Preparar Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Análise estática de segurança
        run: bash scripts/pre_release_static_check.sh
      - name: Testes de unidade e compilação
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: APK de homologação (sem assinatura comercial)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: brother-premium-visual-debug-qa
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
