name: Notificar FCM sobre Brother Matrizes 1.10.10 publicado

# Reenvio solicitado em 16/10/2026 após correção do Secret Firebase Admin.
# O disparo anterior falhou antes de ser aceito pelo Firebase; nenhuma mensagem duplicada confirmada.
on:
  push:
    branches: [release-tools/fcm-notify-brother-1110]
    paths: [.github/workflows/notify-1110-fcm-once.yml]

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Conferir publicação, APK e manifesto antes do push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/latest" > /tmp/release.json
          jq -e '.tag_name == "v1.10.10" and .draft == false and .prerelease == false and
            (.assets | length == 1) and
            .assets[0].name == "Brother-Matrizes-1.10.10-OFICIAL-COMERCIAL-ASSINADO.apk" and
            .assets[0].digest == "sha256:13aad7267b6b3b616a8cf5e224e37245ec612f3922cbc1ff8c24ba349eb6c73f"' /tmp/release.json >/dev/null
          gh api "repos/$GH_REPO/contents/updates/stable.json" --jq .content | base64 -d > /tmp/stable.json
          jq -e '.applicationId == "com.timachado.brothermatrizes" and .versionCode == 186 and
            .downloadUrl == "https://github.com/timachado/Brother-Matrizes/releases/download/v1.10.10/Brother-Matrizes-1.10.10-OFICIAL-COMERCIAL-ASSINADO.apk" and
            .sha256 == "13aad7267b6b3b616a8cf5e224e37245ec612f3922cbc1ff8c24ba349eb6c73f"' /tmp/stable.json >/dev/null
          echo 'Release e OTA estao publicos e conferidos.'
      - name: Verificar se credencial Firebase Admin esta configurada sem revelar segredos
        id: auth
        env:
          FCM_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FCM_SA_ALT: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_SA_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
          FCM_BROTHER: ${{ secrets.BROTHER_MATRIZES_FIREBASE_SERVICE_ACCOUNT_JSON }}
          FCM_PRODUCTION: ${{ secrets.BROTHER_FIREBASE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$FCM_SA" ] || [ -n "$FCM_SA_ALT" ] || [ -n "$FCM_SA_B64" ] || [ -n "$FCM_BROTHER" ] || [ -n "$FCM_PRODUCTION" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            echo 'Servico Firebase disponivel para notificacao de versao.'
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo "::warning::PUSH FCM NAO ENVIADO: GitHub nao possui credencial de Firebase Admin reconhecida. O app continua notificando via sua verificacao periodica do manifesto."
          fi
      - name: Preparar Python e OAuth apenas se houver credencial
        if: steps.auth.outputs.configured == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enviar notificação ao tópico de atualizações, respeitando opt-in
        if: steps.auth.outputs.configured == 'true'
        shell: bash
        env:
          FCM_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FCM_SA_ALT: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
          FCM_SA_B64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON_BASE64 }}
          FCM_BROTHER: ${{ secrets.BROTHER_MATRIZES_FIREBASE_SERVICE_ACCOUNT_JSON }}
          FCM_PRODUCTION: ${{ secrets.BROTHER_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          python -m pip -q install google-auth requests
          python - <<'PY'
          import os, json, base64, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          candidates = [
              ("BROTHER_FIREBASE_SERVICE_ACCOUNT_JSON", os.getenv("FCM_PRODUCTION")),
              ("FIREBASE_SERVICE_ACCOUNT_JSON", os.getenv("FCM_SA")),
              ("FCM_SERVICE_ACCOUNT_JSON", os.getenv("FCM_SA_ALT")),
              ("BROTHER_MATRIZES_FIREBASE_SERVICE_ACCOUNT_JSON", os.getenv("FCM_BROTHER")),
              ("FIREBASE_SERVICE_ACCOUNT_JSON_BASE64", os.getenv("FCM_SA_B64")),
          ]
          def parse_secret(raw):
              raw = raw.strip().lstrip("\\ufeff")
              for candidate in (raw,):
                  try:
                      obj = json.loads(candidate)
                      if isinstance(obj, str):
                          obj = json.loads(obj)
                      if isinstance(obj, dict):
                          return obj
                  except (ValueError, TypeError):
                      pass
              try:
                  decoded = base64.b64decode("".join(raw.split()), validate=True).decode("utf-8-sig")
                  obj = json.loads(decoded)
                  if isinstance(obj, dict):
                      return obj
              except (ValueError, UnicodeDecodeError, TypeError):
                  pass
              return None
          info = None
          failures = []
          project="brother-matrizes---ti-machado"
          for label, raw in candidates:
              if not raw:
                  continue
              candidate = parse_secret(raw)
              if candidate is None:
                  failures.append(label + ": conteúdo não é JSON de conta de serviço nem Base64 válido")
                  continue
              if candidate.get("type") != "service_account" or not all(
                  candidate.get(field) for field in ("project_id", "private_key", "client_email", "token_uri")
              ):
                  failures.append(label + ": JSON não corresponde à conta de serviço Firebase Admin completa")
                  continue
              if candidate.get("project_id") != project:
                  failures.append(label + ": projeto Firebase diferente de Brother Matrizes")
                  continue
              info = candidate
              print("Credencial Firebase Admin válida encontrada em", label)
              break
          if info is None:
              for item in failures:
                  print("::warning::" + item)
              raise SystemExit("Push NÃO ENVIADO: cadastre o arquivo JSON COMPLETO baixado de Firebase > Configurações > Contas de serviço > Gerar nova chave privada. Nunca envie a chave pelo chat.")
          creds=service_account.Credentials.from_service_account_info(
              info,scopes=["https://www.googleapis.com/auth/firebase.messaging"])
          creds.refresh(Request())
          data={
              "type":"update",
              "versionCode":"186",
              "versionName":"1.10.10",
              "title":"Brother Matrizes 1.10.10 disponível!",
              "body":"Novidade: conta Google integrada ao checkout dos planos PRO. Toque para atualizar direto no aplicativo."
          }
          response=requests.post(
              f"https://fcm.googleapis.com/v1/projects/{project}/messages:send",
              headers={"Authorization":f"Bearer {creds.token}","Content-Type":"application/json"},
              json={"message":{"topic":"brother_matrizes_updates_stable","data":data}},
              timeout=25
          )
          if response.status_code!=200:
              raise SystemExit(f"Firebase rejeitou push: HTTP {response.status_code} {response.text[:250]}")
          obj=response.json()
          if not obj.get("name","").startswith(f"projects/{project}/messages/"):
              raise SystemExit("Firebase nao confirmou ID de envio.")
          print("FCM ACEITOU o disparo da nova atualizacao ao topico de usuarios opt-in.")
          print("ID de mensagem:",obj["name"])
          PY
