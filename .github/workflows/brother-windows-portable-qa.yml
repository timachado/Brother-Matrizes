  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-windows-portable-qa
  cancel-in-progress: true

jobs:
  app-image:
    name: Compilar launcher Windows + JRE portable, sem instalador
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BROTHER_WINDOWS_QA_GOOGLE_AUTH: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar backend único Android/Windows e OAuth desligado por padrão
        shell: pwsh
        run: |
          $guard = Get-Content "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopWindowsAccountQaOptIn.kt" -Raw
          $qa = Get-Content "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopWindowsGoogleQaEnvironment.kt" -Raw
          $target = Get-Content "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopBrotherBackendTarget.kt" -Raw
          if (!$target.Contains('OFFICIAL_REF = "dwpcddiramxlhavdmmyn"') -or
              !$guard.Contains('DesktopBrotherBackendTarget.official()') -or
              !$qa.Contains('projectRef = target.ref') -or
              !$qa.Contains('qa-brother-account-') -or
              $guard.Contains('BROTHER_WINDOWS_QA_STAGING_PROJECT_REF')) {
            throw "Windows nao esta vinculado ao Supabase oficial do Android."
          }
          if ($env:BROTHER_WINDOWS_QA_GOOGLE_AUTH -ne "disabled") {
            throw "O pacote portátil QA deve ser executado sem autenticação ativa por padrão."
          }
          "BROTHER_WINDOWS_SAME_ANDROID_BACKEND_QA_ONLY_OK"
      - name: Gerar ICO do mesmo monograma do launcher Android original
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw "Pillow QA nao pode ser instalado." }
          python windows-fiel/qa/preparar_icone_windows.py --out windows-fiel/build/qa/brand/brother_matrizes.ico
          if ($LASTEXITCODE -ne 0) { throw "O icone premium Android nao pode ser convertido." }
          $ico = "windows-fiel/build/qa/brand/brother_matrizes.ico"
          if (!(Test-Path $ico) -or (Get-Item $ico).Length -lt 1024) {
            throw "Arquivo ICO de marca Brother Matrizes ausente ou incompleto."
          }
      - name: Compilar testes locais prioritarios sem dados comerciais
        shell: pwsh
        run: |
          gradle -p windows-fiel test --no-daemon --stacktrace --tests '*DesktopAndroidProjectRecoveryTest' --tests '*DesktopFlpBackupRestorerTest' --tests '*DesktopAccountQaScreenTest' --tests '*DesktopWindowsPlansPresentationTest' --tests '*DesktopWindowsWordPressHandoffTest' --tests '*DesktopLaunchDocumentTest' --tests '*DesktopGoogleProviderReadinessTest' --tests '*DesktopReadOnlyFontAnalyzerTest' --tests '*DesktopRecoveredAndroidFontPreflightTest' --tests '*DesktopFontCatalogSearchTest' --tests '*DesktopFontZipPreviewTest' --tests '*DesktopFontZipAuthorizedImporterTest' --tests '*DesktopExternalFontRunningPreflightTest' --tests '*DesktopImportedFontSatinServiceTest' --tests '*DesktopAndroidActiveSatinBridgeTest' --tests '*DesktopBrotherCommunityLinksTest' --tests '*DesktopOfficialCommunityGroupResolverTest' --tests '*DesktopOfficialReleaseNoticeTest' --tests '*DesktopOfficialWindowsReleaseNoticeTest' --tests '*DesktopWindowsLocalNotificationTest' --tests '*DesktopWindowsNewsAutoCheckTest' --tests '*DesktopWindowsOfficialReleaseAutoCheckTest' --tests '*DesktopTelegramMatrixSearchTest' --tests '*DesktopSentMatrixHistoryTest' --tests '*DesktopBrotherDaFontUsageGatewayTest' --tests '*DesktopBrotherFontUsageGatewayTest' --tests '*DesktopCommercialFontImportGateTest' --tests '*DesktopCommercialFontFreeV2JournalTest' --tests '*DesktopPkceLoopbackSelfTestTest' --tests '*DesktopPkceLoopbackListenerTest' --tests '*DesktopMachineTransferFileTest' --tests '*DesktopWindowsShareHandoffTest' --tests '*DesktopProjectRecycleBinTest' --tests '*DesktopSvgFilePickerTest' --tests '*DesktopArchiveInventoryTest' --tests '*DesktopOriginalAndroidArchiveEngineParityTest' --tests '*DesktopArchiveRar7zInventoryTest' --tests '*DesktopArchiveSelectiveStagerTest' --tests '*DesktopArchiveSelectiveImportFactoryTest' --tests '*DesktopArchiveCommercialImportGateTest' --tests '*DesktopArchiveValidatedLibrarySinkTest' --tests '*DesktopWindowsArchiveAuthorizedImportTest' --tests '*DesktopWindowsStandaloneMatrixAuthorizedImportTest' --tests '*DesktopArchiveQuotaJournalTest' --tests '*DesktopArchiveQuotaMultiprocessTest' --tests '*DesktopBrotherArchiveUsageGatewayTest' --tests '*DesktopBrotherProV2QaGatewayTest' --tests '*DesktopArchiveQuotaRecoveryAssessmentTest' --tests '*DesktopArchiveQuotaReadOnlyDiagnosticTest' --tests '*DesktopBrotherEntitlementReaderTest' --tests '*DesktopWindowsAuthQaControllerTest' --tests '*DesktopWindowsFullGoogleQaFlowTest' --tests '*DesktopWindowsSharedAccountQuotaQaTest' --tests '*DesktopQaStagingProjectTest' --tests '*DesktopStagingQuotaStatusReaderTest' --tests '*DesktopOpenTypeFontNamesTest' --tests '*DesktopAndroidBaselineParityTest' --tests '*DesktopOriginalNativeFontGalleryParityTest' --tests '*DesktopCreatorImportedFontBridgeTest' --tests '*DesktopFontImportJournalSafetyTest' --tests '*DesktopWindowsFontImportOptInTest' --tests '*DesktopWindowsPendingFontQuotaReviewTest' --tests '*DesktopWindowsRemoteFontQuotaQaReviewTest' --tests '*DesktopNativeMatrixPickerTest' --tests '*DesktopWindowsPortableShortcutsTest' --tests '*DesktopImportedFontLibraryTest'
          if ($LASTEXITCODE -ne 0) { throw "QA Windows portable bloqueada por testes." }
      - name: Criar imagem APP-IMAGE sem EXE/MSI instalador
        shell: pwsh
        run: |
          # A app-image NAO requer WiX, mas o Compose 1.9.3 usa o valor
          # wixToolsetDir ao configurar o PATH do jpackage inclusive na
          # modalidade app-image. Usar somente um diretório vazio e privado
          # do runner, SEM baixar/distribuir Wix ou criar instalador.
          $noInstallerTools = Join-Path $env:RUNNER_TEMP "brother-app-image-no-wix"
          New-Item -Path $noInstallerTools -ItemType Directory -Force | Out-Null
          $env:WIX_PATH = $noInstallerTools
          gradle -p windows-fiel createDistributable --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Compose createDistributable falhou." }
          $root = "windows-fiel/build/compose/binaries"
          if (!(Test-Path $root)) { throw "Imagem de aplicativo Windows ausente." }
          $launchers = @(Get-ChildItem $root -Recurse -File -Filter "BrotherMatrizes.exe" -ErrorAction Stop)
          if ($launchers.Count -ne 1) { throw "Era esperado exatamente um launcher de QA; encontrados: $($launchers.Count)" }
          $exe = $launchers[0]
          $appDir = $exe.DirectoryName
          if (!(Test-Path (Join-Path $appDir "app"))) { throw "JAR/recursos portables nao incluidos." }
          if (!(Test-Path (Join-Path $appDir "runtime"))) { throw "Runtime Java embutido nao encontrado." }
          if ((Get-Item $exe.FullName).Length -lt 10000) { throw "Launcher Windows incompleto." }
          if (@(Get-ChildItem $root -Recurse -File -Filter "*.msi").Count -gt 0) {
            throw "A QA nao pode produzir instalador MSI."
          }
          "BROTHER_WINDOWS_APP_IMAGE_LAUNCHER_OK " + $exe.FullName
          "BM_PORTABLE_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          "BM_PORTABLE_DIR=$appDir" >> $env:GITHUB_ENV
      - name: Executar launcher portable e capturar Home no proprio Windows
        shell: pwsh
        run: |
          $working = (Resolve-Path "windows-fiel").Path
          $homeScreenshot = "windows-fiel/build/qa/home-windows-original-port.png"
          $accountScreenshot = "windows-fiel/build/qa/account-windows-readonly-qa.png"
          $runHome = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-home-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runHome.ExitCode -ne 0) { throw "O launcher portable falhou na Home: $($runHome.ExitCode)" }
          if (!(Test-Path $homeScreenshot) -or (Get-Item $homeScreenshot).Length -lt 10000) {
            throw "A Home do launcher portable nao foi renderizada."
          }
          $runAccount = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-account-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runAccount.ExitCode -ne 0) { throw "O launcher portable falhou em Minha Conta: $($runAccount.ExitCode)" }
          if (!(Test-Path $accountScreenshot) -or (Get-Item $accountScreenshot).Length -lt 10000) {
            throw "Minha Conta do launcher portable nao foi renderizada."
          }
          $communityScreenshot = "windows-fiel/build/qa/community-windows-official-news-qa.png"
          $runCommunity = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-community-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runCommunity.ExitCode -ne 0) { throw "O launcher portable falhou na Comunidade Windows: $($runCommunity.ExitCode)" }
          if (!(Test-Path $communityScreenshot) -or (Get-Item $communityScreenshot).Length -lt 10000) {
            throw "Comunidade e avisos oficiais Windows nao renderizados no launcher portable."
          }
          $fontsScreenshot = "windows-fiel/build/qa/fonts-windows-readonly-qa.png"
          $runFonts = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-fonts-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runFonts.ExitCode -ne 0) { throw "O launcher portable falhou na Biblioteca de Fontes: $($runFonts.ExitCode)" }
          if (!(Test-Path $fontsScreenshot) -or (Get-Item $fontsScreenshot).Length -lt 10000) {
            throw "Biblioteca de Fontes não foi renderizada pelo launcher portable."
          }
          $transferScreenshot = "windows-fiel/build/qa/machine-transfer-windows-qa.png"
          $runTransfer = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-machine-transfer-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runTransfer.ExitCode -ne 0) { throw "O launcher portable falhou em Enviar para a máquina." }
          if (!(Test-Path $transferScreenshot) -or (Get-Item $transferScreenshot).Length -lt 10000) {
            throw "Tela Enviar para a máquina não renderizada no launcher portable."
          }
          $drawingScreenshot = "windows-fiel/build/qa/create-drawing-windows-qa.png"
          $runDrawing = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-create-drawing-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runDrawing.ExitCode -ne 0) { throw "O launcher portable falhou em Criar desenho." }
          if (!(Test-Path $drawingScreenshot) -or (Get-Item $drawingScreenshot).Length -lt 10000) {
            throw "Tela Criar desenho nao foi renderizada no launcher portable."
          }
          $archiveScreenshot = "windows-fiel/build/qa/archive-inventory-windows-qa.png"
          $runArchive = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-archive-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runArchive.ExitCode -ne 0) { throw "O launcher portable falhou em Analisar ZIP." }
          if (!(Test-Path $archiveScreenshot) -or (Get-Item $archiveScreenshot).Length -lt 10000) {
            throw "Tela Analisar ZIP nao foi renderizada no launcher portable."
          }
          $createNameScreenshot = "windows-fiel/build/qa/create-name-windows-original-port.png"
          $runCreateName = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-create-name-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runCreateName.ExitCode -ne 0) { throw "O launcher portable falhou em Criar Nome." }
          if (!(Test-Path $createNameScreenshot) -or (Get-Item $createNameScreenshot).Length -lt 10000) {
            throw "Tela Criar Nome não renderizada no launcher portable."
          }
          $nameEditorScreenshot = "windows-fiel/build/qa/name-editor-windows-original-port.png"
          $runNameEditor = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-name-editor-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runNameEditor.ExitCode -ne 0) { throw "O launcher portable falhou no Editor de Nomes." }
          if (!(Test-Path $nameEditorScreenshot) -or (Get-Item $nameEditorScreenshot).Length -lt 10000) {
            throw "Editor de Nomes não renderizado no launcher portable."
          }
          # Real Swing chooser, Windows Robot Enter and original Android
          # parser/Viewer; synthetic PES and FLP, never a customer file.
          foreach ($format in @("pes", "flp")) {
            $flag = "--qa-open-chooser-$format"
            $opened = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @($flag) -WorkingDirectory $working -PassThru -Wait
            if ($opened.ExitCode -ne 0) {
              throw "Abrir matriz $format falhou no Windows (exit $($opened.ExitCode))."
            }
            $marker = "windows-fiel/build/qa/chooser-$format-opened.txt"
            $preview = "windows-fiel/build/qa/chooser-$format-viewer.png"
            if (!(Test-Path $marker) -or !(Test-Path $preview) -or
                (Get-Item $preview).Length -lt 10000) {
              throw "Abrir matriz $format nao chegou ao Viewer."
            }
          }
          "BROTHER_WINDOWS_CHOOSER_PES_FLP_REAL_SMOKE_OK"
          "BROTHER_WINDOWS_PORTABLE_LAUNCHER_SMOKE_OK"
      - name: Preparar pasta completa do executavel para QA (sem instalar)
        shell: pwsh
        run: |
          $base = "windows-fiel/build/qa/portable"
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          Copy-Item -LiteralPath $env:BM_PORTABLE_DIR -Destination $base -Recurse -Force
          $name = Split-Path $env:BM_PORTABLE_DIR -Leaf
          $inside = Join-Path $base $name
          $shortcutScript = "windows-fiel/distribution/Criar-Atalhos-Brother-Matrizes.cmd"
          if (!(Test-Path -LiteralPath $shortcutScript -PathType Leaf)) {
            throw "Script opcional de atalhos Brother Matrizes ausente."
          }
          Copy-Item -LiteralPath $shortcutScript -Destination $inside
          if (!(Test-Path (Join-Path $inside "BrotherMatrizes.exe"))) {
            throw "O launcher nao esta no ZIP QA."
          }
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $inside "BrotherMatrizes.exe")).Hash
          @(
            "BROTHER MATRIZES WINDOWS - PACOTE INTERNO DE QA"
            "Esta NAO e a versao comercial. Nao publicar em site, grupo ou clientes."
            "Extraia TODA a pasta antes de executar BrotherMatrizes.exe."
            "Inclui runtime Java e icone oficial do Android. Nao requer instalador nem altera o registro."
            "Atalhos: no menu Windows do aplicativo escolha Criar atalhos no Menu Iniciar e Area de Trabalho."
            "Alternativa: execute Criar-Atalhos-Brother-Matrizes.cmd da pasta extraida."
            "Opcional: execute Criar-Atalhos-Brother-Matrizes.cmd para criar atalhos Brother Matrizes"
            "na Area de Trabalho e no Menu Iniciar da conta Windows atual; sem permissao de administrador."
            "Mantenha a pasta extraida no mesmo local apos criar os atalhos; se mudar, recrie-os."
            "O arquivo de atalhos nao transmite dados, altera o Supabase ou cria associacoes de arquivo."
            "Google OAuth real, importacao TTF/OTF e recursos comerciais ainda nao homologados."
            "Envio para maquina: exportacao manual em arquivo/pendrive. Sem Wi-Fi/USB direto ou teste em bordadeira."
            "Criar desenho: SVG local e desenho livre Android em QA; sem garantia de SVG complexo ou teste em cliente."
            "Extrator: leitura ZIP RAR RAR5 7Z. Validação Android PES DST JEF/FLP e Skia TTF isolados em QA, sem importação comercial na interface."
            "Cotas: journal V3, lock multiprocesso e diagnóstico read-only testados; nunca conciliam, excluem ou liberam importação automaticamente."
            "Fontes: catálogos DaFont/NetFontes agora visíveis na QA, com login Google/cota DaFont ainda bloqueados; geração comercial externa segue indisponível."
            "Autenticação Google/DPAPI e entitlement: QA com servidor simulado; redirect e login reais ainda nao homologados."
            "Codigo: feature/windows-fiel-android-1-11-8-20261106"
            "Commit: $env:GITHUB_SHA"
            "SHA256 BrotherMatrizes.exe: $hash"
            "EXE QA sem assinatura digital: o SmartScreen pode apresentar aviso."
            "Nao desative SmartScreen ou Windows Defender; assinatura Authenticode comercial pendente."
          ) | Set-Content -Path (Join-Path $inside "LEIA-ME-QA.txt") -Encoding utf8
          if (!(Test-Path (Join-Path $inside "runtime"))) {
            throw "A copia de QA perdeu o runtime Java."
          }
          # Internal QA must be unsigned, never claim trusted Windows publisher.
          $signature = (Get-AuthenticodeSignature -FilePath (
            Join-Path $inside "BrotherMatrizes.exe"
          )).Status
          if ($signature -ne [System.Management.Automation.SignatureStatus]::NotSigned) {
            throw "Assinatura QA inesperada: $signature"
          }
          "BROTHER_WINDOWS_UNSIGNED_QA_DISCLOSED_AND_SHA256_OK"
          # Testa os atalhos reais no usuario efemero do runner Windows;
          # nunca executa em maquinas ou ambientes de clientes.
          $shell = New-Object -ComObject WScript.Shell
          $folders = @(
            [Environment]::GetFolderPath("DesktopDirectory"),
            [Environment]::GetFolderPath("Programs")
          )
          $links = @($folders | ForEach-Object {
            if ([string]::IsNullOrWhiteSpace($_) -or !(Test-Path -LiteralPath $_ -PathType Container)) {
              throw "Pasta Desktop/Menu Iniciar indisponivel no runner QA."
            }
            Join-Path $_ "Brother Matrizes.lnk"
          })
          if (@($links | Where-Object { Test-Path -LiteralPath $_ }).Count -gt 0) {
            throw "Runner contem atalhos preexistentes; nao sobrescrever."
          }
          try {
            $shortcutLauncher = (Resolve-Path (Join-Path $inside "BrotherMatrizes.exe")).Path
            $cmdPath = (Resolve-Path (Join-Path $inside "Criar-Atalhos-Brother-Matrizes.cmd")).Path
            & $cmdPath
            if ($LASTEXITCODE -ne 0) { throw "Script opcional de atalhos falhou no Windows." }
            foreach ($link in $links) {
              if (!(Test-Path -LiteralPath $link -PathType Leaf)) {
                throw "Atalho Brother Matrizes nao foi criado: $link"
              }
              $saved = $shell.CreateShortcut($link)
              if (![string]::Equals(
                [IO.Path]::GetFullPath($saved.TargetPath),
                [IO.Path]::GetFullPath($shortcutLauncher),
                [StringComparison]::OrdinalIgnoreCase
              )) {
                throw "Atalho nao aponta para executavel portable completo."
              }
            }
            "BROTHER_WINDOWS_PORTABLE_DESKTOP_STARTMENU_SHORTCUTS_OK"
          } finally {
            # Runner descartavel; impedir artefatos residuais mesmo em falha.
            foreach ($link in $links) {
              if (Test-Path -LiteralPath $link) { Remove-Item -LiteralPath $link -Force }
            }
          }
          # jpackage EMBUTE o .ico nos recursos do .exe e normalmente nao
          # copia o arquivo .ico para a pasta app-image. Conferir o recurso
          # real do launcher pelo Windows GDI, sem depender de nome/caminho.
          Add-Type -AssemblyName System.Drawing
          $sourceIco = (Resolve-Path "windows-fiel/build/qa/brand/brother_matrizes.ico").Path
          $launcher = (Resolve-Path (Join-Path $inside "BrotherMatrizes.exe")).Path
          $expectedIcon = [System.Drawing.Icon]::new($sourceIco)
          $launcherIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($launcher)
          if ($null -eq $launcherIcon) { throw "O launcher nao possui icone do Windows." }
          try {
            $expectedBitmap = [System.Drawing.Bitmap]::new($expectedIcon.ToBitmap(), 32, 32)
            $launcherBitmap = [System.Drawing.Bitmap]::new($launcherIcon.ToBitmap(), 32, 32)
            try {
              $different = 0
              $total = 0
              for ($y = 2; $y -lt 30; $y += 2) {
                for ($x = 2; $x -lt 30; $x += 2) {
                  $a = $expectedBitmap.GetPixel($x, $y)
                  $b = $launcherBitmap.GetPixel($x, $y)
                  $total++
                  if ([Math]::Abs([int]$a.R - [int]$b.R) -gt 50 -or
                      [Math]::Abs([int]$a.G - [int]$b.G) -gt 50 -or
                      [Math]::Abs([int]$a.B - [int]$b.B) -gt 50) {
                    $different++
                  }
                }
              }
              if ($different -gt [Math]::Floor($total * 0.40)) {
                throw "Icone do EXE nao corresponde ao monograma Android ($different/$total)."
              }
              "BROTHER_WINDOWS_LAUNCHER_OFFICIAL_BRAND_ICON_OK"
            } finally {
              $expectedBitmap.Dispose()
              $launcherBitmap.Dispose()
            }
          } finally {
            $expectedIcon.Dispose()
            $launcherIcon.Dispose()
          }
      - name: Publicar SOMENTE artifact privado de Actions por 7 dias
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-Windows-PORTABLE-QA-NÃO-COMERCIAL
          path: windows-fiel/build/qa/portable/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Guardar XML de falhas Kotlin para diagnostico preciso (dados ficticios)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Windows-Portable-Kotlin-Test-Failures
          path: windows-fiel/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 3
      - name: Anexar capturas do launcher portable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Windows-Portable-QA-Screenshots
          path: |
            windows-fiel/build/qa/home-windows-original-port.png
            windows-fiel/build/qa/account-windows-readonly-qa.png
            windows-fiel/build/qa/community-windows-official-news-qa.png
            windows-fiel/build/qa/fonts-windows-readonly-qa.png
            windows-fiel/build/qa/machine-transfer-windows-qa.png
            windows-fiel/build/qa/create-drawing-windows-qa.png
            windows-fiel/build/qa/archive-inventory-windows-qa.png
            windows-fiel/build/qa/create-name-windows-original-port.png
            windows-fiel/build/qa/name-editor-windows-original-port.png
            windows-fiel/build/qa/chooser-pes-viewer.png
            windows-fiel/build/qa/chooser-flp-viewer.png
          if-no-files-found: warn
          retention-days: 7
