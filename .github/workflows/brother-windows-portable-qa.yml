name: Brother Matrizes - Windows executavel portable interno (QA)

on:
  push:
    branches:
      - feature/windows-fiel-android-1-11-8-20261106
    paths:
      - "windows-fiel/build.gradle.kts"
      - "windows-fiel/qa/preparar_icone_windows.py"
      - "windows-fiel/qa/preparar_recursos_android.py"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/FielMain.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopMachineTransferFile.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopSvgFilePicker.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopArchiveInventory.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/DesktopArchivePreviewScreen.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopArchiveInventoryTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopArchiveRar7zInventoryTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopSvgFilePickerTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopMachineTransferFileTest.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/DesktopAccountQaScreen.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/DesktopFontCatalogScreen.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopReadOnlyFontAnalyzer.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopReadOnlyFontAnalyzerTest.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopWindowsGoogleQaEnvironment.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopGoogleProviderReadiness.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopPkceLoopbackSelfTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopPkceLoopbackSelfTestTest.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopBrotherFontUsageGateway.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopCommercialFontImportGate.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopBrotherFontUsageGatewayTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopCommercialFontImportGateTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopGoogleProviderReadinessTest.kt"
      - "branding/brother_bm_launcher_safe.webp.base64"
      - ".github/workflows/brother-windows-portable-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-windows-portable-qa
  cancel-in-progress: true

jobs:
  app-image:
    name: Compilar launcher Windows + JRE portable, sem instalador
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      BROTHER_WINDOWS_QA_GOOGLE_AUTH: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Gerar ICO do mesmo monograma do launcher Android original
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          if ($LASTEXITCODE -ne 0) { throw "Pillow QA nao pode ser instalado." }
          python windows-fiel/qa/preparar_icone_windows.py --out windows-fiel/build/qa/brand/brother_matrizes.ico
          if ($LASTEXITCODE -ne 0) { throw "O icone premium Android nao pode ser convertido." }
          $ico = "windows-fiel/build/qa/brand/brother_matrizes.ico"
          if (!(Test-Path $ico) -or (Get-Item $ico).Length -lt 1024) {
            throw "Arquivo ICO de marca Brother Matrizes ausente ou incompleto."
          }
      - name: Compilar testes locais prioritarios sem dados comerciais
        shell: pwsh
        run: |
          gradle -p windows-fiel test --no-daemon --stacktrace --tests '*DesktopAndroidProjectRecoveryTest' --tests '*DesktopFlpBackupRestorerTest' --tests '*DesktopAccountQaScreenTest' --tests '*DesktopLaunchDocumentTest' --tests '*DesktopGoogleProviderReadinessTest' --tests '*DesktopReadOnlyFontAnalyzerTest' --tests '*DesktopBrotherFontUsageGatewayTest' --tests '*DesktopCommercialFontImportGateTest' --tests '*DesktopPkceLoopbackSelfTestTest' --tests '*DesktopPkceLoopbackListenerTest' --tests '*DesktopMachineTransferFileTest' --tests '*DesktopSvgFilePickerTest' --tests '*DesktopArchiveInventoryTest' --tests '*DesktopArchiveRar7zInventoryTest'
          if ($LASTEXITCODE -ne 0) { throw "QA Windows portable bloqueada por testes." }
      - name: Criar imagem APP-IMAGE sem EXE/MSI instalador
        shell: pwsh
        run: |
          gradle -p windows-fiel createDistributable --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Compose createDistributable falhou." }
          $root = "windows-fiel/build/compose/binaries"
          if (!(Test-Path $root)) { throw "Imagem de aplicativo Windows ausente." }
          $launchers = @(Get-ChildItem $root -Recurse -File -Filter "BrotherMatrizesQA.exe" -ErrorAction Stop)
          if ($launchers.Count -ne 1) { throw "Era esperado exatamente um launcher de QA; encontrados: $($launchers.Count)" }
          $exe = $launchers[0]
          $appDir = $exe.DirectoryName
          if (!(Test-Path (Join-Path $appDir "app"))) { throw "JAR/recursos portables nao incluidos." }
          if (!(Test-Path (Join-Path $appDir "runtime"))) { throw "Runtime Java embutido nao encontrado." }
          if ((Get-Item $exe.FullName).Length -lt 10000) { throw "Launcher Windows incompleto." }
          if (@(Get-ChildItem $root -Recurse -File -Filter "*.msi").Count -gt 0) {
            throw "A QA nao pode produzir instalador MSI."
          }
          "BROTHER_WINDOWS_APP_IMAGE_LAUNCHER_OK " + $exe.FullName
          "BM_PORTABLE_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
          "BM_PORTABLE_DIR=$appDir" >> $env:GITHUB_ENV
      - name: Executar launcher portable e capturar Home no proprio Windows
        shell: pwsh
        run: |
          $working = (Resolve-Path "windows-fiel").Path
          $homeScreenshot = "windows-fiel/build/qa/home-windows-original-port.png"
          $accountScreenshot = "windows-fiel/build/qa/account-windows-readonly-qa.png"
          $runHome = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-home-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runHome.ExitCode -ne 0) { throw "O launcher portable falhou na Home: $($runHome.ExitCode)" }
          if (!(Test-Path $homeScreenshot) -or (Get-Item $homeScreenshot).Length -lt 10000) {
            throw "A Home do launcher portable nao foi renderizada."
          }
          $runAccount = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-account-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runAccount.ExitCode -ne 0) { throw "O launcher portable falhou em Minha Conta: $($runAccount.ExitCode)" }
          if (!(Test-Path $accountScreenshot) -or (Get-Item $accountScreenshot).Length -lt 10000) {
            throw "Minha Conta do launcher portable nao foi renderizada."
          }
          $fontsScreenshot = "windows-fiel/build/qa/fonts-windows-readonly-qa.png"
          $runFonts = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-fonts-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runFonts.ExitCode -ne 0) { throw "O launcher portable falhou na Biblioteca de Fontes: $($runFonts.ExitCode)" }
          if (!(Test-Path $fontsScreenshot) -or (Get-Item $fontsScreenshot).Length -lt 10000) {
            throw "Biblioteca de Fontes não foi renderizada pelo launcher portable."
          }
          $transferScreenshot = "windows-fiel/build/qa/machine-transfer-windows-qa.png"
          $runTransfer = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-machine-transfer-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runTransfer.ExitCode -ne 0) { throw "O launcher portable falhou em Enviar para a máquina." }
          if (!(Test-Path $transferScreenshot) -or (Get-Item $transferScreenshot).Length -lt 10000) {
            throw "Tela Enviar para a máquina não renderizada no launcher portable."
          }
          $drawingScreenshot = "windows-fiel/build/qa/create-drawing-windows-qa.png"
          $runDrawing = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-create-drawing-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runDrawing.ExitCode -ne 0) { throw "O launcher portable falhou em Criar desenho." }
          if (!(Test-Path $drawingScreenshot) -or (Get-Item $drawingScreenshot).Length -lt 10000) {
            throw "Tela Criar desenho nao foi renderizada no launcher portable."
          }
          $archiveScreenshot = "windows-fiel/build/qa/archive-inventory-windows-qa.png"
          $runArchive = Start-Process -FilePath $env:BM_PORTABLE_EXE -ArgumentList @("--capture-archive-qa") -WorkingDirectory $working -PassThru -Wait
          if ($runArchive.ExitCode -ne 0) { throw "O launcher portable falhou em Analisar ZIP." }
          if (!(Test-Path $archiveScreenshot) -or (Get-Item $archiveScreenshot).Length -lt 10000) {
            throw "Tela Analisar ZIP nao foi renderizada no launcher portable."
          }
          "BROTHER_WINDOWS_PORTABLE_LAUNCHER_SMOKE_OK"
      - name: Preparar pasta completa do executavel para QA (sem instalar)
        shell: pwsh
        run: |
          $base = "windows-fiel/build/qa/portable"
          New-Item -ItemType Directory -Force -Path $base | Out-Null
          Copy-Item -LiteralPath $env:BM_PORTABLE_DIR -Destination $base -Recurse -Force
          $name = Split-Path $env:BM_PORTABLE_DIR -Leaf
          $inside = Join-Path $base $name
          if (!(Test-Path (Join-Path $inside "BrotherMatrizesQA.exe"))) {
            throw "O launcher nao esta no ZIP QA."
          }
          $hash = (Get-FileHash -Algorithm SHA256 (Join-Path $inside "BrotherMatrizesQA.exe")).Hash
          @(
            "BROTHER MATRIZES WINDOWS - PACOTE INTERNO DE QA"
            "Esta NAO e a versao comercial. Nao publicar em site, grupo ou clientes."
            "Extraia TODA a pasta. Execute BrotherMatrizesQA.exe dentro dela."
            "Inclui runtime Java e monograma premium original Android; nao cria atalhos nem associa arquivos."
            "Google OAuth real, importacao TTF/OTF e recursos comerciais ainda nao homologados."
            "Envio para maquina: exportacao manual em arquivo/pendrive. Sem Wi-Fi/USB direto ou teste em bordadeira."
            "Criar desenho: SVG local e desenho livre Android em QA; sem garantia de SVG complexo ou teste em cliente."
            "Extrator: metadados ZIP RAR RAR5 7Z. Sem extração, senha, cobrança ou importação comercial."
            "Codigo: feature/windows-fiel-android-1-11-8-20261106"
            "Commit: $env:GITHUB_SHA"
            "SHA256 BrotherMatrizesQA.exe: $hash"
          ) | Set-Content -Path (Join-Path $inside "LEIA-ME-QA.txt") -Encoding utf8
          if (!(Test-Path (Join-Path $inside "runtime"))) {
            throw "A copia de QA perdeu o runtime Java."
          }
          # jpackage EMBUTE o .ico nos recursos do .exe e normalmente nao
          # copia o arquivo .ico para a pasta app-image. Conferir o recurso
          # real do launcher pelo Windows GDI, sem depender de nome/caminho.
          Add-Type -AssemblyName System.Drawing
          $sourceIco = (Resolve-Path "windows-fiel/build/qa/brand/brother_matrizes.ico").Path
          $launcher = (Resolve-Path (Join-Path $inside "BrotherMatrizesQA.exe")).Path
          $expectedIcon = [System.Drawing.Icon]::new($sourceIco)
          $launcherIcon = [System.Drawing.Icon]::ExtractAssociatedIcon($launcher)
          if ($null -eq $launcherIcon) { throw "O launcher nao possui icone do Windows." }
          try {
            $expectedBitmap = [System.Drawing.Bitmap]::new($expectedIcon.ToBitmap(), 32, 32)
            $launcherBitmap = [System.Drawing.Bitmap]::new($launcherIcon.ToBitmap(), 32, 32)
            try {
              $different = 0
              $total = 0
              for ($y = 2; $y -lt 30; $y += 2) {
                for ($x = 2; $x -lt 30; $x += 2) {
                  $a = $expectedBitmap.GetPixel($x, $y)
                  $b = $launcherBitmap.GetPixel($x, $y)
                  $total++
                  if ([Math]::Abs([int]$a.R - [int]$b.R) -gt 50 -or
                      [Math]::Abs([int]$a.G - [int]$b.G) -gt 50 -or
                      [Math]::Abs([int]$a.B - [int]$b.B) -gt 50) {
                    $different++
                  }
                }
              }
              if ($different -gt [Math]::Floor($total * 0.40)) {
                throw "Icone do EXE nao corresponde ao monograma Android ($different/$total)."
              }
              "BROTHER_WINDOWS_LAUNCHER_OFFICIAL_BRAND_ICON_OK"
            } finally {
              $expectedBitmap.Dispose()
              $launcherBitmap.Dispose()
            }
          } finally {
            $expectedIcon.Dispose()
            $launcherIcon.Dispose()
          }
      - name: Publicar SOMENTE artifact privado de Actions por 7 dias
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-Windows-PORTABLE-QA-NÃO-COMERCIAL
          path: windows-fiel/build/qa/portable/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1
      - name: Anexar capturas do launcher portable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Windows-Portable-QA-Screenshots
          path: |
            windows-fiel/build/qa/home-windows-original-port.png
            windows-fiel/build/qa/account-windows-readonly-qa.png
            windows-fiel/build/qa/fonts-windows-readonly-qa.png
            windows-fiel/build/qa/machine-transfer-windows-qa.png
            windows-fiel/build/qa/create-drawing-windows-qa.png
            windows-fiel/build/qa/archive-inventory-windows-qa.png
          if-no-files-found: warn
          retention-days: 7
