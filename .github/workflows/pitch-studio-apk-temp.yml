name: Pitch Studio APK Temp

on:
  push:
    branches:
      - ci/pitch-studio-apk-temp

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstituir projeto
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pitchstudio-ci
          cat .pitchstudio-build/part*.b64 > /tmp/pitchstudio.b64
          base64 -d /tmp/pitchstudio.b64 > /tmp/PitchStudioAndroid.zip
          unzip -q /tmp/PitchStudioAndroid.zip -d pitchstudio-ci
          test -f pitchstudio-ci/PitchStudioAndroid/settings.gradle.kts
          if [ -f .pitchstudio-build/patch.sh ]; then
            bash .pitchstudio-build/patch.sh "$GITHUB_WORKSPACE/pitchstudio-ci/PitchStudioAndroid"
          fi

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: SDK 35
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compilar APK
        working-directory: pitchstudio-ci/PitchStudioAndroid
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PitchStudio-debug-apk
          path: pitchstudio-ci/PitchStudioAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
