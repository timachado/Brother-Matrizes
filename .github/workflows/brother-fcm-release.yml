name: Brother Matrizes - enviar aviso FCM de release publicada

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Codigo da versao ja publicada no manifesto stable
        required: true
        type: string
      version_name:
        description: Nome da versao ja publicada
        required: true
        type: string
      release_sha256:
        description: SHA-256 do APK comercial ja publicado
        required: true
        type: string
      dry_run:
        description: Testar autenticacao e payload sem entregar notificacoes
        required: true
        type: boolean
        default: true
      confirm_live:
        description: Para envio real digite ENVIAR seguido de espaco e versionCode
        required: false
        type: string
        default: NAO

permissions:
  contents: read

concurrency:
  group: brother-fcm-release-stable
  cancel-in-progress: false

jobs:
  send-release-notification:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout sem credenciais persistentes
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe do emissor
        run: node --check .github/scripts/send-brother-fcm-release.mjs
      - name: Instalar Firebase Admin SDK sem scripts de pacotes
        run: npm install --prefix .github/scripts --no-save --ignore-scripts --no-audit --no-fund firebase-admin@14.5.0
      - name: Verificar manifesto e processar envio FCM
        env:
          BROTHER_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.BROTHER_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node .github/scripts/send-brother-fcm-release.mjs
