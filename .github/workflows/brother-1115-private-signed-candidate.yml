name: Brother 1.10.15 - APK homologacao privada assinada

on:
  push:
    branches: [fix/brother-1115-opentype-preflight]
    paths:
      - '.github/workflows/brother-1115-private-signed-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-1115-private-signed-preflight
  cancel-in-progress: false

jobs:
  candidate:
    name: Compilar, testar e assinar sem publicar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: brother-release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/brother-1115-opentype-preflight
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Garantir isolamento comercial e atualizacao segura
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -Fq 'versionCode = 191' app/build.gradle.kts
          grep -Fq 'versionName = "1.10.15"' app/build.gradle.kts
          test -s app/src/main/java/com/timachado/brothermatrizes/font/OpenTypeRunSafety.kt
          test -s app/src/test/java/com/timachado/brothermatrizes/font/OpenTypeRunSafetyTest.kt
          grep -Fq 'positionedStyle = appliedPositionedStyle' app/src/main/java/com/timachado/brothermatrizes/CreateNameScreen.kt
          test -s app/src/main/java/com/timachado/brothermatrizes/ui/updates/BrotherVersionGate.kt
          grep -Fq 'ensureGoogleSession()' app/src/main/java/com/timachado/brothermatrizes/MainActivity.kt
      - name: Build release e testes unitarios
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Assinar e verificar certificado original de producao
        shell: bash
        env:
          RELEASE_JKS_B64: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for key in RELEASE_JKS_B64 RELEASE_STORE_PASS RELEASE_KEY_ALIAS RELEASE_KEY_PASS; do
            test -n "${!key:-}" || { echo "::error::Assinatura comercial indisponivel"; exit 1; }
          done
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$RELEASE_JKS_B64" | base64 -d > "$tmp/original.jks"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          "$tools/zipalign" -f -p 4 "$unsigned" "$tmp/aligned.apk"
          mkdir -p dist
          signed="dist/Brother-Matrizes-1.10.15-OPENTYPE-HOMOLOGACAO-PRIVADA.apk"
          export RELEASE_STORE_PASS RELEASE_KEY_PASS
          "$tools/apksigner" sign --ks "$tmp/original.jks" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASS \
            --key-pass env:RELEASE_KEY_PASS \
            --out "$signed" "$tmp/aligned.apk"
          "$tools/zipalign" -c -p 4 "$signed"
          audit="$("$tools/apksigner" verify --verbose --print-certs "$signed")"
          printf '%s\n' "$audit" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          printf '%s\n' "$audit" | grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true'
          cert="$(printf '%s\n' "$audit" | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]{64})$/\1/p' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a" || {
            echo "::error::Certificado diferente do comercial"; exit 1;
          }
          badging="$("$tools/aapt" dump badging "$signed" | head -n1)"
          [[ "$badging" == *"name='com.timachado.brothermatrizes'"* ]]
          [[ "$badging" == *"versionCode='191'"* ]]
          [[ "$badging" == *"versionName='1.10.15'"* ]]
          sha256sum "$signed" > dist/APK-SHA256.txt
          printf '%s\n' 'APK privado para testes. Nao publicar no site, no release ou no manifesto.'
      - name: Guardar APK somente como artefato privado temporario
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-1.10.15-Opentype-APK-Privado
          path: |
            dist/Brother-Matrizes-1.10.15-OPENTYPE-HOMOLOGACAO-PRIVADA.apk
            dist/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 7
