name: QA NetFontes - Browser e Importacao ZIP

on:
  push:
    branches:
      - feature/netfontes-font-browser-20261015
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-netfontes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout da branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Instalar Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Conferir base oficial e arquivos
        run: |
          grep -Fq 'versionCode = 184' app/build.gradle.kts
          grep -Fq 'versionName = "1.10.8"' app/build.gradle.kts
          test -f app/src/main/java/com/timachado/brothermatrizes/font/NetFontesNavigationRules.kt
      - name: Preparar identidade visual oficial
        run: bash scripts/prepare_brand_assets.sh
      - name: Testes unitarios
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Compilar APK de diagnostico SEM assinatura de producao
        run: gradle :app:assembleDebug --stacktrace
      - name: Analisar lint Android
        run: gradle :app:lintDebug --stacktrace
      - name: Armazenar APK de diagnostico
        uses: actions/upload-artifact@v4
        with:
          name: brother-netfontes-qa-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
