name: Build Pitch Studio APK

on:
  push:
    branches:
      - pitch-studio-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recriar projeto Pitch Studio
        shell: bash
        run: |
          set -euo pipefail
          cat .pitchstudio/part01.b64               .pitchstudio/part02.b64               .pitchstudio/part03.b64               .pitchstudio/part04.b64               .pitchstudio/part05.b64               .pitchstudio/part06.b64 > "$RUNNER_TEMP/PitchStudioAndroid.zip.b64"
          test "$(wc -c < "$RUNNER_TEMP/PitchStudioAndroid.zip.b64")" -eq 39716
          base64 --decode "$RUNNER_TEMP/PitchStudioAndroid.zip.b64" > "$RUNNER_TEMP/PitchStudioAndroid.zip"
          unzip -t "$RUNNER_TEMP/PitchStudioAndroid.zip"
          mkdir -p "$RUNNER_TEMP/pitchstudio-src"
          unzip -q "$RUNNER_TEMP/PitchStudioAndroid.zip" -d "$RUNNER_TEMP/pitchstudio-src"
          test -f "$RUNNER_TEMP/pitchstudio-src/PitchStudioAndroid/app/build.gradle.kts"

      - name: Aplicar Pitch Studio v1.1
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/pitchstudio-src/PitchStudioAndroid"
          cat .pitchstudio/online01.b64 .pitchstudio/online02a.b64 .pitchstudio/online02b.b64 .pitchstudio/online02c.b64 | base64 --decode > "$SRC/app/src/main/java/br/com/timachado/pitchstudio/OnlineMusic.kt"
          test "$(wc -c < "$SRC/app/src/main/java/br/com/timachado/pitchstudio/OnlineMusic.kt")" -eq 10031

          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["RUNNER_TEMP"]) / "pitchstudio-src/PitchStudioAndroid"

          # Gradle: versão 1.1.0 + DSL atual do Kotlin.
          p = root / "app/build.gradle.kts"
          s = p.read_text(encoding="utf-8")
          s = s.replace("versionCode = 1", "versionCode = 2")
          s = s.replace('versionName = "1.0.0"', 'versionName = "1.1.0"')
          s = s.replace('    kotlinOptions { jvmTarget = "17" }\n', "")
          if "import org.jetbrains.kotlin.gradle.dsl.JvmTarget" not in s:
              s = "import org.jetbrains.kotlin.gradle.dsl.JvmTarget\n\n" + s
          if "kotlin {\n    compilerOptions" not in s:
              s += '\n\nkotlin {\n    compilerOptions {\n        jvmTarget = JvmTarget.fromTarget("17")\n    }\n}\n'
          p.write_text(s, encoding="utf-8")

          # INTERNET somente para busca oficial e importação de URL HTTPS direta.
          p = root / "app/src/main/AndroidManifest.xml"
          s = p.read_text(encoding="utf-8")
          if 'android.permission.INTERNET' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />'
              )
          p.write_text(s, encoding="utf-8")

          # Decoder: adiciona entrada por arquivo temporário baixado.
          p = root / "app/src/main/java/br/com/timachado/pitchstudio/audio/AudioDecoder.kt"
          s = p.read_text(encoding="utf-8")
          if "fun decodeFile(" not in s:
              start = s.index("    fun decode(")
              extractor_marker = "        val extractor = MediaExtractor()\n        extractor.setDataSource(context, uri, null)"
              marker_pos = s.index(extractor_marker, start)
              old = s[start:marker_pos + len(extractor_marker)]
              new = '''    fun decode(
              context: Context,
              uri: Uri,
              displayName: String,
              onProgress: (Progress) -> Unit = {}
          ): AudioProject = decodeInternal(context, displayName, onProgress) { extractor ->
              extractor.setDataSource(context, uri, null)
          }

          fun decodeFile(
              context: Context,
              file: File,
              displayName: String,
              onProgress: (Progress) -> Unit = {}
          ): AudioProject = decodeInternal(context, displayName, onProgress) { extractor ->
              extractor.setDataSource(file.absolutePath)
          }

          private fun decodeInternal(
              context: Context,
              displayName: String,
              onProgress: (Progress) -> Unit,
              setSource: (MediaExtractor) -> Unit
          ): AudioProject {
              val extractor = MediaExtractor()
              setSource(extractor)'''
              s = s[:start] + new + s[start + len(old):]
          p.write_text(s, encoding="utf-8")

          # MainActivity: acrescenta os dois novos fluxos sem alterar o motor já aprovado.
          p = root / "app/src/main/java/br/com/timachado/pitchstudio/MainActivity.kt"
          s = p.read_text(encoding="utf-8")

          if "OnlineMusic.showYouTubeSearch" not in s:
              marker = '        waveform = WaveformView(this).apply {'
              idx = s.index(marker)
              online = '''        val online = row()
          online.addView(button("Buscar no YouTube") {
              OnlineMusic.showYouTubeSearch(this) { statusLabel.text = it }
          }, LinearLayout.LayoutParams(0, dp(52), 1f).apply { marginEnd = dp(6) })
          online.addView(button("Importar link de áudio") {
              OnlineMusic.showDirectAudioImport(
                  activity = this,
                  cacheDir = cacheDir,
                  onStatus = { statusLabel.text = it },
                  onProgress = { message, value -> showProgress(message, value) },
                  onDownloaded = { file, name -> loadRemoteAudio(file, name) },
                  onError = { message -> hideProgress("Falha ao importar: " + message) }
              )
          }, LinearLayout.LayoutParams(0, dp(52), 1f).apply { marginStart = dp(6) })
          root.addView(online, full(wrap(), top = 10))
          root.addView(
              text("YouTube usa a busca oficial. Links HTTPS diretos de áudio podem ser importados e processados localmente.", 12f, false),
              full(wrap(), top = 6)
          )

          '''
              s = s[:idx] + online + s[idx:]

          if "private fun loadRemoteAudio(" not in s:
              marker = '    private fun pickAudio() {'
              idx = s.index(marker)
              method = '''    private fun loadRemoteAudio(file: File, name: String) {
              player.pause()
              refreshPlayButton()
              showProgress("Decodificando áudio importado…", 0)
              executor.execute {
                  try {
                      val p = AudioDecoder.decodeFile(this, file, name) { pr ->
                          handler.post { showProgress(pr.message, pr.percent) }
                      }
                      val estimate = try { KeyEstimator.estimate(p) } catch (_: Throwable) { null }
                      file.delete()
                      handler.post {
                          player.pause()
                          cleanupProjects()
                          fileLabel.text = name
                          original = p
                          processed = null
                          keyEstimate = estimate
                          waveform.waveform = p.waveform
                          waveform.progress = 0.0
                          player.setProject(p)
                          useProcessed = false
                          updateAbButton()
                          updateKeyLabel()
                          hideProgress("Áudio importado da internet. O processamento permanece local no aparelho.")
                          scheduleProcess(immediate = true)
                      }
                  } catch (t: Throwable) {
                      file.delete()
                      handler.post {
                          hideProgress("Falha ao decodificar o áudio importado: " + (t.message ?: "formato incompatível"))
                      }
                  }
              }
          }

          '''
              s = s[:idx] + method + s[idx:]

          p.write_text(s, encoding="utf-8")

          print("Pitch Studio v1.1 aplicado.")
          PY

      - name: Aplicar Pitch Studio v1.2
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/pitchstudio-src/PitchStudioAndroid"

          cp .pitchstudio/v12/ExtractorDownloader.kt "$SRC/app/src/main/java/br/com/timachado/pitchstudio/ExtractorDownloader.kt"
          cp .pitchstudio/v12/YouTubeImporter.kt "$SRC/app/src/main/java/br/com/timachado/pitchstudio/YouTubeImporter.kt"
          cp .pitchstudio/v12/YouTubeUi.kt "$SRC/app/src/main/java/br/com/timachado/pitchstudio/YouTubeUi.kt"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["RUNNER_TEMP"]) / "pitchstudio-src/PitchStudioAndroid"

          # JitPack para NewPipeExtractor.
          p = root / "settings.gradle.kts"
          s = p.read_text(encoding="utf-8")
          if "https://jitpack.io" not in s:
              s = s.replace(
                  "mavenCentral()",
                  'mavenCentral()\n        maven { url = uri("https://jitpack.io") }'
              )
          p.write_text(s, encoding="utf-8")

          # v1.2 + dependências do extrator local.
          p = root / "app/build.gradle.kts"
          s = p.read_text(encoding="utf-8")
          s = s.replace("versionCode = 2", "versionCode = 3")
          s = s.replace('versionName = "1.1.0"', 'versionName = "1.2.0"')

          if "isCoreLibraryDesugaringEnabled = true" not in s:
              s, count = re.subn(
                  r'(targetCompatibility\s*=\s*JavaVersion\.VERSION_17\s*\n)(\s*})',
                  r'\1        isCoreLibraryDesugaringEnabled = true\n\2',
                  s,
                  count=1
              )
              if count != 1:
                  raise SystemExit("compileOptions não encontrado para desugaring")

          if "com.github.teamnewpipe:newpipeextractor:0.26.5" not in s:
              s += """
          
          dependencies {
              implementation("com.github.teamnewpipe:newpipeextractor:0.26.5")
              implementation("com.squareup.okhttp3:okhttp:5.4.0")
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs_nio:2.1.5")
          }
          """
          p.write_text(s, encoding="utf-8")

          # Busca do YouTube agora fica dentro do Pitch Studio e importa o áudio escolhido.
          p = root / "app/src/main/java/br/com/timachado/pitchstudio/MainActivity.kt"
          s = p.read_text(encoding="utf-8")
          old = 'OnlineMusic.showYouTubeSearch(this) { statusLabel.text = it }'
          new = """YouTubeUi.show(
              activity = this,
              cacheDir = cacheDir,
              onStatus = { statusLabel.text = it },
              onProgress = { message, value -> showProgress(message, value) },
              onDownloaded = { file, name -> loadRemoteAudio(file, name) },
              onError = { message -> hideProgress("Falha no YouTube: " + message) }
          )"""
          if old not in s:
              raise SystemExit("chamada antiga de busca YouTube não encontrada")
          s = s.replace(old, new, 1)
          s = s.replace(
              "YouTube usa a busca oficial. Links HTTPS diretos de áudio podem ser importados e processados localmente.",
              "YouTube: pesquise ou cole o link; o áudio é baixado temporariamente e carregado no Pitch Studio."
          )
          p.write_text(s, encoding="utf-8")

          print("Pitch Studio v1.2 aplicado.")
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Preparar Android SDK
        shell: bash
        run: |
          set -e
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -n 1)"
          test -n "$SDKMANAGER"
          echo "sdkmanager=$SDKMANAGER"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null || true
            timeout 180 "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "platform-tools"
          else
            echo "Android API 36 e Build Tools 35.0.0 já disponíveis."
          fi
          ls -d "$ANDROID_HOME/platforms/android-36"
          ls -d "$ANDROID_HOME/build-tools/35.0.0"

      - name: Compilar APK
        shell: bash
        working-directory: ${{ runner.temp }}/pitchstudio-src/PitchStudioAndroid
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Verificar APK
        shell: bash
        working-directory: ${{ runner.temp }}/pitchstudio-src/PitchStudioAndroid
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: PitchStudio-v1.2.0-debug-apk
          path: ${{ runner.temp }}/pitchstudio-src/PitchStudioAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
