name: Brother Matrizes - Windows backup local FLP (QA isolada)

on:
  push:
    branches:
      - feature/windows-fiel-android-1-11-8-20261106
    paths:
      - "windows-fiel/build.gradle.kts"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopFlpBackupExporter.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopFlpBackupRestorer.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopFlpProjectFiles.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopProjectCatalog.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopRecentProjectRecovery.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/FielMain.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopFlpBackupExporterTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopFlpBackupRestorerTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopRecentProjectRecoveryTest.kt"
      - ".github/workflows/brother-windows-flp-backup-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip-backup:
    name: Validar exportacao de projetos FLP sem alterar originais
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Provar backup ZIP local, sem sobrescrita nem restauracao
        shell: pwsh
        run: |
          gradle -p windows-fiel test --no-daemon --stacktrace --tests '*DesktopFlpBackupExporterTest' --tests '*DesktopFlpBackupRestorerTest' --tests '*DesktopFlpProjectFilesTest' --tests '*DesktopRecentProjectRecoveryTest' --tests '*DesktopLibraryActivityStoreTest'
          if ($LASTEXITCODE -ne 0) { throw "Testes do backup FLP Windows falharam." }
      - name: Verificar rotulos de backup FLP somente no codigo gerado Windows
        shell: pwsh
        run: |
          $generated = "windows-fiel/build/generated/android-project-library/kotlin/com/timachado/brothermatrizes/ProjectLibraryScreen.kt"
          if (!(Test-Path $generated)) { throw "Biblioteca Windows nao foi gerada." }
          $code = Get-Content $generated -Raw
          if (!$code.Contains('"Backup FLP local"') -or !$code.Contains('"Restaurar FLP"')) {
            throw "Rotulos locais FLP nao aparecem na Biblioteca Windows."
          }
          if ($code.Contains('"Backup completo"')) {
            throw "Risco: backup parcial sendo apresentado como backup completo."
          }
      - name: Confirmar ausencia de executavel distribuivel
        shell: pwsh
        run: |
          if (Test-Path "windows-fiel/build/compose/binaries/main/exe") {
            throw "QA nao pode criar um executavel comercial."
          }
          "BROTHER_WINDOWS_BACKUP_FLPS_ONLY_QA_OK"
