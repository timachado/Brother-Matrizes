name: Brother Matrizes — Editor de nomes (QA isolada)
on:
  push:
    branches:
      - feature/editor-nomes-molduras-20261026
      - feature/name-fit-floral-crest-20261028
      - feature/rotation-horizontal-expansion-206
      - feature/persist-independent-hoop-layout-20261029
  pull_request:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/name-editor-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

# Um build da versão mais recente substitui execuções antigas do mesmo PR.
# Evita desperdiçar recursos de emulador em APKs já superados.
concurrency:
  group: name-editor-qa-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-test:
    name: Compilar e testar editor sem publicação
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: SDK Android 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Checagem de integridade da árvore oficial
        run: |
          bash scripts/pre_release_static_check.sh
          if grep -R -niE '(matrix-engine|matrixengine)' \
                app/src/main/java/com/timachado/brothermatrizes/NameEditorScreen.kt \
                app/src/main/java/com/timachado/brothermatrizes/core/embroidery/NamePersonalization.kt; then
            echo 'Dependência entre projetos detectada!'
            exit 1
          fi
      - name: Compilar, testar Maria/Sophia e verificar APK de QA
        shell: bash
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace
      - name: Exibir falhas de testes com detalhes
        if: failure()
        shell: bash
        run: |
          echo 'Relatório JUnit:'
          find app/build/test-results/testDebugUnitTest -type f -name 'TEST-*.xml' -print0 |
            xargs -0 -r grep -n -A 30 '<failure' | head -n 160 || true
      - name: APK gerado apenas no runner (não distribuído)
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "QA: arquivo de build presente; sem publicação e sem assinatura oficial."


  android-emulator-name-editor:
    name: Testar editor e simulador no emulador Android 35
    needs: android-test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Instalar Android 36 e emulador
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Permitir aceleração KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 - Maria/Sophia, simulação, exportação e seleção segura
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >
            gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace
            -Pandroid.testInstrumentationRunnerArguments.class=com.timachado.brothermatrizes.NameEditorAndroidQaTest
      - name: Guardar relatório de testes Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: name-editor-android35-test-results
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
          retention-days: 14


  build-qa-apk:
    name: Gerar APK paralelo NOMES QA após testes Android
    needs: android-emulator-name-editor
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Preparar SDK Android e pacote QA independente
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          grep -Fq 'applicationIdSuffix = ".nameqa"' app/build.gradle.kts
          mkdir -p app/src/debug
          jq --arg pkg "com.timachado.brothermatrizes.nameqa" '
            .client += [(.client[] | select(.client_info.android_client_info.package_name == "com.timachado.brothermatrizes") |
              .client_info.android_client_info.package_name = $pkg)]
          ' app/google-services.json > app/src/debug/google-services.json
          jq -e '.client[] | select(.client_info.android_client_info.package_name == "com.timachado.brothermatrizes.nameqa")' \
            app/src/debug/google-services.json >/dev/null
          # Alterar rótulo SOMENTE no workspace descartável de QA.
          sed -i 's/Brother Matrizes QA"/Brother Matrizes NOMES QA"/' app/src/debug/AndroidManifest.xml
      - name: Compilar APK de teste sem chave comercial
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug -PbrotherNameEditorQa=true --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk)"
          [[ "$BADGING" == *"package: name='com.timachado.brothermatrizes.nameqa'"* ]]
          [[ "$BADGING" == *"Brother Matrizes NOMES QA"* ]]
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            app/build/outputs/apk/debug/app-debug.apk > verify.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' verify.txt
          mkdir -p qa-nomes
          cp app/build/outputs/apk/debug/app-debug.apk qa-nomes/Brother-Matrizes-Nomes-QA-NAO-COMERCIAL.apk
          sha256sum qa-nomes/*.apk > qa-nomes/SHA256.txt
      - name: Guardar artefato privado de instalação paralela
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-NOMES-QA-APENAS-TESTE
          path: qa-nomes/
          retention-days: 14
          if-no-files-found: error
      - name: Restrições da entrega
        run: |
          {
            echo "## Brother Matrizes NOMES QA"
            echo "- Pacote paralelo com assinatura DEBUG: com.timachado.brothermatrizes.nameqa."
            echo "- Pode instalar ao lado da versão comercial; NÃO distribua a clientes."
            echo "- A autenticação Google poderá necessitar de credenciais específicas do pacote QA."
            echo "- PR draft: não autoriza exportação para máquina sem prova em retalho."
            echo "- Sem publicação na Release, WordPress ou Play Store."
          } >> "$GITHUB_STEP_SUMMARY"
