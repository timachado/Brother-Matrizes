name: Brother Matrizes 1.0.2 – validação sem assinatura

on:
  push:
    branches:
      - feature/brother-matrizes-1.0.2-updates
  pull_request:
    branches:
      - release/brother-matrizes-1.0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout da branch de validação
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK 36 usando Android SDK do runner
        shell: bash
        run: |
          echo "Android SDK: ${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager não encontrado"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6 (AGP 9.4)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compilar APK debug para testar o código (NÃO É RELEASE)
        run: gradle --no-daemon :app:assembleDebug

      - name: Testes unitários da build debug
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Compilar release não assinado (somente auditoria)
        run: gradle --no-daemon :app:assembleRelease

      - name: Validar versão, pacote e ausência de assinatura comercial
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$RELEASE"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$RELEASE" | head -n 1)"
          echo "$BADGING"
          [[ "$BADGING" == *"name='com.timachado.brothermatrizes'"* ]]
          [[ "$BADGING" == *"versionCode='168'"* ]]
          [[ "$BADGING" == *"versionName='1.0.2'"* ]]
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$RELEASE"; then
            echo "ERRO: era esperado um APK NÃO ASSINADO nesta rotina."
            exit 1
          fi
          sha256sum "$RELEASE"

      - name: Arquivar build unsigned (NÃO INSTALAR, NÃO DISTRIBUIR)
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-v1.0.2-UNSIGNED-SOMENTE-AUDITORIA
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
