name: Brother Matrizes 1.0.2 – validação sem assinatura

on:
  push:
    branches:
      - feature/brother-matrizes-1.0.2-updates
  pull_request:
    branches:
      - release/brother-matrizes-1.0.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout da branch de validação
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar SDK 36 usando Android SDK do runner
        shell: bash
        run: |
          echo "Android SDK: ${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then echo "sdkmanager não encontrado"; exit 1; fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6 (AGP 9.4)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Compilar APK debug para testar o código (NÃO É RELEASE)
        run: gradle --no-daemon :app:assembleDebug

      - name: Testes unitários da build debug
        run: gradle --no-daemon :app:testDebugUnitTest
