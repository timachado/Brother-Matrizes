name: Brother Matrizes - Windows fiel Home Android (compilacao QA)

on:
  push:
    branches:
      - feature/windows-fiel-android-1-11-8-20261106
    paths:
      - "windows-fiel/**"
      - "app/src/main/java/com/timachado/brothermatrizes/HomeScreen.kt"
      - "app/src/main/java/com/timachado/brothermatrizes/ui/theme/**"
      - "app/src/main/java/com/timachado/brothermatrizes/core/embroidery/**"
      - "app/src/main/res/drawable/**"
      - "branding/**"
      - ".github/workflows/brother-windows-fiel-home-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-home:
    name: Compilar Home Android ORIGINAL em Compose Desktop (sem instalador)
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar Gradle 8.14 oficial e validar SHA-256
        shell: pwsh
        run: ./windows-fiel/qa/install_gradle_814_official.ps1
      - name: Verificar fonte Android e arquivos oficiais
        shell: pwsh
        run: |
          python windows-fiel/qa/verificar_referencia_android.py
      - name: Compilar Home, recursos originais e validar testes unitarios
        shell: pwsh
        run: |
          gradle -p windows-fiel clean test classes --stacktrace --no-daemon
      - name: Validar geração da Home ORIGINAL (não copiar versão rejeitada)
        shell: pwsh
        run: |
          $homeFile = "windows-fiel/build/generated/android-home/kotlin/com/timachado/brothermatrizes/HomeScreen.kt"
          if (!(Test-Path $homeFile)) { throw "Fonte Compose original nao gerada" }
          $source = Get-Content $homeFile -Raw
          foreach ($item in @("fun HomeScreen(", "fun PremiumHeroCard()", "brother_home_hero", "brother_bm_premium_approved", "Ferramentas")) {
            if (!$source.Contains($item)) { throw "Componente Android perdido: $item" }
          }
          $res = "windows-fiel/build/generated/resources/drawable"
          foreach ($asset in @("brother_home_hero.jpg", "brother_bm_premium_approved.webp", "ic_ms_home_rounded.svg", "ic_ms_text_fields_rounded.svg")) {
            if (!(Test-Path (Join-Path $res $asset))) { throw "Asset Android nao gerado: $asset" }
          }
          "BROTHER_WINDOWS_FIEL_HOME_COMPILE_OK"
      - name: Capturar Home real do novo port Compose no runner Windows
        shell: pwsh
        run: |
          gradle -p windows-fiel run --args="--capture-home-qa" --no-daemon --stacktrace
          gradle -p windows-fiel run --args="--capture-home-wide-qa" --no-daemon --stacktrace
          gradle -p windows-fiel run --args="--capture-create-name-qa" --no-daemon --stacktrace
          gradle -p windows-fiel run --args="--capture-name-editor-qa" --no-daemon --stacktrace
          gradle -p windows-fiel run --args="--capture-name-editor-scroll-qa" --no-daemon --stacktrace
          gradle -p windows-fiel run --args="--qa-name-editor-click-apply" --no-daemon --stacktrace
          gradle -p windows-fiel run --args="--qa-name-editor-keyboard-apply" --no-daemon --stacktrace
          gradle -p windows-fiel run --args="--qa-name-editor-ctrl-a-apply" --no-daemon --stacktrace
          gradle -p windows-fiel run --args="--qa-open-chooser-pes" --no-daemon --stacktrace
          gradle -p windows-fiel run --args="--qa-open-chooser-jef" --no-daemon --stacktrace
          gradle -p windows-fiel run --args="--qa-open-chooser-dst" --no-daemon --stacktrace
          gradle -p windows-fiel run --args="--qa-open-chooser-flp" --no-daemon --stacktrace
          gradle -p windows-fiel run --args="--qa-save-flp-dialog-new" --no-daemon --stacktrace
          gradle -p windows-fiel run --args="--qa-save-flp-dialog-protect" --no-daemon --stacktrace
          foreach ($photo in @(
            "windows-fiel/build/qa/home-windows-original-port.png",
            "windows-fiel/build/qa/home-windows-wide-original-port.png",
            "windows-fiel/build/qa/create-name-windows-original-port.png",
            "windows-fiel/build/qa/name-editor-windows-original-port.png",
            "windows-fiel/build/qa/name-editor-windows-scrolled-qa.png",
            "windows-fiel/build/qa/name-editor-applied-qa.png",
            "windows-fiel/build/qa/name-editor-keyboard-input-qa.png",
            "windows-fiel/build/qa/name-editor-keyboard-applied-qa.png",
            "windows-fiel/build/qa/name-editor-ctrl-a-input-qa.png",
            "windows-fiel/build/qa/name-editor-ctrl-a-applied-qa.png",
            "windows-fiel/build/qa/chooser-pes-viewer.png",
            "windows-fiel/build/qa/chooser-jef-viewer.png",
            "windows-fiel/build/qa/chooser-dst-viewer.png",
            "windows-fiel/build/qa/chooser-flp-viewer.png",
            "windows-fiel/build/qa/save-flp-created-viewer.png",
            "windows-fiel/build/qa/save-flp-protected-viewer.png"
          )) {
            if (!(Test-Path $photo)) { throw "Captura Windows ausente: $photo" }
            if ((Get-Item $photo).Length -lt 10000) {
              throw "Captura Windows muito pequena: $photo"
            }
          }
          "BROTHER_WINDOWS_FIEL_HOME_CREATE_NAME_AND_NAME_EDITOR_CAPTURED"
      - name: Disponibilizar captura para comparação com Home Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brother-windows-fiel-HOME-RENDER-QA
          path: |
            windows-fiel/build/qa/home-windows-original-port.png
            windows-fiel/build/qa/home-windows-wide-original-port.png
            windows-fiel/build/qa/create-name-windows-original-port.png
            windows-fiel/build/qa/name-editor-windows-original-port.png
            windows-fiel/build/qa/name-editor-windows-scrolled-qa.png
            windows-fiel/build/qa/name-editor-applied-qa.png
            windows-fiel/build/qa/name-editor-keyboard-input-qa.png
            windows-fiel/build/qa/name-editor-keyboard-applied-qa.png
            windows-fiel/build/qa/name-editor-ctrl-a-input-qa.png
            windows-fiel/build/qa/name-editor-ctrl-a-applied-qa.png
            windows-fiel/build/qa/chooser-pes-viewer.png
            windows-fiel/build/qa/chooser-jef-viewer.png
            windows-fiel/build/qa/chooser-dst-viewer.png
            windows-fiel/build/qa/chooser-flp-viewer.png
            windows-fiel/build/qa/save-flp-created-viewer.png
            windows-fiel/build/qa/save-flp-protected-viewer.png
          if-no-files-found: warn
          retention-days: 14
      # Não gerar ZIP, EXE, MSI ou release enquanto as capturas da Home
      # Windows e Android não forem comparadas e aprovadas pelo proprietário.
