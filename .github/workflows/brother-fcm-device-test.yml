name: Brother Matrizes - Testar FCM em um aparelho

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validar a autenticacao e o token sem entregar notificacao
        type: boolean
        required: true
        default: true
      confirm:
        description: Digite TESTAR-UM-APARELHO para autorizar o teste individual
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: brother-fcm-single-device-diagnostic
  cancel-in-progress: false

jobs:
  test-single-device:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: brother-release-signing
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Firebase Admin sem executar scripts de pacotes
        run: npm install --prefix .github/scripts --no-save --ignore-scripts --no-audit --no-fund firebase-admin@14.5.0
      - name: Teste isolado de um dispositivo (nunca envia para tópicos)
        env:
          BROTHER_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.BROTHER_FIREBASE_SERVICE_ACCOUNT_JSON }}
          BROTHER_FCM_TEST_DEVICE_TOKEN: ${{ secrets.BROTHER_FCM_TEST_DEVICE_TOKEN }}
        run: node .github/scripts/test-brother-fcm-device.mjs
