name: Brother Matrizes - reserva idempotente V2 (QA sem producao)

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/windows-fiel-android-1-11-8-20261106
    paths:
      - "supabase/functions/brother-usage/index.ts"
      - "supabase/functions/brother-usage/reserve-v2.ts"
      - "supabase/functions/brother-usage/reserve-v2_test.ts"
      - "supabase/functions/brother-usage/free-v2-route.ts"
      - "supabase/functions/brother-usage/free-v2-route_test.ts"
      - "supabase/functions/brother-usage/protocol-capability-v2.ts"
      - "supabase/functions/brother-usage/protocol-capability-v2_test.ts"
      - "qa/sql/brother_v2_capability_probe_disposable.sql"
      - ".github/scripts/brother_usage_v2_ephemeral_pg.sh"
      - "docs/BROTHER_WINDOWS_RESERVA_IDEMPOTENTE_V2_QA.md"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopArchiveCommercialImportGate.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopBrotherArchiveUsageGateway.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopBrotherArchiveUsageGatewayTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopArchiveQuotaJournalTest.kt"
      - ".github/workflows/brother-windows-archive-idempotent-v2-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-contract:
    name: Deno V2 idempotencia em banco falso e compatibilidade Android V1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Proteger a API V1 e impedir qualquer migracao automatica
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server = Path('supabase/functions/brother-usage/index.ts').read_text()
          draft = Path('docs/BROTHER_WINDOWS_RESERVA_IDEMPOTENTE_V2_QA.md').read_text()
          required = [
            'payload.action === "reserve_v2"',
            'readKnownImportStatus(', 'handleFreeV2Reserve(',
            'Deno.env.get("BROTHER_FREE_V2_ENABLED") === "true"',
            'if (payload.action === "reserve_v2" && !freeV2Enabled)',
            'admin.rpc("brother_matrizes_reserve_import_v2"',
            'admin.rpc("brother_matrizes_reserve_import"',
            'admin.rpc("brother_matrizes_finalize_import"',
            'if (isPro) return reply({',
            'admin.rpc(',
            '"brother_matrizes_v2_capability_probe"',
            'confirmV2DatabaseCapability(configured, capabilityRows)',
          ]
          assert all(x in server for x in required), "V1 or disabled Pro V2 changed"
          assert 'NÃO EXECUTAR' in draft
          assert 'pg_catalog.pg_advisory_xact_lock' in draft
          assert "created_at > now() - INTERVAL '30 minutes'" in draft
          assert 'GRANT EXECUTE ON FUNCTION public.brother_matrizes_reserve_import_v2' in draft
          # CI NEVER executes the draft SQL or invokes the production database.
          print("BROTHER_V2_NO_MIGRATION_NO_PRODUCTION_OK")
          PY
      - name: Validar tipagem TypeScript do contrato idempotente e testes
        shell: bash
        run: |
          deno check supabase/functions/brother-usage/reserve-v2.ts
          deno check supabase/functions/brother-usage/reserve-v2_test.ts
          deno check supabase/functions/brother-usage/free-v2-route.ts
          deno check supabase/functions/brother-usage/free-v2-route_test.ts
          deno check supabase/functions/brother-usage/protocol-capability-v2.ts
          deno check supabase/functions/brother-usage/protocol-capability-v2_test.ts
          echo "BROTHER_V2_DENO_TYPE_CHECK_OK"
      - name: Simular a mesma UUID e primeira resposta perdida, sem rede
        shell: bash
        run: |
          deno test --no-check supabase/functions/brother-usage/reserve-v2_test.ts
          deno test --no-check supabase/functions/brother-usage/free-v2-route_test.ts
          deno test --no-check supabase/functions/brother-usage/protocol-capability-v2_test.ts
          deno test --no-check supabase/functions/brother-usage/read-status_test.ts
          echo "BROTHER_V2_DENO_IDEMPOTENT_FAKE_RPC_OK"

  disposable-postgres:
    name: "PostgreSQL 16 isolado: replay, concorrencia, limite mensal e privileges"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-qa-only
          POSTGRES_DB: brother_v2_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brother_v2_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: local-qa-only
      PGDATABASE: brother_v2_qa
    steps:
      - uses: actions/checkout@v4
      - name: Validar ambiente PostgreSQL descartavel
        shell: bash
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql -X -v ON_ERROR_STOP=1 -c "SELECT current_database();"
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "brother_v2_qa"
      - name: Executar SQL PROPOSTA apenas no banco Docker, nunca no Supabase
        shell: bash
        run: |
          bash .github/scripts/brother_usage_v2_ephemeral_pg.sh
          echo "BROTHER_V2_NO_PRODUCTION_DB_WRITE_OK"

  windows-contract:
    name: Contrato Windows e journal UUIDv4, com HTTP simulado
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      BROTHER_WINDOWS_QA_GOOGLE_AUTH: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Garantir que nenhum UI ativou V2 comercial
        shell: pwsh
        run: |
          $ui = Get-Content "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/FielMain.kt" -Raw
          if ($ui.Contains('DesktopArchiveCommercialImportGate') -or
              $ui.Contains('DesktopBrotherArchiveUsageGateway') -or
              $ui.Contains('reserveOnce(')) {
            throw "V2 nao pode ser iniciada pela interface QA."
          }
          $gate = Get-Content "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopArchiveCommercialImportGate.kt" -Raw
          if (!$gate.Contains('persisted.localId') -or
              !$gate.Contains('usage.reserveOnce(token, item.category, persisted.localId)')) {
            throw "Windows perdeu o vinculo do journal a mesma UUID."
          }
          "BROTHER_V2_WINDOWS_UI_STILL_DISABLED_OK"
      - name: Testar repeticao de reserva falsa, recusas e journal multiprocesso
        shell: pwsh
        run: |
          gradle -p windows-fiel test --no-daemon --stacktrace --tests '*DesktopBrotherArchiveUsageGatewayTest' --tests '*DesktopArchiveQuotaJournalTest' --tests '*DesktopArchiveCommercialImportGateTest' --tests '*DesktopArchiveQuotaMultiprocessTest'
          if ($LASTEXITCODE -ne 0) { throw "Protocolo Windows V2 reprovado." }
          "BROTHER_V2_WINDOWS_FAKE_NETWORK_AND_JOURNAL_OK"
      - name: Guardar XMLs de testes, sem arquivos de cliente
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brother-windows-idempotent-v2-test-reports
          path: windows-fiel/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14
