name: Brother Matrizes - Empacotar Comunidade WordPress 1.2

on:
  push:
    branches: [main]
    paths: ['.github/workflows/brother-community-wordpress-package.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validar e gerar plugin WordPress com feedback
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Obter proposta WordPress aprovada para empacotamento
        uses: actions/checkout@v4
        with:
          ref: 31cd1909886eb233eb9ecb01cf378413bdfa6c7f
          persist-credentials: false

      - name: Conferir conteudo e PHP do plugin sem alterar o site
        shell: bash
        run: |
          set -euo pipefail
          root="wordpress/tim-brother-sync"
          test -f "$root/tim-brother-sync.php"
          test -f "$root/includes/community.php"
          grep -F "Version: 1.2.0" "$root/tim-brother-sync.php"
          grep -F "[brother_matrizes_community]" "$root/includes/community.php"
          find "$root" -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          if grep -R -n 'eval(' "$root"; then
            echo 'Plugin contem codigo dinamico nao aprovado'
            exit 1
          fi

      - name: Empacotar plugin isolado sem publicar na hospedagem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          (cd wordpress && zip -q -9 -r "../dist/tim-brother-sync-1.2.0-comunidade.zip" tim-brother-sync -x '*.DS_Store')
          unzip -t dist/tim-brother-sync-1.2.0-comunidade.zip
          sha256sum dist/tim-brother-sync-1.2.0-comunidade.zip | tee dist/SHA256.txt

      - name: Guardar ZIP pronto para instalar no WordPress manualmente
        uses: actions/upload-artifact@v4
        with:
          name: tim-brother-sync-1.2.0-comunidade-wordpress
          path: |
            dist/tim-brother-sync-1.2.0-comunidade.zip
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30
