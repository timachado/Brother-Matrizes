name: Brother Matrizes 1.0.8 - QA upgrade Android

on:
  push:
    branches:
      - feature/brother-matrizes-1.0.8-direct-apk-updates
    paths:
      - 'scripts/qa_upgrade_1_0_7_to_1_0_8.sh'
      - '.github/workflows/qa-1.0.8-upgrade.yml'
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upgrade-smoke:
    name: Preservar dados 1.0.7 -> 1.0.8 (debug)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout candidato 1.0.8
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false
      - name: Checkout base aprovada 1.0.7
        uses: actions/checkout@v4
        with:
          ref: feature/brother-matrizes-1.0.7-bm-fonts
          path: previous
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Validar script QA
        run: bash -n candidate/scripts/qa_upgrade_1_0_7_to_1_0_8.sh
      - name: Compilar APKs debug das duas versoes
        run: |
          gradle --no-daemon -p previous :app:assembleDebug
          gradle --no-daemon -p candidate :app:assembleDebug
      - name: Habilitar KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Teste Android de atualizacao sem perda de dados
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash candidate/scripts/qa_upgrade_1_0_7_to_1_0_8.sh previous/app/build/outputs/apk/debug/app-debug.apk candidate/app/build/outputs/apk/debug/app-debug.apk
