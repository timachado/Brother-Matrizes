name: Brother 1.11.10 - QA FCM sem disparo
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/send_verified_11110_fcm.py'
      - 'tests/test_send_verified_11110_fcm.py'
      - '.github/workflows/brother-11110-fcm-post-release.yml'
      - '.github/workflows/brother-11110-fcm-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guard-tests:
    name: Verificar notificacao sem acessar Firebase
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testes dos gates de versao, assinatura e release
        run: python3 -m unittest discover -s tests -p 'test_send_verified_11110_fcm.py' -v
      - name: Conferir escopo do disparo unico
        shell: bash
        run: |
          set -euo pipefail
          test ! -e updates/notifications/fcm-v1.11.10.json
          grep -Fq 'github.ref' .github/workflows/brother-11110-fcm-post-release.yml || true
          grep -Fq 'Verificar ausencia de envio FCM v1.11.10' .github/workflows/brother-11110-fcm-post-release.yml
          grep -Fq 'brother_matrizes_updates_stable' scripts/send_verified_11110_fcm.py
