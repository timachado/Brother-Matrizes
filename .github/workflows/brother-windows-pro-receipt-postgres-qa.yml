name: Brother Matrizes - recibos Pro V2 PostgreSQL descartavel (QA)

on:
  push:
    branches:
      - feature/windows-fiel-android-1-11-8-20261106
    paths:
      - "qa/sql/brother_pro_v2_receipts_ephemeral.sql"
      - ".github/scripts/brother_pro_v2_ephemeral_pg.sh"
      - "supabase/functions/brother-usage/pro-receipt-v2.ts"
      - "supabase/functions/brother-usage/pro-receipt-v2_test.ts"
      - ".github/workflows/brother-windows-pro-receipt-postgres-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-receipts:
    name: "PostgreSQL 16 local: Pro receipt RLS, replay, lock and finalize"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-pro-qa
          POSTGRES_DB: brother_pro_v2_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d brother_pro_v2_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: disposable-pro-qa
      PGDATABASE: brother_pro_v2_qa
    steps:
      - uses: actions/checkout@v4
      - name: Confirmar localhost e banco local descartavel
        shell: bash
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          test "$PGHOST" = "127.0.0.1"
          test "$PGDATABASE" = "brother_pro_v2_qa"
          psql -X -v ON_ERROR_STOP=1 -c "select current_database(), version();"
      - name: Executar SQL QA sem Supabase e testar concorrencia real
        shell: bash
        run: |
          bash .github/scripts/brother_pro_v2_ephemeral_pg.sh
          echo "BROTHER_PRO_V2_NO_SUPABASE_NO_RELEASE_OK"

  deno-identity:
    name: Deno entitlement e contratos Pro offline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Confirmar que a Edge Function ainda NAO ativou Pro V2
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main=Path("supabase/functions/brother-usage/index.ts").read_text()
          helper=Path("supabase/functions/brother-usage/pro-receipt-v2.ts").read_text()
          sql=Path("qa/sql/brother_pro_v2_receipts_ephemeral.sql").read_text()
          assert "pro-receipt-v2.ts" not in main
          assert "Reserva idempotente Pro ainda não homologada." in main
          assert "admin.rpc(\"brother_matrizes_reserve_import\"" in main
          assert "admin.rpc(\"brother_matrizes_finalize_import\"" in main
          assert sql.startswith("-- QA / disposable PostgreSQL ONLY.")
          assert "ENABLE ROW LEVEL SECURITY;" in sql
          assert "SECURITY INVOKER" in sql
          assert "Deno.env" not in helper and "createClient" not in helper
          assert "Deno.serve" not in helper and "fetch(" not in helper
          print("BROTHER_PRO_V2_NOT_CONNECTED_TO_PRODUCTION_OK")
          PY
      - name: Compilar os tipos e executar os dez testes Pro offline
        shell: bash
        run: |
          deno check supabase/functions/brother-usage/pro-receipt-v2.ts
          deno check supabase/functions/brother-usage/pro-receipt-v2_test.ts
          deno test --no-check supabase/functions/brother-usage/pro-receipt-v2_test.ts
          echo "BROTHER_PRO_V2_TYPE_AND_FAKE_RPC_TESTS_OK"
