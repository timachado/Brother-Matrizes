name: Brother Matrizes 1.11.8 - build release sem segredos (QA)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/brother-1118-release-build-qa.yml'
      - 'app/**'

permissions:
  contents: read

jobs:
  verify-release-build:
    name: Build release, lint e configuracao comercial sem assinar
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validar versao e integridade antes de compilar
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^ *versionCode = 195 *$' app/build.gradle.kts
          grep -Fq 'versionName = "1.11.8"' app/build.gradle.kts
          test "$(jq -r .versionCode updates/stable.json)" = "194"
          test "$(jq -r .versionName updates/stable.json)" = "1.11.7"
          bash scripts/pre_release_static_check.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Preparar SDK Android 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Executar testes, lint e build release
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease -PbrotherCheckoutHandoff=true --stacktrace
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          sdk="$ANDROID_HOME/build-tools/36.0.0"
          badging="$("$sdk/aapt" dump badging "$apk" | head -n 1)"
          [[ "$badging" == *"name='com.timachado.brothermatrizes'"* ]]
          [[ "$badging" == *"versionCode='195'"* ]]
          [[ "$badging" == *"versionName='1.11.8'"* ]]
          grep -R --include='BuildConfig.java' -Eq 'ENABLE_CHECKOUT_HANDOFF = true' app/build/generated/source/buildConfig/release
          grep -R --include='BuildConfig.java' -Eq 'BETA_LOCAL_IMPORTS = false' app/build/generated/source/buildConfig/release
          grep -R --include='BuildConfig.java' -Eq 'ENABLE_FCM_DIAGNOSTIC = false' app/build/generated/source/buildConfig/release
          echo 'Build RELEASE nao assinado verificado. Nao instalar como substituto comercial.'
      - name: Relatorio isolado de QA sem APK de distribuicao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brother-1118-unsigned-release-build-qa-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/test-results/testDebugUnitTest/
          retention-days: 7
          if-no-files-found: ignore
