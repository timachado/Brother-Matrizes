name: Brother Matrizes 1.11.2 — publicação oficial verificada

on:
  push:
    branches: [main]
    paths: [.github/workflows/brother-1112-publish-commercial.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: brother-official-v1-11-2-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: brother-release-signing
    timeout-minutes: 90
    steps:
      - name: Checkout da base de distribuição
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Conferir execução de produção aprovada e manifesto anterior
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(jq -r .versionCode updates/stable.json)" = 188
          gh api "repos/$GH_REPO/actions/runs/40769950344" > /tmp/source-run.json
          jq -e '.status=="completed" and .conclusion=="success" and .head_branch=="release/brother-matrizes-1.11.2-prep" and .head_sha=="79c97660bc2bb5477d9df8468446716410516f78"' /tmp/source-run.json >/dev/null
          test ! -e /tmp/publish-done
          if gh release view v1.11.2 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::v1.11.2 ja existe; nao duplicar ou substituir release."
            exit 1
          fi

      - name: Baixar somente candidato comercial assinado pelo CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download 40769950344 --repo "$GH_REPO" \
            --name Brother-Matrizes-1.11.2-signed-production-candidate --dir dist
          test -s dist/Brother-Matrizes-1.11.2-production.apk
          test "$(cat dist/Brother-Matrizes-1.11.2-CERT-SHA256.txt)" = "fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a"
          grep -Fq 'd5ded13f571259475be763e57e365c3fc4d7f2854fe377a97033c9e752d9fb2b' dist/Brother-Matrizes-1.11.2-APK-SHA256.txt
          echo 'd5ded13f571259475be763e57e365c3fc4d7f2854fe377a97033c9e752d9fb2b  dist/Brother-Matrizes-1.11.2-production.apk' | sha256sum -c -

      - name: Preparar validador oficial Android 36
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android Build Tools 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "build-tools;36.0.0"

      - name: Verificar assinatura e identidade da versão 189
        shell: bash
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/36.0.0"
          apk=dist/Brother-Matrizes-1.11.2-production.apk
          "$sdk/zipalign" -P 16 -c 4 "$apk"
          "$sdk/apksigner" verify --min-sdk-version 26 --verbose --print-certs "$apk" > /tmp/signature-audit.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/signature-audit.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a' /tmp/signature-audit.txt
          badging="$("$sdk/aapt" dump badging "$apk" | head -n 1)"
          [[ "$badging" == *"name='com.timachado.brothermatrizes'"* ]]
          [[ "$badging" == *"versionCode='189'"* ]]
          [[ "$badging" == *"versionName='1.11.2'"* ]]
          mkdir -p baseline
          # Verificar também o certificado da versão oficial anterior.
          GH_TOKEN="${{ github.token }}" gh release download v1.11.1 \
            --repo "${{ github.repository }}" --dir baseline \
            --pattern 'Brother-Matrizes-1.11.1-OFICIAL-COMERCIAL-ASSINADO.apk'
          "$sdk/apksigner" verify --print-certs baseline/Brother-Matrizes-1.11.1-OFICIAL-COMERCIAL-ASSINADO.apk > /tmp/baseline-cert.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a' /tmp/baseline-cert.txt

      - name: Testar upgrade 1.11.1 para 1.11.2 em emulador Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            adb wait-for-device
            adb install -r baseline/Brother-Matrizes-1.11.1-OFICIAL-COMERCIAL-ASSINADO.apk
            adb shell pm path com.timachado.brothermatrizes | grep -F 'package:'
            adb install -r dist/Brother-Matrizes-1.11.2-production.apk
            adb shell dumpsys package com.timachado.brothermatrizes | grep -F 'versionCode=189'
            adb shell am start -W -n com.timachado.brothermatrizes/.MainActivity
            sleep 8
            adb shell pidof com.timachado.brothermatrizes

      - name: Validar disponibilidade do remetente Firebase antes da publicação
        shell: bash
        env:
          FCM_SECRET: ${{ secrets.BROTHER_FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$FCM_SECRET" || {
            echo "::error::Segredo FCM ausente; publicação não iniciada."
            exit 1
          }

      - name: Publicar release oficial 1.11.2 com APK verificado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat >/tmp/brother-notes.md <<'NOTES'
          # Brother Matrizes 1.11.2 — Editor de Nomes
          - Editor de nomes e monogramas com ajustes na visualização.
          - Diferença visual entre os modos Sólido e Realista.
          - Melhorias nos testes de criação e substituição de nomes.
          - Atualização comercial assinada com o certificado original.
          - Verificação de upgrade da versão 1.11.1 para 1.11.2 no Android.
          NOTES
          mv dist/Brother-Matrizes-1.11.2-production.apk \
            dist/Brother-Matrizes-1.11.2-OFICIAL-COMERCIAL-ASSINADO.apk
          gh release create v1.11.2 \
            dist/Brother-Matrizes-1.11.2-OFICIAL-COMERCIAL-ASSINADO.apk \
            --repo "$GH_REPO" --target 79c97660bc2bb5477d9df8468446716410516f78 \
            --title 'Brother Matrizes 1.11.2 — Editor de Nomes' \
            --notes-file /tmp/brother-notes.md --latest
          gh api "repos/$GH_REPO/releases/tags/v1.11.2" > /tmp/release.json
          jq -e '.draft==false and .prerelease==false and .published_at!=null and (.assets|length)==1' /tmp/release.json >/dev/null
          jq -e --arg sha "sha256:d5ded13f571259475be763e57e365c3fc4d7f2854fe377a97033c9e752d9fb2b" \
            '.assets[0].digest==$sha and .assets[0].name=="Brother-Matrizes-1.11.2-OFICIAL-COMERCIAL-ASSINADO.apk"' /tmp/release.json >/dev/null

      - name: Solicitar OTA verificada no manifesto oficial
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run brother-ota-after-published.yml \
            --repo "$GH_REPO" --ref main -f tag=v1.11.2

      - name: Esperar OTA publicada e conferir link e hash antes do push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            gh api "repos/$GH_REPO/contents/updates/stable.json?ref=main" --jq .content \
              | tr -d '\n' | base64 --decode > /tmp/verified-stable-1112.json
            if jq -e --arg sha 'd5ded13f571259475be763e57e365c3fc4d7f2854fe377a97033c9e752d9fb2b' \
              '.versionCode==189 and .versionName=="1.11.2" and .sha256==$sha and (.downloadUrl|contains("/releases/download/v1.11.2/")) and .downloadApkUrl==.downloadUrl' \
              /tmp/verified-stable-1112.json >/dev/null; then
              echo 'OTA oficial 1.11.2/189 conferida; push autorizado.'
              exit 0
            fi
            sleep 15
          done
          echo "::error::OTA não confirmou a release; push bloqueado."
          exit 1

      - name: Notificar apenas usuários inscritos via Firebase FCM
        shell: bash
        env:
          BROTHER_FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.BROTHER_FIREBASE_SERVICE_ACCOUNT_JSON }}
          BROTHER_VERIFIED_MANIFEST: /tmp/verified-stable-1112.json
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check 'google-auth==2.35.0' 'requests==2.32.3'
          python3 scripts/send_verified_1112_fcm.py
