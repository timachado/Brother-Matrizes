name: Brother Matrizes QA Object Selection APK

on:
  push:
    branches: ["qa/image-multiletter-24-components-20261018"]
  pull_request:
    branches: ["qa/image-split-mixed-simulator-proof-20261018"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parallel-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Guard original release package and simulator
        shell: bash
        run: |
          grep -F 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -F 'applicationIdSuffix = ".qa24letters"' app/build.gradle.kts
          grep -F 'versionCode = 184' app/build.gradle.kts
          grep -F 'versionName = "1.10.8"' app/build.gradle.kts
          for file in MachineSimulationCanvas.kt SimulatorScreen.kt EmbroideryDisplay.kt; do
            git diff origin/main --exit-code -- "app/src/main/java/com/timachado/brothermatrizes/$file"
          done
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Report failed embroidery QA tests
        if: failure()
        shell: bash
        run: |
          find app/build/test-results/testDebugUnitTest -name 'TEST-*Topology*.xml' -type f -print -exec sed -n '1,125p' {} \; || true
          find app/build/test-results/testDebugUnitTest -name 'TEST-*VariableWidth*.xml' -type f -print -exec sed -n '1,190p' {} \; || true
          find app/build/test-results/testDebugUnitTest -name 'TEST-*PesReadback*.xml' -type f -print -exec sed -n '1,190p' {} \; || true
          find app/build/test-results/testDebugUnitTest -name 'TEST-*RasterThreadSequence*.xml' -type f -print -exec sed -n '1,190p' {} \; || true
          find app/build/test-results/testDebugUnitTest -name 'TEST-*RasterSatinRailGeometryGate*.xml' -type f -print -exec sed -n '1,220p' {} \; || true
          find app/build/test-results/testDebugUnitTest -name 'TEST-*RasterUncoveredRegionAudit*.xml' -type f -print -exec sed -n '1,240p' {} \; || true
          find app/build/test-results/testDebugUnitTest -name 'TEST-*Vasos*.xml' -type f -print -exec sed -n '1,130p' {} \; || true
      - name: Build isolated Android QA APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK for QA only
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-QA-24-Letras
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
