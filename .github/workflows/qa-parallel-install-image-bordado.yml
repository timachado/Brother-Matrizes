name: Brother Matrizes QA CI + Contornos Vetoriais

on:
  push:
    branches: ["qa/brother-raster-contour-vectors-20261020"]
  pull_request:
    branches: ["qa/brother-satin-sequence-diagnostics-20261020"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa-continuo:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Guard release and fixed QA identity
        shell: bash
        run: |
          grep -F 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -F 'applicationIdSuffix = ".qaphysicalgate"' app/build.gradle.kts
          grep -F 'versionCode = 184' app/build.gradle.kts
          grep -F 'versionName = "1.10.8"' app/build.gradle.kts
          grep -F 'const val EXPORT_ALLOWED = false' app/src/main/java/com/timachado/brothermatrizes/core/embroidery/RasterEmbroideryApproval.kt
          grep -F 'android:label="Brother Matrizes QA"' app/src/debug/AndroidManifest.xml
          grep -F '"package_name": "com.timachado.brothermatrizes.qaphysicalgate"' app/src/debug/google-services.json
          for file in MachineSimulationCanvas.kt SimulatorScreen.kt EmbroideryDisplay.kt; do
            git diff origin/main --exit-code -- "app/src/main/java/com/timachado/brothermatrizes/$file"
          done

      - name: Automated regression tests (no phone required)
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Publish automated test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-QA-Testes-Automaticos
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: warn

      # A permanently update-compatible APK needs an actual persistent
      # QA key. Ephemeral GitHub runner debug keys CANNOT update each other.
      # This step only prepares a private QA signer during an explicit
      # manual distribution request. Never publish an unsigned or
      # ephemeral-debug-key APK as if it were update-compatible.
      - name: Prepare persistent QA signer (manual distribution only)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          QA_KEYSTORE_B64: ${{ secrets.BROTHER_QA_KEYSTORE_BASE64 }}
          QA_STORE_PASSWORD: ${{ secrets.BROTHER_QA_STORE_PASSWORD }}
          QA_KEY_ALIAS: ${{ secrets.BROTHER_QA_KEY_ALIAS }}
          QA_KEY_PASSWORD: ${{ secrets.BROTHER_QA_KEY_PASSWORD }}
        run: |
          if [ -z "$QA_KEYSTORE_B64" ] || [ -z "$QA_STORE_PASSWORD" ] || \
             [ -z "$QA_KEY_ALIAS" ] || [ -z "$QA_KEY_PASSWORD" ]; then
            echo "::warning::QA signer not configured; automated tests remain usable, but no installable APK will be published."
            echo "QA_SIGNED=false" >> "$GITHUB_ENV"
          else
            umask 077
            printf '%s' "$QA_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/brother-qa.jks"
            test -s "$RUNNER_TEMP/brother-qa.jks"
            echo "QA_SIGNED=true" >> "$GITHUB_ENV"
            echo "BROTHER_QA_STORE_FILE=$RUNNER_TEMP/brother-qa.jks" >> "$GITHUB_ENV"
          fi

      - name: Compile Android QA on CI (no installation)
        shell: bash
        env:
          BROTHER_QA_STORE_PASSWORD: ${{ secrets.BROTHER_QA_STORE_PASSWORD }}
          BROTHER_QA_KEY_ALIAS: ${{ secrets.BROTHER_QA_KEY_ALIAS }}
          BROTHER_QA_KEY_PASSWORD: ${{ secrets.BROTHER_QA_KEY_PASSWORD }}
        run: gradle :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Upload update-compatible QA APK only when requested and signed
        if: github.event_name == 'workflow_dispatch' && env.QA_SIGNED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-QA-Estavel
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

  android-emulator-ui:
    name: QA da sequencia Satin e interface no Android virtual
    needs: qa-continuo
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Enable hardware acceleration for the virtual device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke-test real Compose screen without installing on operator phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: bash .github/scripts/qa-android-class-regression.sh
      - name: Mostrar falhas JUnit Android em texto para triagem
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          base=pathlib.Path("app/build/outputs/androidTest-results/connected")
          reports=sorted(base.rglob("*.xml")) if base.exists() else []
          print("Relatorios JUnit Android encontrados:",len(reports))
          for report in reports:
              try:
                  root=ET.parse(report).getroot()
              except Exception as exc:
                  print("XML invalido:",report.name,repr(exc))
                  continue
              for test in root.iter("testcase"):
                  for kind in ("failure","error"):
                      for issue in test.findall(kind):
                          desc=issue.attrib.get("message","")
                          trace=(issue.text or "").splitlines()
                          print("FAIL:",test.attrib.get("classname"),
                                test.attrib.get("name"),kind,desc[:500])
                          for line in trace[:14]:
                              print(" ",line[:350])
          PY
      - name: Upload Android UI test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-QA-Android-Virtual
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
            app/build/qa-regressions/
          if-no-files-found: warn
