name: Brother 1.10.14 - Live Presence assinado QA

on:
  push:
    branches:
      - feature/brother-1.10.14-live-presence
    paths:
      - '.github/workflows/brother-live-presence-sign.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-1-10-14-live-presence-signed-qa
  cancel-in-progress: false

jobs:
  signed-qa:
    name: Build, QA e assinatura comercial - NAO PUBLICAR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: brother-release-signing
    steps:
      - name: Checkout da branch isolada
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verificar base e isolamento
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -Fq 'versionCode = 190' app/build.gradle.kts
          grep -Fq 'versionName = "1.10.14"' app/build.gradle.kts
          test -s app/src/main/java/com/timachado/brothermatrizes/BrotherPresenceHeartbeat.kt
          test -s app/src/main/java/com/timachado/brothermatrizes/core/account/BrotherPresenceClient.kt
          grep -Fq '/functions/v1/brother-presence' app/src/main/java/com/timachado/brothermatrizes/core/account/BrotherPresenceClient.kt

      - name: Testes unitarios e APK release
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Assinar com certificado comercial original e verificar
        shell: bash
        env:
          RELEASE_JKS_B64: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for key in RELEASE_JKS_B64 RELEASE_STORE_PASS RELEASE_KEY_ALIAS RELEASE_KEY_PASS; do
            test -n "${!key:-}" || { echo "::error::Assinatura comercial indisponivel."; exit 1; }
          done
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$RELEASE_JKS_B64" | base64 -d > "$tmp/original.jks"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -f -p 4 "$unsigned" "$tmp/aligned.apk"
          mkdir -p dist
          export RELEASE_STORE_PASS RELEASE_KEY_PASS
          signed="dist/Brother-Matrizes-1.10.14-Live-Presence-QA-ASSINADO.apk"
          "$tools/apksigner" sign --ks "$tmp/original.jks" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASS \
            --key-pass env:RELEASE_KEY_PASS \
            --out "$signed" "$tmp/aligned.apk"
          "$tools/zipalign" -c -p 4 "$signed"
          audit="$("$tools/apksigner" verify --verbose --print-certs "$signed")"
          printf '%s\n' "$audit" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          printf '%s\n' "$audit" | grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true'
          cert="$(printf '%s\n' "$audit" | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]{64})$/\1/p' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a" || {
            echo "::error::Certificado diferente da instalacao comercial original."; exit 1;
          }
          badging="$("$tools/aapt" dump badging "$signed" | head -n1)"
          [[ "$badging" == *"name='com.timachado.brothermatrizes'"* ]]
          [[ "$badging" == *"versionCode='190'"* ]]
          [[ "$badging" == *"versionName='1.10.14'"* ]]
          sha256sum "$signed" > dist/APK-SHA256.txt

      - name: Artefato privado assinado
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-1.10.14-Live-Presence-QA-ASSINADO
          path: |
            dist/Brother-Matrizes-1.10.14-Live-Presence-QA-ASSINADO.apk
            dist/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 7
