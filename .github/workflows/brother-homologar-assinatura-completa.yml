name: Brother Matrizes - Homologar compilacao e assinatura

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/brother-homologar-assinatura-completa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-signing-homologation
  cancel-in-progress: false

jobs:
  homologar:
    name: Compilar 1.10.1, assinar e validar SEM publicar
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment: brother-release-signing
    steps:
      - name: Baixar codigo aprovado do Brother Matrizes
        uses: actions/checkout@v4
        with:
          ref: hotfix/brother-matrizes-1.10.1-updates-premium
          persist-credentials: false
          path: android

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar ferramentas Android 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$sdkmanager"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Configurar Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Executar testes e compilar APK comercial
        shell: bash
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest
          gradle --no-daemon :app:assembleRelease

      - name: Assinar com credenciais protegidas e validar certificado
        shell: bash
        env:
          RELEASE_JKS_B64: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for s in RELEASE_JKS_B64 RELEASE_STORE_PASS RELEASE_KEY_ALIAS RELEASE_KEY_PASS; do
            test -n "${!s:-}" || { echo "::error::Segredo de assinatura ausente"; exit 1; }
          done
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          printf '%s' "$RELEASE_JKS_B64" | base64 --decode > "$dir/release.jks"
          source="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$source"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -f -p 4 "$source" "$dir/aligned.apk"
          export RELEASE_STORE_PASS RELEASE_KEY_PASS
          "$tools/apksigner" sign --ks "$dir/release.jks" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASS \
            --key-pass env:RELEASE_KEY_PASS \
            --out "$dir/validated.apk" "$dir/aligned.apk"
          "$tools/zipalign" -c -p 4 "$dir/validated.apk"
          result="$("$tools/apksigner" verify --verbose --print-certs "$dir/validated.apk")"
          printf '%s\n' "$result" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' >/dev/null
          printf '%s\n' "$result" | grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true' >/dev/null
          cert="$(printf '%s\n' "$result" | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([0-9A-Fa-f]{64})$/\1/p' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a" || {
            echo "::error::Certificado de assinatura divergente."; exit 1;
          }
          badging="$("$tools/aapt" dump badging "$dir/validated.apk" | head -n1)"
          [[ "$badging" == *"name='com.timachado.brothermatrizes'"* ]]
          [[ "$badging" == *"versionCode='177'"* ]]
          [[ "$badging" == *"versionName='1.10.1'"* ]]
          echo "Homologacao aprovada: APK comercial compila, assinatura original e v2/v3 conferidos."
          echo "Arquivo testado apenas em diretório temporário do GitHub; nao publicado."

      - name: Conferir manifesto atual nao alterado
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,urllib.request
          url="https://raw.githubusercontent.com/timachado/Brother-Matrizes/main/updates/stable.json"
          with urllib.request.urlopen(url,timeout=18) as response:
              m=json.load(response)
          assert m["versionName"]=="1.10.1" and m["versionCode"]==177
          assert m["sha256"]=="fd0cd07eaf71915f1d15dcbed6e3681c113cbde6df2c50ac3e1b27c0bc226651"
          print("Manifesto publico 1.10.1 preservado.")
          PY
