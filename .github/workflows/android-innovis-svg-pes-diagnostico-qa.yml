name: Android Innovis SVG PES - diagnostico QA isolado

on:
  push:
    branches:
      - fix/android-innovis-pes-svg-qa-20261122
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-innovis-pes-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-svg-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Preparar recursos de marca
        run: bash scripts/prepare_brand_assets.sh

      - name: Preparar identidade Firebase isolada para SVG QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/debug
          jq --arg pkg "com.timachado.brothermatrizes.svgsuiteqa" '
            .client += [(.client[] |
              select(.client_info.android_client_info.package_name == "com.timachado.brothermatrizes") |
              .client_info.android_client_info.package_name = $pkg)]
          ' app/google-services.json > app/src/debug/google-services.json
          jq -e '.client[] | select(.client_info.android_client_info.package_name == "com.timachado.brothermatrizes.svgsuiteqa")' \
            app/src/debug/google-services.json >/dev/null
          sed -i 's/Brother Matrizes QA"/Brother Matrizes SVG SUITE QA"/' app/src/debug/AndroidManifest.xml

      - name: Testes unitários de regressão Innov-is (sem release)
        run: gradle :app:testDebugUnitTest -PbrotherSvgSuiteQa=true --stacktrace

      - name: Consolidar relatório de regressão (somente QA)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: innovis-svg-pes-regressao-unit-tests
          path: app/build/test-results/testDebugUnitTest/
          retention-days: 14
          if-no-files-found: ignore

