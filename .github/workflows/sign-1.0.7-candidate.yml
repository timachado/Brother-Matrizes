name: Brother Matrizes 1.0.7 - APK comercial assinado QA

on:
  push:
    branches:
      - feature/brother-matrizes-1.0.7-bm-fonts
    paths:
      - 'app/**'
      - '.github/workflows/sign-1.0.7-candidate.yml'
      - 'branding/**'
      - 'build.gradle.kts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-v1.0.7-original-cert-candidate
  cancel-in-progress: false

jobs:
  signed-candidate:
    name: Assinar 1.0.7 com certificado comercial ORIGINAL
    runs-on: ubuntu-latest
    environment: brother-release-signing
    timeout-minutes: 40
    steps:
      - name: Checkout da versao 1.0.7
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Unit tests antes da assinatura
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build release nao assinado
        run: gradle --no-daemon :app:assembleRelease

      - name: Assinar e validar com certificado COMERCIAL ORIGINAL
        shell: bash
        env:
          BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64 }}
          BROTHER_MATRIZES_RELEASE_STORE_PASSWORD: ${{ secrets.BROTHER_MATRIZES_RELEASE_STORE_PASSWORD }}
          BROTHER_MATRIZES_RELEASE_KEY_ALIAS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_ALIAS }}
          BROTHER_MATRIZES_RELEASE_KEY_PASSWORD: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "${BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64:-}" || { echo 'Keystore original indisponivel nos secrets'; exit 1; }
          test -n "${BROTHER_MATRIZES_RELEASE_STORE_PASSWORD:-}" || { echo 'Senha comercial indisponivel'; exit 1; }
          test -n "${BROTHER_MATRIZES_RELEASE_KEY_ALIAS:-}" || { echo 'Alias comercial indisponivel'; exit 1; }
          test -n "${BROTHER_MATRIZES_RELEASE_KEY_PASSWORD:-}" || { echo 'Senha da chave comercial indisponivel'; exit 1; }
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          EXPECTED_CERT="fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          OUTPUT="Brother-Matrizes-v1.0.7-BM-FONTES-ASSINADO.apk"
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          test -s "$UNSIGNED"
          printf '%s' "$BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$WORK/brother-release.jks"
          "$TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$WORK/aligned.apk"
          "$TOOLS/apksigner" sign \
            --ks "$WORK/brother-release.jks" \
            --ks-key-alias "$BROTHER_MATRIZES_RELEASE_KEY_ALIAS" \
            --ks-pass env:BROTHER_MATRIZES_RELEASE_STORE_PASSWORD \
            --key-pass env:BROTHER_MATRIZES_RELEASE_KEY_PASSWORD \
            --out "$OUTPUT" "$WORK/aligned.apk"
          VERIFY="$("$TOOLS/apksigner" verify --verbose --print-certs "$OUTPUT")"
          printf '%s\n' "$VERIFY" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' > /dev/null
          REAL_CERT="$(printf '%s\n' "$VERIFY" | sed -n -E 's/^Signer #1 certificate SHA-256 digest: ([0-9a-fA-F]{64})$/\1/p' | tr '[:upper:]' '[:lower:]')"
          if [[ "$REAL_CERT" != "$EXPECTED_CERT" ]]; then
            echo 'Certificado diferente do comercial: candidato rejeitado'
            rm -f "$OUTPUT"
            exit 1
          fi
          PACKAGE="$("$TOOLS/aapt" dump badging "$OUTPUT" | sed -n '1p')"
          [[ "$PACKAGE" == *"name='com.timachado.brothermatrizes'"* ]]
          [[ "$PACKAGE" == *"versionCode='173'"* ]]
          [[ "$PACKAGE" == *"versionName='1.0.7'"* ]]
          "$TOOLS/zipalign" -c -p 4 "$OUTPUT"
          sha256sum "$OUTPUT" > "Brother-Matrizes-v1.0.7-BM-FONTES-ASSINADO.sha256"
          echo 'APK 1.0.7 QA assinado e validado com certificado comercial original.'

      - name: Guardar APK assinado para QA - SEM PUBLICAR
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-v1.0.7-BM-FONTES-ASSINADO-QA
          path: |
            Brother-Matrizes-v1.0.7-BM-FONTES-ASSINADO.apk
            Brother-Matrizes-v1.0.7-BM-FONTES-ASSINADO.sha256
          if-no-files-found: error
          retention-days: 14
