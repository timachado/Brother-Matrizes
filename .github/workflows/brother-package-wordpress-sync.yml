name: Brother Matrizes - plugin WordPress de sincronizacao

on:
  push:
    branches: [main]
    paths:
      - 'wordpress/tim-brother-sync/**'
      - '.github/workflows/brother-package-wordpress-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Validar e empacotar plugin seguro
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar sintaxe PHP
        run: |
          php -l wordpress/tim-brother-sync/tim-brother-sync.php
          php -l wordpress/tim-brother-sync/includes/app-commerce-core.php
      - name: Validar JavaScript embutido do shortcode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path("wordpress/tim-brother-sync/tim-brother-sync.php").read_text()
          match=re.search(r"<script>(.*?)</script>",source,flags=re.S)
          assert match, "Script do shortcode nao encontrado"
          script=match.group(1)
          script=script.replace("<?php echo wp_json_encode($id); ?>",'"node-de-teste"')
          script=script.replace("<?php echo wp_json_encode(TIM_BROTHER_SYNC_MANIFEST_URL); ?>",'"https://raw.githubusercontent.com/timachado/Brother-Matrizes/main/updates/stable.json"')
          Path("/tmp/brother-shortcode-test.js").write_text(script)
          PY
          node --check /tmp/brother-shortcode-test.js
      - name: Testar escopo dos campos App Commerce Core
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/test-app-commerce-metadata.php <<'PHP'
          <?php
          define('ABSPATH', '/');
          $GLOBALS['manifest']=['versionName'=>'1.10.1','versionCode'=>177,'releaseNotes'=>'Atualização premium',
            'downloadApkUrl'=>'https://github.com/timachado/Brother-Matrizes/releases/download/v1.10.1/Brother-Matrizes-v1.10.1-ASSINADO.apk'];
          $GLOBALS['access']='free';
          function get_post_type($id){return $id===307?'ti_app':'post';}
          function get_post_meta($id,$key,$single){return $key==='_ti_app_download_access'?$GLOBALS['access']:null;}
          function tim_brother_sync_latest(){return $GLOBALS['manifest'];}
          function add_filter($name,$callback,$priority=10,$accepted_args=1){$GLOBALS['callables'][$name]=$callback;}
          require 'wordpress/tim-brother-sync/includes/app-commerce-core.php';
          $f=$GLOBALS['callables']['get_post_metadata'];
          assert($f(null,307,'_ti_app_version',true,'post')==='1.10.1');
          assert($f(null,307,'_ti_app_release_notes',true,'post')==='Atualização premium');
          assert($f(null,307,'_ti_app_apk_attachment_id',true,'post')==='0');
          assert(str_contains($f(null,307,'_ti_app_download',true,'post'),'/v1.10.1/'));
          assert($f(null,308,'_ti_app_version',true,'post')===null);
          assert($f(null,307,'_ti_app_product_lifetime',true,'post')===null);
          $GLOBALS['access']='licensed';
          assert($f(null,307,'_ti_app_apk_attachment_id',true,'post')===null);
          assert($f(null,307,'_ti_app_download',true,'post')===null);
          $GLOBALS['manifest']=null;
          assert($f(null,307,'_ti_app_version',true,'post')===null);
          echo 'OK: leitura dinâmica restrita ao app 307; acesso licenciado preservado.' . PHP_EOL;
          PHP
          php -d zend.assertions=1 -d assert.exception=1 /tmp/test-app-commerce-metadata.php
      - name: Criar ZIP de instalacao WordPress
        shell: bash
        run: |
          set -euo pipefail
          cd wordpress
          zip -q -9 -r "$GITHUB_WORKSPACE/tim-brother-sync.zip" tim-brother-sync \
            -x '*/.DS_Store'
          unzip -t "$GITHUB_WORKSPACE/tim-brother-sync.zip"
          test "$(unzip -Z1 "$GITHUB_WORKSPACE/tim-brother-sync.zip" | grep -Fc 'tim-brother-sync/tim-brother-sync.php')" -eq 1
      - name: Disponibilizar plugin de instalacao unica
        uses: actions/upload-artifact@v4
        with:
          name: tim-brother-sync-wordpress-instalar
          path: tim-brother-sync.zip
          if-no-files-found: error
          retention-days: 30
