name: Temporary export Android signing runtime

on:
  push:
    branches: ["refactor/brother-matrizes-clean-0469"]

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Package signing runtime
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p /tmp/android-sign-runtime/lib
          cp "$BT/apksigner" /tmp/android-sign-runtime/
          cp "$BT/zipalign" /tmp/android-sign-runtime/
          cp "$BT/lib/apksigner.jar" /tmp/android-sign-runtime/lib/
          find "$BT" -name 'libc++.so' -exec cp {} /tmp/android-sign-runtime/lib/ \;
          tar -C /tmp -czf android-sign-runtime-36.0.0.tar.gz android-sign-runtime

      - name: Upload signing runtime
        uses: actions/upload-artifact@v4
        with:
          name: android-sign-runtime-36.0.0
          path: android-sign-runtime-36.0.0.tar.gz
          retention-days: 1
