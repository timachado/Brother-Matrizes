name: QA correcoes comerciais 1.10.8 - Planos e Atualizacoes

on:
  push:
    branches: [fix/official-1108-netfontes-plan-update-check]
    paths: [.github/workflows/qa-commercial-plan-update-1108.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout da base comercial
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Checar versão comercial e manifesto oficial
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 184' app/build.gradle.kts
          grep -Fq 'versionName = "1.10.8"' app/build.gradle.kts
          grep -Fq 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          test -s updates/stable.json
          python3 - <<'PY'
          import json,re
          x=json.load(open("updates/stable.json",encoding="utf8"))
          assert x["versionCode"]==184 and x["versionName"]=="1.10.8"
          assert x["applicationId"]=="com.timachado.brothermatrizes"
          assert re.fullmatch("[a-f0-9]{64}",x["sha256"])
          assert x["downloadUrl"].startswith("https://github.com/timachado/Brother-Matrizes/releases/download/v1.10.8/")
          PY
      - name: Preparar identidade visual
        run: bash scripts/prepare_brand_assets.sh
      - name: Executar testes unitários
        run: gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Compilar APK RELEASE oficial sem assinar
        run: gradle --no-daemon :app:assembleRelease --stacktrace
      - name: Verificar pacote RELEASE
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$apk"
          info="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | head -n 1)"
          echo "$info"
          [[ "$info" == *"name='com.timachado.brothermatrizes'"* ]]
          [[ "$info" == *"versionCode='184'"* ]]
          [[ "$info" == *"versionName='1.10.8'"* ]]
          sha256sum "$apk" > app/build/outputs/apk/release/APK-UNSIGNED-SHA256.txt
      - name: Preservar APK para assinatura comercial local
        uses: actions/upload-artifact@v4
        with:
          name: Brother-1108-NetFontes-Planos-Atualizacoes-UNSIGNED
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            app/build/outputs/apk/release/APK-UNSIGNED-SHA256.txt
          if-no-files-found: error
          retention-days: 7
