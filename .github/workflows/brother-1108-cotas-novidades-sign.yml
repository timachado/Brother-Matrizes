name: Brother 1.10.8 - assinar homologacao cotas e novidades

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brother-1108-cotas-novidades-sign.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-1108-cotas-novidades-homologacao
  cancel-in-progress: false

jobs:
  signed-candidate:
    name: Build, QA e assinatura original - NAO PUBLICAR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: brother-release-signing
    steps:
      - name: Carregar exatamente a candidata revisada
        uses: actions/checkout@v4
        with:
          ref: 19ca60e13ead6177aba7362a0ed526cd3beba7c7
          persist-credentials: false
          path: android
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Conferir pacote, versao e rotas autenticadas
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -Fq 'versionCode = 184' app/build.gradle.kts
          grep -Fq 'versionName = "1.10.8"' app/build.gradle.kts
          test -s app/src/main/java/com/timachado/brothermatrizes/ui/updates/BrotherVersionGate.kt
          grep -Fq 'ensureGoogleSession()' app/src/main/java/com/timachado/brothermatrizes/MainActivity.kt
          grep -Fq 'reserveTool' app/src/main/java/com/timachado/brothermatrizes/core/account/BrotherUsageClient.kt
          grep -Fq 'dafont_search' app/src/main/java/com/timachado/brothermatrizes/DaFontBrowserScreen.kt
          grep -Fq 'telegram_search' app/src/main/java/com/timachado/brothermatrizes/TelegramMatrixSearchScreen.kt
          grep -Fq 'rar_receive' app/src/main/java/com/timachado/brothermatrizes/ProjectLibraryScreen.kt
          grep -Fq 'BrotherPostUpdateNews()' app/src/main/java/com/timachado/brothermatrizes/MainActivity.kt
          grep -Fq 'monthlyFreeLimits' app/src/main/java/com/timachado/brothermatrizes/BrotherPlansScreen.kt
          grep -Fq 'BrotherCurrentVersionNews' app/src/main/java/com/timachado/brothermatrizes/UpdateStatusCard.kt
          test -s app/src/test/java/com/timachado/brothermatrizes/ui/updates/BrotherPostUpdatePolicyTest.kt
          # Regressão: o retorno do seletor não pode desmontar o app por recheck.
          python3 - <<'PY'
          from pathlib import Path
          code = Path("app/src/main/java/com/timachado/brothermatrizes/ui/updates/BrotherVersionGate.kt").read_text()
          fragment = code.split("LaunchedEffect(resumeRequest, retry) {", 1)[1].split("when (val answer =", 1)[0]
          assert "checking = true" not in fragment, "Retorno do Drive desmontaria o ActivityResultLauncher"
          assert "checking = false" in code
          print("OK: recheck no ON_RESUME preserva a composition / ActivityResultLauncher")
          PY

      - name: Testes unitarios e APK release
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Assinar com certificado comercial original e verificar
        shell: bash
        env:
          RELEASE_JKS_B64: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for key in RELEASE_JKS_B64 RELEASE_STORE_PASS RELEASE_KEY_ALIAS RELEASE_KEY_PASS; do
            test -n "${!key:-}" || { echo "::error::Assinatura comercial indisponivel."; exit 1; }
          done
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$RELEASE_JKS_B64" | base64 -d > "$tmp/original.jks"
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -f -p 4 "$unsigned" "$tmp/aligned.apk"
          mkdir -p dist
          export RELEASE_STORE_PASS RELEASE_KEY_PASS
          signed="dist/Brother-Matrizes-1.10.8-COTAS-NOVIDADES-HOMOLOGACAO.apk"
          "$tools/apksigner" sign --ks "$tmp/original.jks" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASS \
            --key-pass env:RELEASE_KEY_PASS \
            --out "$signed" "$tmp/aligned.apk"
          "$tools/zipalign" -c -p 4 "$signed"
          audit="$("$tools/apksigner" verify --verbose --print-certs "$signed")"
          printf '%s\n' "$audit" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          printf '%s\n' "$audit" | grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true'
          cert="$(printf '%s\n' "$audit" | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]{64})$/\1/p' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a" || {
            echo "::error::Certificado diferente da instalacao comercial original."; exit 1;
          }
          badging="$("$tools/aapt" dump badging "$signed" | head -n1)"
          [[ "$badging" == *"name='com.timachado.brothermatrizes'"* ]]
          [[ "$badging" == *"versionCode='184'"* ]]
          [[ "$badging" == *"versionName='1.10.8'"* ]]
          sha256sum "$signed" > dist/APK-SHA256.txt
          echo "Homologacao pronta; sem publicar release nem atualizar manifesto ou Supabase."
      - name: Disponibilizar apenas o artefato privado de homologacao
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-1.10.8-COTAS-NOVIDADES-APK-ASSINADO-HOMOLOGACAO
          path: |
            dist/Brother-Matrizes-1.10.8-COTAS-NOVIDADES-HOMOLOGACAO.apk
            dist/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 7
