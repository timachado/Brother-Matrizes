name: Brother Matrizes - QA Google login and free quotas

on:
  push:
    branches:
      - fix/brother-quotas-login-20261013-mach
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Android debug build and unit tests (no publish)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Validate official 1.10.4 signing certificate and version
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/brother-official-v1.10.4.apk"
          URL="https://github.com/timachado/Brother-Matrizes/releases/download/v1.10.4/Brother-Matrizes-v1.10.4-ASSINADO.apk"
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 15 \
            --output "$APK" "$URL"
          printf '%s  %s\n' '62a663f3710c5989b2bc128f8a0b301bc2cd5f45ad1572a2d618cf51367d4ac0' "$APK" \
            | sha256sum --check --status
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/stable-apk-cert.txt"
          CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/stable-apk-cert.txt" | head -n 1)"
          EXPECTED="fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a"
          test "$CERT" = "$EXPECTED" || {
            echo "The official installed APK certificate does not match production signing workflow."
            exit 1
          }
          BADGING="$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1)"
          [[ "$BADGING" == *"name='com.timachado.brothermatrizes'"* ]]
          [[ "$BADGING" == *"versionCode='180'"* ]]
          echo "Official v1.10.4 SHA256, package ID, version code and signing certificate verified."
          rm -f "$APK" "$RUNNER_TEMP/stable-apk-cert.txt"

      - name: Verify target application and quota wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -Fq 'versionName = "1.10.5"' app/build.gradle.kts
          grep -Fq 'BrotherUsageClient.reserve(verifiedAccessToken(), isFont = false)' app/src/main/java/com/timachado/brothermatrizes/core/account/BrotherMatrizesAccountService.kt
          grep -Fq 'BrotherMeteredAction.RAR_RECEIVE' app/src/main/java/com/timachado/brothermatrizes/ProjectLibraryScreen.kt
          grep -Fq 'BrotherMeteredAction.DAFONT_SEARCH' app/src/main/java/com/timachado/brothermatrizes/DaFontBrowserScreen.kt
          grep -Fq 'BrotherMandatoryUpdateGate(' app/src/main/java/com/timachado/brothermatrizes/MainActivity.kt
      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Compile debug APK (not signed for public distribution)
        run: gradle --no-daemon :app:assembleDebug
      - name: Confirm APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Verify no production secrets or insecure URLs
        run: bash scripts/pre_release_static_check.sh

      - name: Audit legacy brand references before production signing
        shell: bash
        run: |
          LEGACY_TOKEN="$(printf 'fio%s' 'lab')"
          if git grep -ni -I -F "$LEGACY_TOKEN" -- app/src/main app/build.gradle.kts branding; then
            echo "Legacy brand reference detected. Review before production release."
            exit 1
          fi

      - name: Android lint for debug and release
        run: gradle --no-daemon :app:lintDebug :app:lintRelease

      - name: Build unsigned release candidate (no distribution)
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify release candidate and production quotas
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          grep -Fq 'versionCode = 181' app/build.gradle.kts
          grep -Fq 'buildConfigField("boolean", "BETA_LOCAL_IMPORTS", "false")' app/build.gradle.kts
          grep -Fq 'brother_matrizes_reserve_monthly_action' supabase/functions/brother-usage/index.ts
          ! grep -Eq 'dailyActions|reserve_action|finalize_action|cota diária' supabase/functions/brother-usage/index.ts
      - name: Upload unsigned 1.10.5 release for private local signing
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-1.10.5-UNSIGNED-local-signing
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 2

