name: Build Brother Matrizes Android APK

on:
  push:
    branches: ["refactor/brother-matrizes-clean-0469"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using: $SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify clean Brother identity
        shell: bash
        run: |
          if git grep -n -I -E 'FioLab|fiolab|com\.timachado\.fiolab'; then
            echo "Legacy identity reference detected."
            exit 1
          fi
          grep -F 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -F 'namespace = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -F 'android:scheme="com.timachado.brothermatrizes"' app/src/main/AndroidManifest.xml

      - name: Prepare Brother brand assets
        shell: bash
        run: |
          bash scripts/prepare_brand_assets.sh
          file app/src/main/res/drawable-nodpi/brother_matrizes_brand_logo.jpg
          file app/src/main/res/mipmap-xxxhdpi/ic_launcher_brother_matrizes.jpg

      - name: Repository safety checks
        run: bash scripts/pre_release_static_check.sh

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Upload Android test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brother-matrizes-android-test-report
          path: |
            app/build/reports/androidTests/connected/debug
            app/build/outputs/androidTest-results/connected
          if-no-files-found: warn

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build unsigned release candidate
        run: gradle :app:assembleRelease --stacktrace

      - name: Validate APK alignment and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare downloadable files
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Brother-Matrizes-0.46.10-debug.apk
          zip -9 Brother-Matrizes-0.46.10-debug.zip Brother-Matrizes-0.46.10-debug.apk
          sha256sum Brother-Matrizes-0.46.10-debug.apk Brother-Matrizes-0.46.10-debug.zip > Brother-Matrizes-0.46.10-SHA256.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-0.46.10-downloads
          path: |
            Brother-Matrizes-0.46.10-debug.apk
            Brother-Matrizes-0.46.10-debug.zip
            Brother-Matrizes-0.46.10-SHA256.txt
          if-no-files-found: error
