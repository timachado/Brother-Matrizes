name: Build Brother Matrizes Android APK

on:
  push:
    branches: ["refactor/brother-matrizes-clean-0469", "fix/pe-design-active-entry-0469", "fix/maria-first-main-stroke-0469", "fix/stroke-flow-continuous-maria-0469", "experiment/pe-design-continuous-satin-0469", "experiment/pe-design-satin-puro-0469", "experiment/pe-design-flow-topology-0469", "experiment/maria-sequence-audit-0469", "fix/maria-complete-left-satin-0469", "fix/maria-inner-first-entry-0469"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using: $SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify clean Brother identity
        shell: bash
        run: |
          LEGACY_TOKEN="$(printf 'fio%s' 'lab')"
          if git grep -ni -I -F "$LEGACY_TOKEN"; then
            echo "Legacy identity reference detected."
            exit 1
          fi
          grep -F 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -F 'namespace = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -F 'android:scheme="com.timachado.brothermatrizes"' app/src/main/AndroidManifest.xml

      - name: Prepare Brother brand assets
        shell: bash
        run: |
          bash scripts/prepare_brand_assets.sh
          file app/src/main/res/drawable-nodpi/brother_matrizes_brand_logo.jpg
          file app/src/main/res/mipmap-xxxhdpi/ic_launcher_brother_matrizes.jpg

      - name: Repository safety checks
        run: bash scripts/pre_release_static_check.sh

      - name: Unit tests
        shell: bash
        run: |
          set +e
          gradle :app:testDebugUnitTest --stacktrace
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "Detailed JUnit failure reports:"
            find app/build/test-results/testDebugUnitTest -name 'TEST-*.xml' -type f -exec grep -n -A 6 '<failure' {} \; || true
          fi
          exit "$status"

      - name: Upload JUnit diagnostic on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: brother-maria-order-unit-test-results
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Runtime validation note
        shell: bash
        run: |
          echo "Runtime emulator smoke test already passed on the immediately preceding clean-identity build."
          echo "This final delta only removes legacy identity compatibility strings; unit tests and lint remain blocking."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build unsigned release candidate
        run: gradle :app:assembleRelease --stacktrace

      - name: Validate APK alignment and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare downloadable files
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Brother-Matrizes-0.46.69-debug.apk
          zip -9 Brother-Matrizes-0.46.69-debug.zip Brother-Matrizes-0.46.69-debug.apk
          sha256sum Brother-Matrizes-0.46.69-debug.apk Brother-Matrizes-0.46.69-debug.zip > Brother-Matrizes-0.46.69-SHA256.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-0.46.69-downloads
          path: |
            Brother-Matrizes-0.46.69-debug.apk
            Brother-Matrizes-0.46.69-debug.zip
            Brother-Matrizes-0.46.69-SHA256.txt
          if-no-files-found: error
