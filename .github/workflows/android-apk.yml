name: Build Android APK

# Fluxo legado FioLab: somente execucao manual, nunca publicar apos commits
# do manifesto ou da automacao comercial Brother Matrizes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using: $SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Prepare brand assets
        shell: bash
        run: |
          bash scripts/prepare_brand_assets.sh
          file app/src/main/res/drawable-nodpi/fiolab_brand_logo.jpg
          file app/src/main/res/mipmap-xxxhdpi/ic_launcher_fiolab.jpg


      - name: Repository safety checks
        run: bash scripts/pre_release_static_check.sh

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android runtime smoke test
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Build unsigned release candidate
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare downloadable files
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk FioLab-0.61.0-debug.apk
          zip -9 FioLab-0.61.0-debug.zip FioLab-0.61.0-debug.apk
          sha256sum FioLab-0.61.0-debug.apk FioLab-0.61.0-debug.zip > FioLab-0.61.0-SHA256.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FioLab-0.61.0-downloads
          path: |
            FioLab-0.61.0-debug.apk
            FioLab-0.61.0-debug.zip
            FioLab-0.61.0-SHA256.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.61.0 >/dev/null 2>&1; then
            gh release upload v0.61.0               FioLab-0.61.0-debug.apk               FioLab-0.61.0-debug.zip               FioLab-0.61.0-SHA256.txt               --clobber
          else
            gh release create v0.61.0               FioLab-0.61.0-debug.apk               FioLab-0.61.0-debug.zip               FioLab-0.61.0-SHA256.txt               --target main               --title "FioLab 0.61.0"               --notes "FioLab 0.61.0: motor V2 calibrado com a topologia real da fonte Alliby. Junções são detectadas e removidas do traçado dos ramos; cada ramo é bordado separadamente e o miolo da junção recebe um patch Tatami local, evitando leques e falhas no M."
          fi
