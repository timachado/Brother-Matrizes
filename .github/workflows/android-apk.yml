name: Build Brother Matrizes Android APK

on:
  push:
    branches: ["refactor/brother-matrizes-clean-0469"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          echo "Using: $SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify clean Brother identity
        shell: bash
        run: |
          LEGACY_TOKEN="$(printf 'fio%s' 'lab')"
          if git grep -ni -I -F "$LEGACY_TOKEN"; then
            echo "Legacy identity reference detected."
            exit 1
          fi
          grep -F 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -F 'namespace = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -F 'android:scheme="com.timachado.brothermatrizes"' app/src/main/AndroidManifest.xml

      - name: Prepare Brother brand assets
        shell: bash
        run: |
          bash scripts/prepare_brand_assets.sh
          file app/src/main/res/drawable-nodpi/brother_matrizes_brand_logo.jpg
          file app/src/main/res/mipmap-xxxhdpi/ic_launcher_brother_matrizes.jpg

      - name: Repository safety checks
        run: bash scripts/pre_release_static_check.sh

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      # A release candidate must validate the actual APK on an Android runtime.
      # Unit tests and lint do not cover the document picker, navigation or OAuth callback.
      # Artifact remains a diagnostic APK, never evidence that runtime QA passed.
      - name: Build debug APK for QA
        run: gradle :app:assembleDebug --stacktrace

      - name: Build unsigned release candidate (not distributed)
        run: gradle :app:assembleRelease --stacktrace

      - name: Validate APK alignment and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Prepare downloadable files
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Brother-Matrizes-0.50.1-beta4-debug.apk
          zip -9 Brother-Matrizes-0.50.1-beta4-debug.zip Brother-Matrizes-0.50.1-beta4-debug.apk
          sha256sum Brother-Matrizes-0.50.1-beta4-debug.apk Brother-Matrizes-0.50.1-beta4-debug.zip > Brother-Matrizes-0.50.1-beta4-SHA256.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-0.50.1-beta4-QA-NOT-STABLE
          path: |
            Brother-Matrizes-0.50.1-beta4-debug.apk
            Brother-Matrizes-0.50.1-beta4-debug.zip
            Brother-Matrizes-0.50.1-beta4-SHA256.txt
          if-no-files-found: error

      - name: Enable KVM for Android emulator
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android emulator smoke tests (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            gradle :app:connectedDebugAndroidTest --stacktrace '-Pandroid.testInstrumentationRunnerArguments.class=com.timachado.brothermatrizes.AppSmokeTest,com.timachado.brothermatrizes.AuthDeepLinkTest,com.timachado.brothermatrizes.ExternalOpenIntentSmokeTest'

      - name: Explain Android emulator test failures
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files = sorted(Path('app/build/outputs/androidTest-results/connected').rglob('*.xml'))
          print('Android test result XML files:', len(files))
          found = 0
          for file in files:
              try:
                  root = ET.parse(file).getroot()
              except ET.ParseError:
                  continue
              for test in root.iter('testcase'):
                  for failure in [*test.findall('failure'), *test.findall('error')]:
                      found += 1
                      print('FAILED:', test.attrib.get('classname'), test.attrib.get('name'))
                      print((failure.attrib.get('message') or failure.text or '')[:3500])
          if not files or not found:
              print('No failing testcase could be extracted from XML; inspect the uploaded Android runtime artifact.')
          PY

      - name: Upload Android runtime test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-android-runtime-api35
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore

