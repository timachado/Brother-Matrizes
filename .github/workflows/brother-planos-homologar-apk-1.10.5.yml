name: Brother Matrizes 1.10.5 - QA de planos APK assinado

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brother-planos-homologar-apk-1.10.5.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-apk-staging-1105
  cancel-in-progress: false

jobs:
  signed-candidate:
    name: Compilar, assinar e arquivar APK de homologacao SEM publicar
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: brother-release-signing
    steps:
      - name: Baixar candidato Android 1.10.5
        uses: actions/checkout@v4
        with:
          ref: 3234649b3ef8c1f85b381fe401b8204e6a6acf3a
          persist-credentials: false
          path: android

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$sdkmanager"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Testes automatizados e APK release nao assinado
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest
          # Homologacao da versao comercial: sem diagnostico/token FCM na interface.
          gradle --no-daemon :app:assembleRelease

      - name: Assinar com certificado comercial original e auditar
        shell: bash
        env:
          RELEASE_JKS_B64: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for key in RELEASE_JKS_B64 RELEASE_STORE_PASS RELEASE_KEY_ALIAS RELEASE_KEY_PASS; do
            test -n "${!key:-}" || { echo "::error::Assinatura original nao configurada."; exit 1; }
          done
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$RELEASE_JKS_B64" | base64 -d > "$tmp/comercial.jks"
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -f -p 4 "$unsigned" "$tmp/aligned.apk"
          mkdir -p dist
          export RELEASE_STORE_PASS RELEASE_KEY_PASS
          signed="dist/Brother-Matrizes-v1.10.5-ASSINADO-HOMOLOGACAO.apk"
          "$tools/apksigner" sign --ks "$tmp/comercial.jks" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASS \
            --key-pass env:RELEASE_KEY_PASS \
            --out "$signed" "$tmp/aligned.apk"
          "$tools/zipalign" -c -p 4 "$signed"
          audit="$("$tools/apksigner" verify --verbose --print-certs "$signed")"
          printf '%s\n' "$audit" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          printf '%s\n' "$audit" | grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true'
          cert="$(printf '%s\n' "$audit" | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]{64})$/\1/p' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a" || {
            echo "::error::Certificado diferente do certificado comercial original do Brother Matrizes."; exit 1;
          }
          badging="$("$tools/aapt" dump badging "$signed" | head -n1)"
          [[ "$badging" == *"name='com.timachado.brothermatrizes'"* ]]
          [[ "$badging" == *"versionCode='181'"* ]]
          [[ "$badging" == *"versionName='1.10.5'"* ]]
          sha256sum "$signed" > dist/APK-SHA256.txt
          echo "APK de homologacao assinado validado: 1.10.5 codigo 181."
          echo "Nao foi publicado em GitHub Releases nem sincronizado com WordPress."

      - name: Guardar APK assinado para teste no aparelho
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-1.10.5-APK-TESTE-ASSINADO
          path: |
            dist/Brother-Matrizes-v1.10.5-ASSINADO-HOMOLOGACAO.apk
            dist/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 7
