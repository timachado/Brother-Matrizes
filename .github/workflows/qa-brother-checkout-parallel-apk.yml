name: QA Android login Google checkout — APK paralelo

on:
  push:
    branches: [feature/brother-google-checkout-handoff]
    paths: [.github/workflows/qa-brother-checkout-parallel-apk.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Preparar Google Services apenas para o pacote QA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/debug
          jq --arg pkg "com.timachado.brothermatrizes.qa" '
            .client += [(.client[] |
              select(.client_info.android_client_info.package_name == "com.timachado.brothermatrizes") |
              .client_info.android_client_info.package_name = $pkg)]
          ' app/google-services.json > app/src/debug/google-services.json
          jq -e '.client[]|select(.client_info.android_client_info.package_name == "com.timachado.brothermatrizes.qa")' app/src/debug/google-services.json >/dev/null
          grep -Fq 'applicationIdSuffix = ".qa"' app/build.gradle.kts
      - name: Preparar marca e validar tests
        shell: bash
        run: |
          bash scripts/prepare_brand_assets.sh
          gradle --no-daemon :app:testDebugUnitTest --stacktrace
      - name: Compilar APK QA independente
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:assembleDebug -PbrotherCheckoutQaParallel=true -PbrotherCheckoutHandoff=true --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          INFO="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$INFO" dump badging "$APK" | grep "^package: name='com.timachado.brothermatrizes.qa'"
          "$INFO" dump badging "$APK" | grep "Brother Matrizes QA"
          mkdir -p qa-output
          cp "$APK" qa-output/Brother-Matrizes-QA-Checkout-Google-PARALELO-debug.apk
          sha256sum qa-output/*.apk > qa-output/Brother-Matrizes-QA-Checkout-Google-PARALELO-debug.sha256
      - name: Publicar apenas artefato QA (não criar release)
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-QA-Checkout-Google-PARALELO
          path: qa-output/
          retention-days: 7
          if-no-files-found: error
