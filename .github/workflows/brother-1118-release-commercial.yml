name: Brother Matrizes 1.11.8 — lançamento comercial manual e protegido

# Não dispara no merge/push; requer comando explícito com token de confirmação.
# Única ação de publicação: workflow_dispatch em main + confirmação deliberada.
on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite PUBLICAR_V1_11_8 para autorizar Release e OTA'
        required: true
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: brother-official-v1-11-8-release
  cancel-in-progress: false

jobs:
  sign-verify-publish:
    if: github.ref == 'refs/heads/main' && inputs.confirmacao == 'PUBLICAR_V1_11_8'
    runs-on: ubuntu-latest
    environment: brother-release-signing
    timeout-minutes: 120
    steps:
      - name: Checkout da revisão comercial
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verificar homologação assinada, integridade e versão estável anterior
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(jq -r '.applicationId' updates/stable.json)" = "com.timachado.brothermatrizes"
          test "$(jq -r '.channel' updates/stable.json)" = "stable"
          test "$(jq -r '.versionCode' updates/stable.json)" = "194"
          test "$(jq -r '.versionName' updates/stable.json)" = "1.11.7"
          test "$(jq -r '.sha256' updates/stable.json)" = "c96434f71fb066afa4ac350d07aa3fd2ae594786809e6d98b2492460a88a5f08"
          grep -Eq '^\s*versionCode = 195\s*$' app/build.gradle.kts
          grep -Fq 'versionName = "1.11.8"' app/build.gradle.kts
          # O QA assinado da exata versão integrada precisa estar aprovado.
          gh api "repos/$GH_REPO/actions/runs/41599497544" > /tmp/brother-1118-qa.json
          jq -e '.status=="completed" and .conclusion=="success" and .head_sha=="734a311472e11c7371f853a4676c6aed85741e0e"' /tmp/brother-1118-qa.json >/dev/null
          git merge-base --is-ancestor 734a311472e11c7371f853a4676c6aed85741e0e HEAD
          # Bloqueia alterações não homologadas após o build assinado.
          while IFS= read -r changed; do
            case "$changed" in
              '.github/workflows/brother-1118-release-commercial.yml'|'scripts/verify_brother_1118_upgrade.sh') ;;
              *) echo "::error::Arquivo alterado desde o QA assinado: $changed"; exit 1 ;;
            esac
          done < <(git diff --name-only 734a311472e11c7371f853a4676c6aed85741e0e..HEAD)
          if gh release view v1.11.8 --repo "$GH_REPO" >/dev/null 2>&1; then
            echo '::error::A 1.11.8 já foi publicada. Não duplicar nem sobrescrever.'
            exit 1
          fi
          bash scripts/pre_release_static_check.sh
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Testes, lint e build de producao
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease -PbrotherCheckoutHandoff=true --stacktrace
          grep -R --include='BuildConfig.java' -Eq 'ENABLE_CHECKOUT_HANDOFF = true' app/build/generated/source/buildConfig/release
          grep -R --include='BuildConfig.java' -Eq 'BETA_LOCAL_IMPORTS = false' app/build/generated/source/buildConfig/release
          grep -R --include='BuildConfig.java' -Eq 'ENABLE_FCM_DIAGNOSTIC = false' app/build/generated/source/buildConfig/release
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verificar secrets de assinatura antes de publicar
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASS KEY_ALIAS KEY_PASS; do
            test -n "${!name}" || { echo "::error::Segredo $name ausente; parar sem publicar."; exit 1; }
          done

      - name: Alinhar e assinar APK com certificado original
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          sdk="$ANDROID_HOME/build-tools/36.0.0"
          ks="$RUNNER_TEMP/brother-1118-release.jks"
          mkdir -p dist
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ks"
          chmod 600 "$ks"
          test -s "$ks"
          "$sdk/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/brother-aligned.apk"
          "$sdk/apksigner" sign \
            --ks "$ks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASS --key-pass env:KEY_PASS \
            --out dist/Brother-Matrizes-1.11.8-OFICIAL-COMERCIAL-ASSINADO.apk \
            "$RUNNER_TEMP/brother-aligned.apk"
          chmod 600 dist/Brother-Matrizes-1.11.8-OFICIAL-COMERCIAL-ASSINADO.apk
          "$sdk/zipalign" -P 16 -c 4 dist/Brother-Matrizes-1.11.8-OFICIAL-COMERCIAL-ASSINADO.apk
          "$sdk/apksigner" verify --min-sdk-version 26 --verbose --print-certs dist/Brother-Matrizes-1.11.8-OFICIAL-COMERCIAL-ASSINADO.apk > /tmp/brother-signature-1118.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/brother-signature-1118.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a' /tmp/brother-signature-1118.txt
          badging="$("$sdk/aapt" dump badging dist/Brother-Matrizes-1.11.8-OFICIAL-COMERCIAL-ASSINADO.apk | head -n 1)"
          [[ "$badging" == *"name='com.timachado.brothermatrizes'"* ]]
          [[ "$badging" == *"versionCode='195'"* ]]
          [[ "$badging" == *"versionName='1.11.8'"* ]]
          sha256sum dist/Brother-Matrizes-1.11.8-OFICIAL-COMERCIAL-ASSINADO.apk > dist/SHA256.txt
          cut -d' ' -f1 dist/SHA256.txt > /tmp/expected-sha-1118
          echo "BROTHER_RELEASE_SHA256=$(cat /tmp/expected-sha-1118)" >> "$GITHUB_ENV"
          rm -f "$ks" "$RUNNER_TEMP/brother-aligned.apk"
          echo 'APK comercial verificado: codigo 194, certificado original, v2 e alinhamento 16 KiB.'

      - name: Baixar APK 1.11.7 e comparar assinaturas
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          gh release download v1.11.7 --repo "$GH_REPO" --dir baseline \
            --pattern 'Brother-Matrizes-1.11.7-OFICIAL-COMERCIAL-ASSINADO.apk'
          sdk="$ANDROID_HOME/build-tools/36.0.0"
          old=baseline/Brother-Matrizes-1.11.7-OFICIAL-COMERCIAL-ASSINADO.apk
          echo "$(jq -r .sha256 updates/stable.json)  $old" | sha256sum -c -
          "$sdk/apksigner" verify --print-certs "$old" > /tmp/baseline-signature.txt
          grep -Fq 'Signer #1 certificate SHA-256 digest: fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a' /tmp/baseline-signature.txt
          info="$("$sdk/aapt" dump badging "$old" | head -n 1)"
          [[ "$info" == *"versionCode='194'"* ]]
          [[ "$info" == *"name='com.timachado.brothermatrizes'"* ]]

      - name: Guardar candidato assinado para auditoria
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-1.11.8-signed-production-candidate
          path: |
            dist/Brother-Matrizes-1.11.8-OFICIAL-COMERCIAL-ASSINADO.apk
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Permitir KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Comprovar atualizacao instalada de 1.11.7 para 1.11.8
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 1800
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/verify_brother_1118_upgrade.sh

      - name: Publicar APK oficial 1.11.8 somente apos upgrade aprovado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          apk=dist/Brother-Matrizes-1.11.8-OFICIAL-COMERCIAL-ASSINADO.apk
          echo "$(cat /tmp/expected-sha-1118)  $apk" | sha256sum -c -
          cat >/tmp/notes-1118.md <<'NOTES'
          # Brother Matrizes 1.11.8 — Editor e PE-DESIGN Windows
          - Avisos de proximidade do nome agora identificam a matriz ativa e a margem mínima de segurança.
          - Opção explícita para permitir sobreposição intencional no editor.
          - Novo comando Salvar PES para PC com compatibilidade PES v6 para PE-DESIGN no Windows.
          - Novo comando Compartilhar PES para transferir o bordado ao computador.
          - Preservados os formatos e fluxos anteriores de máquinas Brother, DST e JEF.
          - Assinatura oficial e atualização instalada da 1.11.7 para 1.11.8 verificadas no Android 35.
          - Confira as dimensões, cores e a simulação antes de bordar.
          NOTES
          gh release create v1.11.8 "$apk" \
            --repo "$GH_REPO" --target "$GITHUB_SHA" \
            --title "Brother Matrizes 1.11.8 — Editor de Monogramas" \
            --notes-file /tmp/notes-1118.md --latest
          gh api "repos/$GH_REPO/releases/tags/v1.11.8" > /tmp/release-1118.json
          jq -e --arg sha "sha256:$(cat /tmp/expected-sha-1118)" '
            .draft == false and .prerelease == false and .published_at != null
            and (.assets|length)==1
            and .assets[0].name == "Brother-Matrizes-1.11.8-OFICIAL-COMERCIAL-ASSINADO.apk"
            and .assets[0].digest == $sha
          ' /tmp/release-1118.json >/dev/null

      - name: Solicitar atualizacao do manifesto OTA oficial
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run brother-ota-after-published.yml \
            --repo "$GH_REPO" --ref main -f tag=v1.11.8

      - name: Confirmar manifesto OTA, versao e hash antes do push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            gh api "repos/$GH_REPO/contents/updates/stable.json?ref=main" --jq .content \
              | tr -d '\n' | base64 --decode > /tmp/brother-verified-manifest-1118.json
            if jq -e --arg sha "$(cat /tmp/expected-sha-1118)" '
              .applicationId=="com.timachado.brothermatrizes" and
              .channel=="stable" and .versionCode==195 and .versionName=="1.11.8"
              and .sha256==$sha
              and .downloadUrl=="https://github.com/timachado/Brother-Matrizes/releases/download/v1.11.8/Brother-Matrizes-1.11.8-OFICIAL-COMERCIAL-ASSINADO.apk"
              and .downloadApkUrl==.downloadUrl
            ' /tmp/brother-verified-manifest-1118.json >/dev/null; then
              echo 'OTA 1.11.8/194 confirmada com hash correto.'
              exit 0
            fi
            sleep 12
          done
          echo "::error::OTA v1.11.8 nao foi confirmada: push bloqueado."
          exit 1

