name: Brother Matrizes - preparar release oficial v1.10.1
on:
  push:
    branches:
      - hotfix/brother-matrizes-1.10.1-updates-premium
    paths:
      - .github/workflows/brother-prepare-direct-release.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Criar release DRAFT, sem arquivo ou anuncio
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.10.1 --json isDraft >/dev/null 2>&1; then
            echo "Release existente; nenhum dado modificado."
            exit 0
          fi
          cat > /tmp/brother-notes.md <<'EOF'
          # Brother Matrizes 1.10.1 — Hotfix Premium
          
          - Atualização direta por URL HTTPS oficial verificada e SHA-256
          - Ícone BM nas notificações Android
          - Card de novidades compacto e mensagens amigáveis
          
          ### Assinatura comercial
          Pacote `com.timachado.brothermatrizes` | VersionCode `177`
          
          APK assinado SHA-256:
          `fd0cd07eaf71915f1d15dcbed6e3681c113cbde6df2c50ac3e1b27c0bc226651`
          
          Certificado original SHA-256:
          `fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a`
          
          **Release em rascunho até envio e validação do APK comercial original.**
          Não enviar artefatos unsigned ou debug.
          EOF
          gh release create v1.10.1 --draft --target "$COMMIT_SHA" \
            --title "Brother Matrizes 1.10.1 — Atualização Premium" \
            --notes-file /tmp/brother-notes.md
          echo "Release rascunho preparado com sucesso."
