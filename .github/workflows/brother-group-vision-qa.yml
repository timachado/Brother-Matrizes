name: Brother Vision grupos — QA de segurança

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "docs/BROTHER_VISION_GROUPS_SECURITY.md"
      - ".github/workflows/brother-group-vision-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-group-vision-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Testes de permissões, segurança e compilação Android
        # Telegram Desktop publishes TEST-ONLY app keys for debugging unofficial
        # clients. They are rate-limited and MUST NOT be used for production.
        # Source: https://github.com/telegramdesktop/tdesktop/blob/dev/docs/api_credentials.md
        run: >-
          gradle --no-daemon
          :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          -PbrotherGroupQaParallel=true
          -PbrotherTelegramApiId=17349
          -PbrotherTelegramApiHash=344583e45741c457fe1862106095a5eb
          --stacktrace
      - name: Verificar pacote separado e assinatura
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" > vision-ocr-badging.txt
          grep -F "package: name='com.timachado.brothermatrizes.telegramqa'" vision-ocr-badging.txt
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > vision-ocr-signature.txt
          sha256sum "$apk" > vision-ocr-sha256.txt
          echo 'TEST-ONLY Telegram API credentials: limited login; no commercial distribution.'

      - name: Disponibilizar APK experimental com Telegram TEST ONLY limitado
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Lens-Telegram-TEST-ONLY-QA-NAO-COMERCIAL
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            vision-ocr-badging.txt
            vision-ocr-signature.txt
            vision-ocr-sha256.txt
          if-no-files-found: error
