name: Temporary PES binary diagnostic

on:
  push:
    branches: ["refactor/brother-matrizes-clean-0469"]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Generate app PES fixture
        run: gradle :app:testDebugUnitTest --tests "*PesBinaryDiagnosticTest*" --stacktrace

      - name: Fetch known-good PES fixture
        shell: bash
        run: |
          mkdir -p app/build/diagnostics
          curl -L --fail -o app/build/diagnostics/simple-known-good.pes https://raw.githubusercontent.com/quentin452/Catz-Embroidery/12ea3d2f08e7bfd99514154914f83cd30a65528f/fixtures/simple.pes

      - name: Upload PES diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: brother-pes-binary-diagnostics
          path: app/build/diagnostics/*
          if-no-files-found: error
          retention-days: 1
