name: Temporary PES binary diagnostic\n\non:\n  push:\n    branches: ["refactor/brother-matrizes-clean-0469"]\n\npermissions:\n  contents: read\n\njobs:\n  diagnose:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Java 17\n        uses: actions/setup-java@v4\n        with:\n          distribution: temurin\n          java-version: "17"\n\n      - name: Prepare Android SDK 36\n        shell: bash\n        run: |\n          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"\n          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"\n\n      - name: Setup Gradle 9.6.0\n        uses: gradle/actions/setup-gradle@v4\n        with:\n          gradle-version: "9.6.0"\n\n      - name: Generate app PES fixture\n        run: gradle :app:testDebugUnitTest --tests "*PesBinaryDiagnosticTest*" --stacktrace\n\n      - name: Fetch known-good PES fixture\n        shell: bash\n        run: |\n          mkdir -p app/build/diagnostics\n          curl -L --fail -o app/build/diagnostics/simple-known-good.pes https://raw.githubusercontent.com/quentin452/Catz-Embroidery/12ea3d2f08e7bfd99514154914f83cd30a65528f/fixtures/simple.pes\n\n      - name: Upload PES diagnostics\n        uses: actions/upload-artifact@v4\n        with:\n          name: brother-pes-binary-diagnostics\n          path: app/build/diagnostics/*\n          if-no-files-found: error\n          retention-days: 1\n