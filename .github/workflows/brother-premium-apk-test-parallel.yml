name: Brother Matrizes Premium — APK teste Android paralelo

# APK apenas para avaliação privada antes do lançamento no site e WhatsApp.
# NUNCA publica na GitHub Release, site ou Google Play.
on:
  push:
    branches:
      - feature/brother-premium-visual-20261020
    paths:
      - 'app/**'
      - 'branding/**'
      - '.github/workflows/brother-premium-apk-test-parallel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Compilar APK 1.11.0 QA2 ao lado dos anteriores
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Preparar Java 17 e Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Preparar SDK Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Preparar identidade paralela e Firebase de teste
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationIdSuffix = ".qa2"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-QA2"' app/build.gradle.kts
          mkdir -p app/src/debug
          jq --arg pkg "com.timachado.brothermatrizes.qa2" '
            .client += [(.client[] |
              select(.client_info.android_client_info.package_name == "com.timachado.brothermatrizes") |
              .client_info.android_client_info.package_name = $pkg)]
          ' app/google-services.json > app/src/debug/google-services.json
          jq -e '.client[]|select(.client_info.android_client_info.package_name == "com.timachado.brothermatrizes.qa2")' app/src/debug/google-services.json >/dev/null
          # Alteração só no workspace temporário do CI, sem modificar arquivos comerciais.
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/AndroidManifest.xml")
          s=p.read_text()
          old='android:label="Brother Matrizes"'
          assert s.count(old)==1
          p.write_text(s.replace(old,'android:label="Brother Matrizes QA 2"'))
          PY
      - name: Verificar segurança e compilar APK paralelo de teste
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/pre_release_static_check.sh
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug -PbrotherPremiumQaV2=true --stacktrace
      - name: Conferir APK de instalação independente
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          # Evitar pipefail/SIGPIPE de 'aapt ... | grep -q', que pode
          # falhar mesmo quando o pacote foi gerado corretamente.
          full_badging="$("$aapt" dump badging "$apk")"
          echo "Identidade: ${full_badging%%
          # Checkout comercial não deve ser ativado nesta distribuição QA visual.
          grep -R --include='BuildConfig.java' -Eq 'ENABLE_CHECKOUT_HANDOFF = false' app/build/generated/source/buildConfig/debug
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > apk-verification.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-verification.txt
          mkdir -p qa-apk
          cp "$apk" qa-apk/Brother-Matrizes-Premium-1.11.0-QA2-PARALELO.apk
          sha256sum qa-apk/*.apk > qa-apk/SHA256.txt
          echo "APK de teste separado validado, sem uso da chave comercial."
      - name: Entregar APK de teste como artefato privado de Actions
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-Premium-1.11.0-QA2-PARALELO
          path: qa-apk/
          if-no-files-found: error
          retention-days: 14
      - name: Resumo da QA
        shell: bash
        run: |
          {
            echo "## APK de teste Brother Matrizes 1.11.0"
            echo '- Pacote de revisão independente: com.timachado.brothermatrizes.qa2.'
            echo "- Pode instalar ao lado do aplicativo comercial, sem desinstalação."
            echo "- Assinatura debug; não substitui o APK comercial."
            echo "- Checkout comercial desativado; login Google pode exigir configuração própria para identidade QA."
            echo "- APK exclusivamente para conferência visual e funções locais."
            echo "- Nenhum arquivo publicado no site, grupo ou Google Play."
          } >> "$GITHUB_STEP_SUMMARY"
\\n'*}"
          [[ "$full_badging" == *"package: name='com.timachado.brothermatrizes.qa2'"* ]]
          [[ "$full_badging" == *"versionCode='187'"* ]]
          [[ "$full_badging" == *"versionName='1.11.0-QA2'"* ]]
          [[ "$full_badging" == *"Brother Matrizes QA 2"* ]]
          # Checkout comercial não deve ser ativado nesta distribuição QA visual.
          grep -R --include='BuildConfig.java' -Eq 'ENABLE_CHECKOUT_HANDOFF = false' app/build/generated/source/buildConfig/debug
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" > apk-verification.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-verification.txt
          mkdir -p qa-apk
          cp "$apk" qa-apk/Brother-Matrizes-Premium-1.11.0-QA2-PARALELO.apk
          sha256sum qa-apk/*.apk > qa-apk/SHA256.txt
          echo "APK de teste separado validado, sem uso da chave comercial."
      - name: Entregar APK de teste como artefato privado de Actions
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-Premium-1.11.0-QA2-PARALELO
          path: qa-apk/
          if-no-files-found: error
          retention-days: 14
      - name: Resumo da QA
        shell: bash
        run: |
          {
            echo "## APK de teste Brother Matrizes 1.11.0"
            echo '- Pacote de revisão independente: com.timachado.brothermatrizes.qa2.'
            echo "- Pode instalar ao lado do aplicativo comercial, sem desinstalação."
            echo "- Assinatura debug; não substitui o APK comercial."
            echo "- Checkout comercial desativado; login Google pode exigir configuração própria para identidade QA."
            echo "- APK exclusivamente para conferência visual e funções locais."
            echo "- Nenhum arquivo publicado no site, grupo ou Google Play."
          } >> "$GITHUB_STEP_SUMMARY"
