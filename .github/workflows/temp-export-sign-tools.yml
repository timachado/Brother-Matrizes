name: Temporary export Android signing tools

on:
  push:
    branches: ["refactor/brother-matrizes-clean-0469"]

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "build-tools;36.0.0"

      - name: Package signing tools
        shell: bash
        run: |
          BT="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p /tmp/android-sign-tools/lib
          cp "$BT/apksigner" /tmp/android-sign-tools/
          cp "$BT/zipalign" /tmp/android-sign-tools/
          cp "$BT/lib/apksigner.jar" /tmp/android-sign-tools/lib/
          chmod +x /tmp/android-sign-tools/apksigner /tmp/android-sign-tools/zipalign
          tar -C /tmp -czf android-sign-tools-36.0.0.tar.gz android-sign-tools

      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-sign-tools-36.0.0
          path: android-sign-tools-36.0.0.tar.gz
          retention-days: 1
