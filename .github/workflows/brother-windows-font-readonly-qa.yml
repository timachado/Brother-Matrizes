name: Brother Matrizes - Windows fontes TTF/OTF somente leitura (QA)

on:
  push:
    branches:
      - feature/windows-fiel-android-1-11-8-20261106
    paths:
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/DesktopFontCatalogScreen.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/FielMain.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopReadOnlyFontAnalyzer.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopFontGlyphProbe.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopReadOnlyFontAnalyzerTest.kt"
      - ".github/workflows/brother-windows-font-readonly-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-readonly-fonts:
    name: Fonte externa por Skia sem importar, modificar ou reservar cota
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      BROTHER_WINDOWS_QA_GOOGLE_AUTH: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Testar assinatura TTF/OTF, fonte real e arquivos inválidos
        shell: pwsh
        run: |
          gradle -p windows-fiel test --no-daemon --stacktrace --tests '*DesktopReadOnlyFontAnalyzerTest' --tests '*DesktopFontGlyphProbeTest' --tests '*DesktopReadOnlyFontCatalogTest' --tests '*DesktopCommercialFontImportGateTest'
          if ($LASTEXITCODE -ne 0) { throw "Análise TTF/OTF local não homologada." }
      - name: Abrir janela de fontes sem autenticar ou registrar arquivos
        shell: pwsh
        run: |
          gradle -p windows-fiel run --args="--capture-fonts-qa" --no-daemon --stacktrace
          if ($LASTEXITCODE -ne 0) { throw "Biblioteca de Fontes não abriu no Windows." }
          $png = "windows-fiel/build/qa/fonts-windows-readonly-qa.png"
          if (!(Test-Path $png) -or (Get-Item $png).Length -lt 10000) {
            throw "Captura da Biblioteca de Fontes inválida."
          }
          "BROTHER_WINDOWS_FONT_READONLY_QA_OK"
      - name: Guardar captura da Biblioteca de Fontes sem dados pessoais
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Windows-Font-ReadOnly-QA-Screenshot
          path: windows-fiel/build/qa/fonts-windows-readonly-qa.png
          if-no-files-found: warn
          retention-days: 14
