name: Brother Matrizes - compatibilidade PE-DESIGN Windows (QA)

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/com/timachado/brothermatrizes/core/embroidery/MatrixConverter.kt'
      - 'app/src/main/java/com/timachado/brothermatrizes/ViewerScreen.kt'
      - 'app/src/main/java/com/timachado/brothermatrizes/MainActivity.kt'
      - 'app/src/test/java/com/timachado/brothermatrizes/core/embroidery/MatrixConverterTest.kt'
      - 'scripts/verify_pe_design_pes.py'
      - '.github/workflows/pe-design-compat-qa.yml'

permissions:
  contents: read

jobs:
  pes-pc-tests:
    name: Unitarios Android e leitura PES por Python independente
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: SDK Android 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Compilar e executar testes do conversor sem gerar release
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/pre_release_static_check.sh
          gradle --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin :app:assembleDebug --stacktrace
      - name: Validar os PES completos em biblioteca independente
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pyembroidery==1.5.1
          python3 scripts/verify_pe_design_pes.py app/build/pe-design-fixtures
      - name: Guardar relatorios sem distribuir aplicativo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pe-design-qa-results-NAO-COMERCIAL
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/pe-design-fixtures/
          retention-days: 7
          if-no-files-found: ignore
