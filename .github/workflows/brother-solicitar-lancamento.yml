name: Brother Matrizes - Acionar lancamento aprovado

on:
  push:
    branches: [main]
    paths:
      - 'ops/brother-release-requests/*.json'

permissions:
  contents: read
  actions: write

concurrency:
  group: brother-commercial-dispatch
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conferir pedido autorizado no repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Identificar um unico arquivo de pedido nesta alteracao
        id: request
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t requests < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
            grep -E '^ops/brother-release-requests/[0-9]+\.[0-9]+\.[0-9]+\.json$' || true)
          test "${#requests[@]}" -eq 1 || {
            echo "::error::Esperado um unico pedido de lancamento validado."; exit 1;
          }
          FILE="${requests[0]}"
          test -s "$FILE"
          version="$(jq -er .version_name "$FILE")"
          code="$(jq -er .version_code "$FILE")"
          ref="$(jq -er .source_ref "$FILE")"
          notes="$(jq -er .release_notes "$FILE")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          [[ "$code" =~ ^[0-9]+$ ]] || exit 1
          [[ "$ref" == "release/brother-matrizes-$version" ]] || exit 1
          [[ "$FILE" == "ops/brother-release-requests/$version.json" ]] || exit 1
          [[ "$notes" != *$'\n'* ]] && test "${#notes}" -ge 12 && test "${#notes}" -le 3500
          test "$code" -gt 177
          echo "SOURCE_REF=$ref" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "RELEASE_NOTES=$notes" >> "$GITHUB_ENV"
          echo "Pedido seguro preparado: $version (codigo $code)."

      - name: Acionar fluxo comercial com notificacoes automáticas para usuários inscritos
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GH_REPO" = "timachado/Brother-Matrizes"
          gh workflow run brother-commercial-release.yml --ref main \
            -f source_ref="$SOURCE_REF" \
            -f version_name="$VERSION_NAME" \
            -f version_code="$VERSION_CODE" \
            -f release_notes="$RELEASE_NOTES" \
            -f announce=true \
            -f dry_run=false
          echo "Pedido enviado ao validador comercial. O APK so sera publicado apos os testes e verificacoes."
