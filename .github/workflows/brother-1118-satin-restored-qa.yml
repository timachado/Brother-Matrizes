name: Brother 1.10.18 - preservar simulacao Satin e glifos

on:
  push:
    branches: [fix/brother-1118-restore-satin-glyphs]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  satin-regression:
    name: Compilar e testar Satin tradicional e contornos TTF OTF
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Bloquear retorno da simulacao hibrida 1.10.17
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 194' app/build.gradle.kts
          grep -Fq 'versionName = "1.10.18"' app/build.gradle.kts
          ! grep -Fq 'outlineFillRails' app/src/main/java/com/timachado/brothermatrizes/font/CleanRoomSatinEngine.kt
          ! grep -Fq 'usesOutlineFill' app/src/main/java/com/timachado/brothermatrizes/font/CleanRoomSatinEngine.kt
          grep -Fq 'stitchPlannedGlyphForTest' app/src/main/java/com/timachado/brothermatrizes/font/CleanRoomSatinEngine.kt
          grep -Fq 'ImportedGlyphContourSampling.sampleCount' app/src/main/java/com/timachado/brothermatrizes/font/AndroidSkiaOutlineExtractor.kt
          grep -Fq 'originalSatinStrokeRoutingIsPreservedForWideDecorativeGlyphs' app/src/test/java/com/timachado/brothermatrizes/font/CleanRoomSatinEngineTest.kt
      - name: Compilar Android e executar a suite completa
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
