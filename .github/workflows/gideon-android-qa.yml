name: GIDEON - QA Android sem publicacao
on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - '.github/workflows/gideon-android-qa.yml'
      - 'docs/GIDEON-*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gideon-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-qa:
    name: Integridade, unitarios, lint e APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout somente leitura
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Instalar SDK Android 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Verificacao estatica atual
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/pre_release_static_check.sh
          if grep -R -niE 'matrix.engine|matrixengine|com\.timachado\.matrix' app/src/main/java --include='*.kt' --include='*.java'; then
            echo "DEPENDENCIA INDEVIDA: Brother original nao usa Matrix Engine"
            exit 1
          fi
      - name: Unitarios e Android Lint
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug --stacktrace
      - name: Compilar sem publicar
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          echo "APK debug gerado exclusivamente no runner; sem upload, assinatura comercial, deploy ou release."
