name: Brother 1.10.9 - homologar apenas glifos TTF OTF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/brother-1109-glyph-only-sign.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-1109-glyph-only-homologacao
  cancel-in-progress: false

jobs:
  signed-candidate:
    name: Build, QA e assinatura original - NAO PUBLICAR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: brother-release-signing
    steps:
      - name: Carregar exatamente a candidata revisada
        uses: actions/checkout@v4
        with:
          ref: f318eb8d35853796e820dd60b3803debd9701224
          persist-credentials: false
          path: android
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Conferir versao, identidade e motor de simulacao intocado
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -Fq 'versionCode = 185' app/build.gradle.kts
          grep -Fq 'versionName = "1.10.9"' app/build.gradle.kts
          test "$(git hash-object app/src/main/java/com/timachado/brothermatrizes/font/CleanRoomSatinEngine.kt)" = "a398a02a598d775b63c4b328c2125aa84bf808c0"
          test "$(git hash-object app/src/main/java/com/timachado/brothermatrizes/MachineSimulationCanvas.kt)" = "46b58e9ab7b10414970bc47542b7ee5072609646"
          test "$(git hash-object app/src/main/java/com/timachado/brothermatrizes/SimulatorScreen.kt)" = "f51abd96933338b53ee2cf7393f1594aeb726da5"
          test "$(git hash-object app/src/main/java/com/timachado/brothermatrizes/EmbroideryCanvas.kt)" = "bb5760d057127c68c3370157c6aaddf2aa46ec06"
          test "$(git hash-object app/src/main/java/com/timachado/brothermatrizes/StitchThreadSegments.kt)" = "40d8aac9e51fffd2e99ec63fb8b402edb7b4ba40"
          grep -Fq 'extractShapedGlyphs(paint, text, codePoints)' app/src/main/java/com/timachado/brothermatrizes/font/AndroidSkiaOutlineExtractor.kt
          test -s app/src/main/java/com/timachado/brothermatrizes/font/ImportedGlyphVectorGeometry.kt
          test -s app/src/test/java/com/timachado/brothermatrizes/font/ImportedGlyphVectorGeometryTest.kt

      - name: Testes unitarios e APK release
        working-directory: android
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Assinar com certificado comercial original e verificar
        shell: bash
        env:
          RELEASE_JKS_B64: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for key in RELEASE_JKS_B64 RELEASE_STORE_PASS RELEASE_KEY_ALIAS RELEASE_KEY_PASS; do
            test -n "${!key:-}" || { echo "::error::Assinatura comercial indisponivel."; exit 1; }
          done
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$RELEASE_JKS_B64" | base64 -d > "$tmp/original.jks"
          unsigned="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/zipalign" -f -p 4 "$unsigned" "$tmp/aligned.apk"
          mkdir -p dist
          export RELEASE_STORE_PASS RELEASE_KEY_PASS
          signed="dist/Brother-Matrizes-1.10.9-GLIFOS-EXCLUSIVOS-HOMOLOGACAO.apk"
          "$tools/apksigner" sign --ks "$tmp/original.jks" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASS \
            --key-pass env:RELEASE_KEY_PASS \
            --out "$signed" "$tmp/aligned.apk"
          "$tools/zipalign" -c -p 4 "$signed"
          audit="$("$tools/apksigner" verify --verbose --print-certs "$signed")"
          printf '%s\n' "$audit" | grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true'
          printf '%s\n' "$audit" | grep -F 'Verified using v3 scheme (APK Signature Scheme v3): true'
          cert="$(printf '%s\n' "$audit" | sed -nE 's/^Signer #1 certificate SHA-256 digest: ([a-fA-F0-9]{64})$/\1/p' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = "fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a" || {
            echo "::error::Certificado diferente da instalacao comercial original."; exit 1;
          }
          badging="$("$tools/aapt" dump badging "$signed" | head -n1)"
          [[ "$badging" == *"name='com.timachado.brothermatrizes'"* ]]
          [[ "$badging" == *"versionCode='185'"* ]]
          [[ "$badging" == *"versionName='1.10.9'"* ]]
          sha256sum "$signed" > dist/APK-SHA256.txt
          echo "Homologacao pronta; sem publicar release nem atualizar manifesto ou Supabase."
      - name: Disponibilizar apenas o artefato privado de homologacao
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-1.10.9-GLIFOS-EXCLUSIVOS-APK-ASSINADO-HOMOLOGACAO
          path: |
            dist/Brother-Matrizes-1.10.9-GLIFOS-EXCLUSIVOS-HOMOLOGACAO.apk
            dist/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 7
