name: Brother Matrizes - QA Leitor EMB Nativo

on:
  push:
    branches: [ main ]
    paths:
      - ".github/workflows/emb-native-reader-qa.yml"
      - "app/src/main/java/com/timachado/fiolab/core/embroidery/EmbNativeInspector.kt"
      - "app/src/main/java/com/timachado/fiolab/core/embroidery/EmbroideryLoader.kt"
      - "app/src/main/java/com/timachado/fiolab/core/embroidery/EmbroideryModels.kt"
      - "app/src/main/java/com/timachado/fiolab/EmbNativePreviewScreen.kt"
      - "app/src/main/java/com/timachado/fiolab/MainActivity.kt"
      - "app/src/test/java/com/timachado/fiolab/core/embroidery/EmbNativeInspectorTest.kt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-qa:
    name: Compilar e testar EMB sem publicar APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Unit tests e compilação Android
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Sem publicação automática
        run: echo "Somente QA. Nenhum APK comercial será publicado."
