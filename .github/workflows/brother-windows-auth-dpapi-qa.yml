name: Brother Matrizes - Windows OAuth e DPAPI (QA isolada)

on:
  push:
    branches:
      - feature/windows-fiel-android-1-11-8-20261106
    paths:
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/Desktop*Session*.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/Desktop*Pkce*.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopGooglePkceLoginCoordinator.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopRedirectAllowlistReview.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/DesktopAccountQaScreen.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopRedirectAllowlistReviewTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/Desktop*Session*.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/Desktop*Pkce*.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopGooglePkceLoginCoordinatorTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopWindowsFullGoogleQaFlowTest.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopWindowsAuthQaController.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopWindowsGoogleQaEnvironment.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopSupabaseGoogleIdentityVerifier.kt"
      - "windows-fiel/src/main/kotlin/com/timachado/brothermatrizes/desktop/platform/DesktopBrotherEntitlementReader.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopWindowsAuthQaControllerTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopSupabaseGoogleIdentityVerifierTest.kt"
      - "windows-fiel/src/test/kotlin/com/timachado/brothermatrizes/desktop/DesktopBrotherEntitlementReaderTest.kt"
      - "windows-fiel/build.gradle.kts"
      - ".github/workflows/brother-windows-auth-dpapi-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-dpapi:
    name: Compilar e testar OAuth, refresh e DPAPI do usuario Windows
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
      - name: Executar testes Windows OAuth, rede fake, concorrencia e DPAPI nativo
        shell: pwsh
        run: |
          gradle -p windows-fiel test --no-daemon --stacktrace `
            --tests '*DesktopWindowsAuthQaControllerTest' `
            --tests '*DesktopSupabaseGoogleIdentityVerifierTest' `
            --tests '*DesktopBrotherEntitlementReaderTest' `
            --tests '*DesktopWindowsDpapiSessionStoreTest' `
            --tests '*DesktopWindowsLockedSessionRuntimeTest' `
            --tests '*DesktopTransientSessionKeeperTest' `
            --tests '*DesktopSupabaseGooglePkceClientTest' `
            --tests '*DesktopGooglePkceLoginCoordinatorTest' `
            --tests '*DesktopWindowsFullGoogleQaFlowTest' `
            --tests '*DesktopPkceHandshakeTest' `
            --tests '*DesktopPkceRedirectPreflightTest' `
            --tests '*DesktopRedirectAllowlistReviewTest' `
            --tests '*DesktopPkceLoopbackListenerTest'
      - name: Garantir que QA nao criou executavel comercial
        shell: pwsh
        run: |
          if (Test-Path "windows-fiel/build/compose/binaries/main/exe") {
            throw "EXE comercial inesperado durante QA de autenticacao."
          }
          "WINDOWS_AUTH_DPAPI_OFFLINE_QA_OK"
