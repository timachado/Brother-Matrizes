name: QA EMB Nativo - Brother Matrizes Comercial

on:
  push:
    branches:
      - feature/brother-emb-native-readonly-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK Android 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Conferir que o projeto comercial nao foi alterado
        run: |
          grep -Fq 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -Fq 'versionName = "1.10.8"' app/build.gradle.kts
          grep -Fq 'BETA_LOCAL_IMPORTS' app/build.gradle.kts
      - name: Unit tests e compilacao Android
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Nenhum APK de producao e publicado
        run: echo 'Somente homologacao local, sem assinatura e sem publicacao.'
