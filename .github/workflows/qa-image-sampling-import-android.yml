name: Image Sampling Android Import Regression

on:
  push:
    branches: ["qa/image-source-sampling-audit-20261017"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-import-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Commercial app protection
        run: |
          grep -F 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -F 'applicationIdSuffix = ".qasample"' app/build.gradle.kts
          grep -F 'versionCode = 184' app/build.gradle.kts
          grep -F 'versionName = "1.10.8"' app/build.gradle.kts
      - name: Compile import regression tests
        run: gradle :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Test Android BitmapFactory import on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_3a
          disable-animations: true
          emulator-boot-timeout: 600
          script: gradle :app:connectedDebugAndroidTest --no-daemon --stacktrace -Pandroid.testInstrumentationRunnerArguments.class=com.timachado.brothermatrizes.RasterImageSamplingImportInstrumentedTest
      - name: Upload import regression reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-image-sampling-import-regression-reports
          path: |
            app/build/outputs/androidTest-results/connected
            app/build/reports/androidTests/connected
          if-no-files-found: ignore
