name: Brother 1.10.14 - live presence QA

on:
  push:
    branches:
      - feature/brother-1.10.14-live-presence
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brother-1-10-14-live-presence-qa
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout da branch de presença
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verificar isolamento da alteração
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -Fq 'versionCode = 190' app/build.gradle.kts
          grep -Fq 'versionName = "1.10.14"' app/build.gradle.kts
          test -s app/src/main/java/com/timachado/brothermatrizes/BrotherPresenceHeartbeat.kt
          test -s app/src/main/java/com/timachado/brothermatrizes/core/account/BrotherPresenceClient.kt
          grep -Fq 'BrotherPresenceHeartbeat()' app/src/main/java/com/timachado/brothermatrizes/MainActivity.kt
          grep -Fq 'recordPresence(context: Context)' app/src/main/java/com/timachado/brothermatrizes/core/account/BrotherMatrizesAccountService.kt
          grep -Fq '/functions/v1/brother-presence' app/src/main/java/com/timachado/brothermatrizes/core/account/BrotherPresenceClient.kt

      - name: Testes unitários e compilação debug
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Artefato privado para QA
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-1.10.14-Live-Presence-QA
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
