name: Brother NetFontes - APK homologacao com certificado original

on:
  push:
    branches: [feature/netfontes-font-browser-20261015]
    paths: ['.github/workflows/qa-netfontes-signed-candidate.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netfontes-signed-homologacao
  cancel-in-progress: true

jobs:
  sign:
    name: Compilar e assinar candidata nao-publica
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout seguro
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verificar versao oficial sem alteracoes
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 184' app/build.gradle.kts
          grep -Fq 'versionName = "1.10.8"' app/build.gradle.kts
          grep -Fq 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          test -s app/src/main/java/com/timachado/brothermatrizes/font/NetFontesNavigationRules.kt
      - name: Testar e compilar candidato release
        run: |
          set -euo pipefail
          bash scripts/prepare_brand_assets.sh
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease --stacktrace
      - name: Assinar com o certificado comercial original
        shell: bash
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for key in RELEASE_KEYSTORE_B64 RELEASE_STORE_PASS RELEASE_KEY_ALIAS RELEASE_KEY_PASS; do
            test -n "${!key:-}" || { echo "::error::Segredo de assinatura comercial ausente."; exit 1; }
          done
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 -d > "$tmp/production.jks"
          chmod 600 "$tmp/production.jks"
          buildtools="$ANDROID_HOME/build-tools/36.0.0"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$unsigned"
          "$buildtools/zipalign" -P 16 -f 4 "$unsigned" "$tmp/aligned.apk"
          mkdir -p dist
          signed="dist/Brother-Matrizes-1.10.8-NetFontes-HOMOLOGACAO-ASSINADO.apk"
          "$buildtools/apksigner" sign \
            --ks "$tmp/production.jks" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASS \
            --key-pass env:RELEASE_KEY_PASS \
            --out "$signed" "$tmp/aligned.apk"
          "$buildtools/zipalign" -P 16 -c -v 4 "$signed"
          "$buildtools/apksigner" verify --min-sdk-version 26 --verbose --print-certs "$signed" > dist/APK-ASSINATURA.txt
          cat dist/APK-ASSINATURA.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' dist/APK-ASSINATURA.txt
          cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/APK-ASSINATURA.txt | head -n 1)"
          test "$cert" = "fac3e71b641805e1183e34a636e50e4890e8fe24873f53e85d863b934815de4a" || {
            echo "::error::Certificado nao corresponde ao comercial original."; exit 1;
          }
          badging="$("$buildtools/aapt" dump badging "$signed" | head -n 1)"
          echo "$badging"
          [[ "$badging" == *"name='com.timachado.brothermatrizes'"* ]]
          [[ "$badging" == *"versionCode='184'"* ]]
          [[ "$badging" == *"versionName='1.10.8'"* ]]
          sha256sum "$signed" > dist/APK-SHA256.txt
          echo "APK validado criptograficamente; candidato NAO publicado."
      - name: Disponibilizar somente artefato de homologacao
        uses: actions/upload-artifact@v4
        with:
          name: Brother-NetFontes-APK-ASSINADO-HOMOLOGACAO
          path: |
            dist/Brother-Matrizes-1.10.8-NetFontes-HOMOLOGACAO-ASSINADO.apk
            dist/APK-ASSINATURA.txt
            dist/APK-SHA256.txt
          if-no-files-found: error
          retention-days: 7
