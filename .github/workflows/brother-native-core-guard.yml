name: Brother Native Core Guard

on:
  push:
    branches:
      - 'baseline/brother-matrizes-native-core-*'
      - 'feature/brother-*'
      - 'fix/brother-*'
      - 'release/brother-*'
      - 'hotfix/brother-*'
  pull_request:

permissions:
  contents: read

jobs:
  native-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verificar Native Core
        shell: bash
        run: |
          set -euo pipefail
          base="app/src/main/java/com/timachado/brothermatrizes"
          test -s "$base/BrotherPresenceHeartbeat.kt"
          test -s "$base/core/account/BrotherPresenceClient.kt"
          grep -Fq 'BrotherPresenceHeartbeat()' "$base/MainActivity.kt"
          grep -Fq 'recordPresence(context: Context)' "$base/core/account/BrotherMatrizesAccountService.kt"
          grep -Fq '/functions/v1/brother-presence' "$base/core/account/BrotherPresenceClient.kt"
          grep -Fq 'BROTHER_PRESENCE_INTERVAL_MS = 30_000L' "$base/BrotherPresenceHeartbeat.kt"
          grep -Fq 'Lifecycle.Event.ON_STOP' "$base/BrotherPresenceHeartbeat.kt"
          grep -Fq 'DeviceIdentity.current(context.applicationContext)' "$base/core/account/BrotherMatrizesAccountService.kt"
          test -s docs/BROTHER_NATIVE_CORE.md

      - name: Testes e compilação
        run: |
          set -euo pipefail
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
