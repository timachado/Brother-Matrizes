name: Brother Matrizes - recibos Pro V2 isolados (QA)

on:
  push:
    branches:
      - feature/windows-fiel-android-1-11-8-20261106
    paths:
      - "supabase/functions/brother-usage/pro-receipt-v2.ts"
      - "supabase/functions/brother-usage/pro-receipt-v2_test.ts"
      - "supabase/functions/brother-usage/pro-v2-route.ts"
      - "supabase/functions/brother-usage/pro-v2-route_test.ts"
      - "supabase/functions/brother-usage/index.ts"
      - "docs/BROTHER_WINDOWS_PRO_V2_RECIBOS_IDEMPOTENTES_ESPECIFICACAO.md"
      - ".github/workflows/brother-windows-pro-receipt-v2-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receipt-contract:
    name: Plano Pro validado e recibo imutavel sem producao
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - name: Auditar isolamento do helper Pro e protecao da interface
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          code=Path('supabase/functions/brother-usage/pro-receipt-v2.ts').read_text()
          server=Path('supabase/functions/brother-usage/index.ts').read_text()
          tests=Path('supabase/functions/brother-usage/pro-receipt-v2_test.ts').read_text()
          for fragment in (
              'eligibleProPlan(', 'reserveProReceiptV2(', 'finalizeProReceiptV2(',
              'entitlement.authenticated !== true', 'entitlement.user?.id',
              'data as Record<string, unknown>', 'request_key',
          ):
              assert fragment in code, f'Contract missing: {fragment}'
          assert 'Deno.env' not in code and 'createClient' not in code
          assert 'SUPABASE_SERVICE_ROLE_KEY' not in code
          assert 'fetch(' not in code and 'Deno.serve' not in code
          # The Pro V2 helper is deliberately not wired to the live function.
          assert 'import { handleProV2 } from "./pro-v2-route.ts"' in server
          assert 'Deno.env.get("BROTHER_PRO_V2_ENABLED") === "true"' in server
          assert 'if (["reserve_pro_v2", "finalize_pro_v2"].includes(payload.action) &&' in server
          assert 'Reserva idempotente Pro ainda não homologada.' in server
          assert 'payload.action === "reserve_v2"' in server
          assert 'admin.rpc("brother_matrizes_reserve_import"' in server
          assert 'admin.rpc("brother_matrizes_finalize_import"' in server
          assert 'finalizeProReceiptV2(' in tests
          print('BROTHER_PRO_V2_OFFLINE_ONLY_NO_DEPLOYMENT_OK')
          PY
      - name: Compilar tipos Deno do helper e dos testes
        shell: bash
        run: |
          deno check supabase/functions/brother-usage/pro-receipt-v2.ts
          deno check supabase/functions/brother-usage/pro-receipt-v2_test.ts
          deno check supabase/functions/brother-usage/pro-v2-route.ts
          deno check supabase/functions/brother-usage/pro-v2-route_test.ts
          echo "BROTHER_PRO_V2_TYPE_CHECK_OK"
      - name: Testar Pro ativo expirado e recusado, replay e finalizacao imutavel
        shell: bash
        run: |
          deno test --no-check supabase/functions/brother-usage/pro-receipt-v2_test.ts
          deno test --no-check supabase/functions/brother-usage/pro-v2-route_test.ts
          echo "BROTHER_PRO_V2_FAKE_DB_TESTS_OK"
