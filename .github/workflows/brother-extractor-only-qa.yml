name: Brother - Satin importado protegido e simulador intocado
on:
  push:
    branches:
      - fix/brother-1108-imported-satin-gap-dot-20261015
  pull_request:
    branches:
      - release/brother-matrizes-1.10.8
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar SDK 36
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Bloquear mudancas no motor, simulador e versao comercial
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object app/src/main/java/com/timachado/brothermatrizes/font/CleanRoomSatinEngine.kt)" = "cca0787e793178df405d404c7a0d764d162ac5c3"
          test "$(git hash-object app/src/main/java/com/timachado/brothermatrizes/MachineSimulationCanvas.kt)" = "46b58e9ab7b10414970bc47542b7ee5072609646"
          test "$(git hash-object app/src/main/java/com/timachado/brothermatrizes/SimulatorScreen.kt)" = "f51abd96933338b53ee2cf7393f1594aeb726da5"
          test "$(git hash-object app/src/main/java/com/timachado/brothermatrizes/EmbroideryCanvas.kt)" = "bb5760d057127c68c3370157c6aaddf2aa46ec06"
          test "$(git hash-object app/src/main/java/com/timachado/brothermatrizes/StitchThreadSegments.kt)" = "40d8aac9e51fffd2e99ec63fb8b402edb7b4ba40"
          grep -Fq 'versionCode = 184' app/build.gradle.kts
          grep -Fq 'versionName = "1.10.8"' app/build.gradle.kts
          grep -Fq 'extractCompleteRun(paint, text)' app/src/main/java/com/timachado/brothermatrizes/font/AndroidSkiaOutlineExtractor.kt
          grep -Fq 'connectorInsideInk = { a, b -> raster.connectorIsFilled(a, b) }' app/src/main/java/com/timachado/brothermatrizes/font/CleanRoomSatinEngine.kt
          grep -Fq 'longestStemRun' app/src/main/java/com/timachado/brothermatrizes/font/CleanRoomSatinEngine.kt
          grep -Fq 'result.addAll(restoredDots.map { it.rails })' app/src/main/java/com/timachado/brothermatrizes/font/CleanRoomSatinEngine.kt
          ! grep -Fq 'result.addAll(0, restoredDots.map { it.rails })' app/src/main/java/com/timachado/brothermatrizes/font/CleanRoomSatinEngine.kt
          grep -Fq 'completeRunStartsAtCapitalMBeforeRestoredDotOverI' app/src/test/java/com/timachado/brothermatrizes/font/ImportedGlyphFailureReproductionTest.kt
          grep -Fq 'ImportedOpenTypeContourGroups.completeRun(contours)' app/src/main/java/com/timachado/brothermatrizes/font/AndroidSkiaOutlineExtractor.kt
          ! grep -Fq 'ImportedOpenTypeContourGroups.owners(' app/src/main/java/com/timachado/brothermatrizes/font/AndroidSkiaOutlineExtractor.kt
          test ! -e app/src/main/java/com/timachado/brothermatrizes/font/ImportedGlyphRailCoverage.kt
          test ! -e app/src/main/java/com/timachado/brothermatrizes/font/ImportedGlyphVoidGuard.kt
      - name: Build e testes JVM
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: APK isolado de homologacao (nao assinado comercialmente)
        uses: actions/upload-artifact@v4
        with:
          name: brother-1108-satin-importado-qa-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
