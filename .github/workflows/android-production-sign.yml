name: Build Signed Brother Matrizes Production APK

on:
  push:
    branches: ["refactor/brother-matrizes-clean-0469"]
  workflow_dispatch:
  
permissions:
  contents: read

jobs:
  signed-production:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Android SDK 36
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Verify clean Brother identity
        shell: bash
        run: |
          LEGACY_TOKEN="$(printf 'fio%s' 'lab')"
          if git grep -ni -I -F "$LEGACY_TOKEN"; then
            echo "Legacy identity reference detected."
            exit 1
          fi
          grep -F 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -F 'namespace = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -F 'android:scheme="com.timachado.brothermatrizes"' app/src/main/AndroidManifest.xml

      - name: Prepare Brother brand assets
        shell: bash
        run: bash scripts/prepare_brand_assets.sh

      - name: Repository safety checks
        run: bash scripts/pre_release_static_check.sh

      - name: Unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Android lint
        run: gradle :app:lintDebug --stacktrace

      - name: Validate production signing secrets
        shell: bash
        env:
          BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64 }}
          BROTHER_MATRIZES_RELEASE_STORE_PASSWORD: ${{ secrets.BROTHER_MATRIZES_RELEASE_STORE_PASSWORD }}
          BROTHER_MATRIZES_RELEASE_KEY_ALIAS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_ALIAS }}
          BROTHER_MATRIZES_RELEASE_KEY_PASSWORD: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64" || { echo "Missing Brother release keystore"; exit 1; }
          test -n "$BROTHER_MATRIZES_RELEASE_STORE_PASSWORD" || { echo "Missing Brother store password"; exit 1; }
          test -n "$BROTHER_MATRIZES_RELEASE_KEY_ALIAS" || { echo "Missing Brother key alias"; exit 1; }
          test -n "$BROTHER_MATRIZES_RELEASE_KEY_PASSWORD" || { echo "Missing Brother key password"; exit 1; }

      - name: Decode temporary Brother production keystore
        shell: bash
        env:
          BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64 }}
        run: |
          KEYSTORE="$RUNNER_TEMP/brother-matrizes-production.jks"
          printf '%s' "$BROTHER_MATRIZES_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

      - name: Build unsigned release
        run: gradle :app:assembleRelease --stacktrace

      - name: Align and sign Brother production APK
        shell: bash
        env:
          BROTHER_MATRIZES_RELEASE_STORE_PASSWORD: ${{ secrets.BROTHER_MATRIZES_RELEASE_STORE_PASSWORD }}
          BROTHER_MATRIZES_RELEASE_KEY_ALIAS: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_ALIAS }}
          BROTHER_MATRIZES_RELEASE_KEY_PASSWORD: ${{ secrets.BROTHER_MATRIZES_RELEASE_KEY_PASSWORD }}
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION_NAME"

          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/Brother-Matrizes-$VERSION_NAME-aligned.apk"
          SIGNED="Brother-Matrizes-$VERSION_NAME-production.apk"
          KEYSTORE="$RUNNER_TEMP/brother-matrizes-production.jks"

          test -f "$UNSIGNED"

          "$BUILD_TOOLS/zipalign" -P 16 -f -v 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/zipalign" -P 16 -c -v 4 "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$BROTHER_MATRIZES_RELEASE_KEY_ALIAS" \
            --ks-pass "env:BROTHER_MATRIZES_RELEASE_STORE_PASSWORD" \
            --key-pass "env:BROTHER_MATRIZES_RELEASE_KEY_PASSWORD" \
            --out "$SIGNED" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"

          CERT_SHA="$("$BUILD_TOOLS/apksigner" verify --print-certs "$SIGNED" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test -n "$CERT_SHA"
          EXPECTED_CERT_SHA="663d4338f085730a87efbf7a2bd3b0ccb91d7dc3696e625afa9c35a0e47c0403"
          test "$CERT_SHA" = "$EXPECTED_CERT_SHA"

          printf '%s\n' "$CERT_SHA" > "Brother-Matrizes-$VERSION_NAME-CERT-SHA256.txt"
          sha256sum "$SIGNED" > "Brother-Matrizes-$VERSION_NAME-APK-SHA256.txt"

          {
            echo "VERSION_NAME=$VERSION_NAME"
            echo "SIGNED_APK=$SIGNED"
            echo "CERT_FILE=Brother-Matrizes-$VERSION_NAME-CERT-SHA256.txt"
            echo "APK_SHA_FILE=Brother-Matrizes-$VERSION_NAME-APK-SHA256.txt"
          } >> "$GITHUB_ENV"

      - name: Upload signed Brother production candidate
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-${{ env.VERSION_NAME }}-signed-production-candidate
          path: |
            ${{ env.SIGNED_APK }}
            ${{ env.CERT_FILE }}
            ${{ env.APK_SHA_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/brother-matrizes-production.jks"
          rm -f "$RUNNER_TEMP"/Brother-Matrizes-*-aligned.apk
