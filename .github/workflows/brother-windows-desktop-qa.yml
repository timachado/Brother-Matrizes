name: Brother Matrizes - Windows Desktop QA (nao comercial)

on:
  pull_request:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/brother-windows-desktop-qa.yml"
  workflow_dispatch:

concurrency:
  group: brother-windows-desktop-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-qa:
    name: Testes e pacotes Windows - somente QA
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: JDK 17 para Compose Desktop e jpackage
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle compativel com Kotlin 2.2.20
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Executar testes de integridade DST e compilar interface
        shell: pwsh
        run: gradle --no-daemon --stacktrace test compileKotlin

      - name: Gerar instaladores de homologacao Windows
        shell: pwsh
        run: gradle --no-daemon --stacktrace packageExe packageMsi

      - name: Armazenar pacotes QA (NAO PUBLICAR)
        uses: actions/upload-artifact@v4
        with:
          name: brother-windows-installer-QA-NAO-COMERCIAL
          path: |
            windows/build/compose/binaries/main/exe/**
            windows/build/compose/binaries/main/msi/**
          if-no-files-found: error
          retention-days: 7
