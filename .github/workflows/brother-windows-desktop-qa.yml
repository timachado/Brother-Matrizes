name: Brother Matrizes - Windows Desktop QA (nao comercial)

on:
  pull_request:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/brother-windows-desktop-qa.yml"
  workflow_dispatch:

concurrency:
  group: brother-windows-desktop-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-qa:
    name: Testes e pacotes Windows - somente QA
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: JDK 17 para Compose Desktop e jpackage
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle compativel com Kotlin 2.2.20
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Executar testes de integridade DST e compilar interface
        shell: pwsh
        run: gradle --no-daemon --stacktrace test compileKotlin

      - name: Gerar app-image e instaladores de homologacao Windows
        shell: pwsh
        run: gradle --no-daemon --stacktrace createDistributable packageExe packageMsi

      # Testa a inicializacao real do LAUNCHER empacotado na VM Windows.
      # Nao simula instalacao fisica ou uso grafico; somente confirma runtime
      # Java incluido + motores DST/FLP + recusa de sobrescrita.
      - name: Validar launcher empacotado no Windows (smoke offline)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"
          $folder = "build/compose/binaries/main/app"
          if (!(Test-Path $folder)) {
            throw "App-image nao foi criado: $folder"
          }
          $launchers = @(Get-ChildItem -Path $folder -Recurse -File -Filter "BrotherMatrizesDesktop.exe")
          if ($launchers.Count -ne 1) {
            throw "Esperado exatamente 1 launcher no app-image; encontrados: $($launchers.Count)"
          }
          $launcher = $launchers[0]
          $report = Join-Path $env:RUNNER_TEMP "brother-windows-qa-smoke.txt"
          if (Test-Path $report) { Remove-Item -LiteralPath $report -Force }
          Write-Host "Testando launcher QA em runner Windows: $($launcher.FullName)"
          $args = '--smoke-test "' + $report + '"'
          $process = Start-Process -FilePath $launcher.FullName -ArgumentList $args -WorkingDirectory $launcher.DirectoryName -PassThru
          try {
            Wait-Process -Id $process.Id -Timeout 90 -ErrorAction Stop
          } catch {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Launcher nao finalizou o diagnostico em 90 segundos."
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            throw "Launcher retornou codigo de erro: $($process.ExitCode)"
          }
          if (!(Test-Path $report)) {
            throw "Launcher nao produziu relatorio; runtime Java empacotado nao validado."
          }
          $result = Get-Content -LiteralPath $report -Raw -Encoding UTF8
          if (!$result.StartsWith("BROTHER_WINDOWS_QA_SMOKE_OK")) {
            throw "Relatorio de diagnostico invalido."
          }
          Write-Host $result

      # Executa apenas no runner Windows efemero, nunca num PC de cliente.
      # Instala MSI gerado neste job, roda diagnostico no executavel de
      # Program Files e desinstala pelo ProductCode do proprio pacote.
      - name: Instalar, testar e desinstalar MSI em Windows virtual (QA)
        shell: pwsh
        timeout-minutes: 8
        run: ./qa/validate-installed-msi.ps1

      - name: Gerar e validar integridade SHA256 dos instaladores QA
        shell: pwsh
        timeout-minutes: 4
        run: |
          ./qa/test-checksum-installers.ps1
          ./qa/checksum-installers.ps1 -Mode Create
          ./qa/checksum-installers.ps1 -Mode Verify

      - name: Armazenar pacotes QA (NAO PUBLICAR)
        uses: actions/upload-artifact@v4
        with:
          name: brother-windows-installer-QA-NAO-COMERCIAL
          path: |
            windows/build/compose/binaries/main/exe/**
            windows/build/compose/binaries/main/msi/**
            windows/build/compose/binaries/main/qa/**
          if-no-files-found: error
          retention-days: 7
