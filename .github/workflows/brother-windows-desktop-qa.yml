name: Brother Matrizes - Windows Desktop QA (nao comercial)

on:
  pull_request:
    branches: [main]
    paths:
      - "windows/**"
      - ".github/workflows/brother-windows-desktop-qa.yml"
  workflow_dispatch:

concurrency:
  group: brother-windows-desktop-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-qa:
    name: Testes e pacotes Windows - somente QA
    runs-on: windows-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: windows
    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: JDK 17 para Compose Desktop e jpackage
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle compativel com Kotlin 2.2.20
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Executar testes de integridade DST e compilar interface
        shell: pwsh
        run: gradle --no-daemon --stacktrace test compileKotlin

      - name: Gerar app-image e instaladores de homologacao Windows
        shell: pwsh
        run: gradle --no-daemon --stacktrace createDistributable packageExe packageMsi

      # Testa a inicializacao real do LAUNCHER empacotado na VM Windows.
      # Nao simula instalacao fisica ou uso grafico; somente confirma runtime
      # Java incluido + motores DST/FLP + recusa de sobrescrita.
      - name: Validar launcher empacotado no Windows (smoke offline)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = "Stop"
          $folder = "build/compose/binaries/main/app"
          if (!(Test-Path $folder)) {
            throw "App-image nao foi criado: $folder"
          }
          $launchers = @(Get-ChildItem -Path $folder -Recurse -File -Filter "BrotherMatrizesDesktop.exe")
          if ($launchers.Count -ne 1) {
            throw "Esperado exatamente 1 launcher no app-image; encontrados: $($launchers.Count)"
          }
          $launcher = $launchers[0]
          $report = Join-Path $env:RUNNER_TEMP "brother-windows-qa-smoke.txt"
          if (Test-Path $report) { Remove-Item -LiteralPath $report -Force }
          Write-Host "Testando launcher QA em runner Windows: $($launcher.FullName)"
          $args = '--smoke-test "' + $report + '"'
          $process = Start-Process -FilePath $launcher.FullName -ArgumentList $args -WorkingDirectory $launcher.DirectoryName -PassThru
          try {
            Wait-Process -Id $process.Id -Timeout 90 -ErrorAction Stop
          } catch {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Launcher nao finalizou o diagnostico em 90 segundos."
          }
          $process.Refresh()
          if ($process.ExitCode -ne 0) {
            throw "Launcher retornou codigo de erro: $($process.ExitCode)"
          }
          if (!(Test-Path $report)) {
            throw "Launcher nao produziu relatorio; runtime Java empacotado nao validado."
          }
          $result = Get-Content -LiteralPath $report -Raw -Encoding UTF8
          if (!$result.StartsWith("BROTHER_WINDOWS_QA_SMOKE_OK")) {
            throw "Relatorio de diagnostico invalido."
          }
          Write-Host $result

      # Smoke grafico da janela principal Compose no desktop virtual:
      # exige janela realmente visivel e captura PNG da tela inicial vazia.
      # Isto nao substitui homologacao visual em PC fisico.
      - name: Iniciar e capturar interface Windows real (QA)
        shell: pwsh
        timeout-minutes: 3
        run: ./qa/validate-ui-desktop.ps1

      # Executa apenas no runner Windows efemero, nunca num PC de cliente.
      # Instala MSI gerado neste job, roda diagnostico no executavel de
      # Program Files e desinstala pelo ProductCode do proprio pacote.
      - name: Instalar, testar e desinstalar MSI em Windows virtual (QA)
        shell: pwsh
        timeout-minutes: 8
        run: ./qa/validate-installed-msi.ps1

      - name: Gerar e validar integridade SHA256 e kit beta interna
        shell: pwsh
        timeout-minutes: 5
        env:
          # Pull requests geram um merge SHA temporario; usar SHA do PR
          # como origem do codigo do manifesto e da beta controlada.
          BROTHER_QA_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          ./qa/test-checksum-installers.ps1
          ./qa/checksum-installers.ps1 -Mode Create -SourceCommit $env:BROTHER_QA_SOURCE_COMMIT
          ./qa/checksum-installers.ps1 -Mode Verify -SourceCommit $env:BROTHER_QA_SOURCE_COMMIT
          $artifactQa = "build/compose/binaries/main/qa"
          Copy-Item -LiteralPath "qa/verify-beta-package.ps1" -Destination $artifactQa -ErrorAction Stop
          Copy-Item -LiteralPath "qa/BETA-FECHADA-01.md" -Destination $artifactQa -ErrorAction Stop
          Copy-Item -LiteralPath "qa/ROTEIRO-HOMOLOGACAO-FISICA.md" -Destination $artifactQa -ErrorAction Stop
          ./qa/verify-beta-package.ps1 -PackageRoot "build/compose/binaries/main" -ExpectedCommit $env:BROTHER_QA_SOURCE_COMMIT -ExpectedRunId $env:GITHUB_RUN_ID
          # Gera amostras ARTIFICIAIS com o launcher desta compilação.
          # Integra os exemplos ao ZIP QA; não comprova PE-DESIGN 11 físico.
          $image = "build/compose/binaries/main/app"
          $launchers = @(Get-ChildItem -LiteralPath $image -Recurse -File -Filter "BrotherMatrizesDesktop.exe")
          if ($launchers.Count -ne 1) {
            throw "Launcher de amostras QA ausente ou duplicado."
          }
          $output = Join-Path (Get-Location).Path "build/compose/binaries/main/qa/fixtures"
          $env:BROTHER_WINDOWS_QA_FIXTURES = '1'
          try {
            $arguments = '--export-qa-fixtures "' + $output + '"'
            $process = Start-Process -FilePath $launchers[0].FullName -WorkingDirectory $launchers[0].DirectoryName -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              throw "Geração de matrizes sintéticas falhou no launcher: $($process.ExitCode)"
            }
          } finally {
            Remove-Item Env:BROTHER_WINDOWS_QA_FIXTURES -ErrorAction SilentlyContinue
          }
          $checksums = @(Get-Content -LiteralPath (Join-Path $output "SHA256SUMS.txt") -Encoding UTF8)
          if ($checksums.Count -ne 8) { throw "Kit QA deveria conter exatamente 8 hashes." }
          foreach ($line in $checksums) {
            if ($line -cnotmatch '^([0-9a-f]{64})  ([a-zA-Z0-9_.-]+)

      - name: Armazenar evidencia grafica de QA (sem dados de clientes)
        uses: actions/upload-artifact@v4
        with:
          name: brother-windows-ui-smoke-QA-NAO-COMERCIAL
          path: windows/build/qa/desktop-ui/**
          if-no-files-found: error
          retention-days: 7

      - name: Armazenar pacotes QA (NAO PUBLICAR)
        uses: actions/upload-artifact@v4
        with:
          name: brother-windows-installer-QA-NAO-COMERCIAL
          path: |
            windows/build/compose/binaries/main/exe/**
            windows/build/compose/binaries/main/msi/**
            windows/build/compose/binaries/main/qa/**
          if-no-files-found: error
          retention-days: 7
) {
              throw "Linha de SHA256 de amostra inválida."
            }
            $expected = $Matches[1]
            $name = $Matches[2]
            $file = Join-Path $output $name
            if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "Amostra QA ausente: $name"
            }
            $actual = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $expected) { throw "SHA256 inválido para amostra $name" }
          }
          $fixtures = @(Get-ChildItem -LiteralPath $output -File)
          if ($fixtures.Count -ne 9) {
            throw "Kit de QA contém arquivos inesperados; encontrados: $($fixtures.Count)"
          }
          Write-Host "BROTHER_WINDOWS_SYNTHETIC_FIXTURES_SHA256_OK"


      - name: Armazenar evidencia grafica de QA (sem dados de clientes)
        uses: actions/upload-artifact@v4
        with:
          name: brother-windows-ui-smoke-QA-NAO-COMERCIAL
          path: windows/build/qa/desktop-ui/**
          if-no-files-found: error
          retention-days: 7

      - name: Armazenar pacotes QA (NAO PUBLICAR)
        uses: actions/upload-artifact@v4
        with:
          name: brother-windows-installer-QA-NAO-COMERCIAL
          path: |
            windows/build/compose/binaries/main/exe/**
            windows/build/compose/binaries/main/msi/**
            windows/build/compose/binaries/main/qa/**
          if-no-files-found: error
          retention-days: 7
