name: Brother Matrizes - QA da lupa NetFontes

on:
  push:
    branches:
      - feature/netfontes-font-browser-20261015
    paths:
      - '.github/workflows/qa-netfontes-lupa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-font-search:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar plataforma Android
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Confirmar interface, versão e pacote
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 184' app/build.gradle.kts
          grep -Fq 'versionName = "1.10.8"' app/build.gradle.kts
          grep -Fq 'applicationId = "com.timachado.brothermatrizes"' app/build.gradle.kts
          grep -Fq 'Buscar fonte no ${source.displayName}' app/src/main/java/com/timachado/brothermatrizes/DaFontBrowserScreen.kt
          grep -Fq 'ic_ms_search_rounded' app/src/main/java/com/timachado/brothermatrizes/DaFontBrowserScreen.kt
          test -s app/src/main/res/drawable/ic_ms_search_rounded.xml
          grep -Fq 'NetFontesNavigationRules.searchUrl(term)' app/src/main/java/com/timachado/brothermatrizes/DaFontBrowserScreen.kt
          grep -Fq 'https://www.netfontes.com/search/' app/src/main/java/com/timachado/brothermatrizes/font/NetFontesNavigationRules.kt
      - name: Preparar identidade visual
        run: bash scripts/prepare_brand_assets.sh
      - name: Testes unitarios Android
        run: gradle :app:testDebugUnitTest --stacktrace
      - name: Compilar APK Android para QA
        run: gradle :app:assembleDebug --stacktrace
      - name: Armazenar APK tecnico, nao publicar
        uses: actions/upload-artifact@v4
        with:
          name: brother-matrizes-netfontes-lupa-debug-qa
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 5
