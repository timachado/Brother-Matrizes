name: Brother Image-to-PES QA

on:
  push:
    branches: ["feature/image-to-stitches-pes-20261015", "feature/multicolor-digitization-20261015", "feature/layer-editor-pes-20261015", "feature/raster-straight-satin-20261015", "feature/raster-curved-satin-20261015", "feature/manual-satin-rails-editor-20261015", "feature/raster-project-persistence-20261015", "feature/raster-satin-backup-and-joins-20261015", "feature/home-image-to-embroidery-tool-20261015", "feature/photo-logo-crop-background-20261015", "feature/image-photo-preview-reeditable-20261015"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-to-pes:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Prepare Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"
      - name: Verify commercial version and protected simulator
        shell: bash
        run: |
          grep -F 'versionCode = 184' app/build.gradle.kts
          grep -F 'versionName = "1.10.8"' app/build.gradle.kts
          for file in MachineSimulationCanvas.kt SimulatorScreen.kt EmbroideryCanvas.kt EmbroideryDisplay.kt; do
            git diff origin/main --exit-code -- "app/src/main/java/com/timachado/brothermatrizes/$file"
          done
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Build QA APK (debug only)
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: APK archive
        uses: actions/upload-artifact@v4
        with:
          name: Brother-Matrizes-Imagem-para-PES-QA-DEBUG
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
