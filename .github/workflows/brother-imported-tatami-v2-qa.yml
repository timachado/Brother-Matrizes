name: Brother Matrizes - QA experimental Tatami (sem publicar)
on:
  push:
    branches:
      - qa/imported-glyph-tatami-v2
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: brother-tatami-v2-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-android:
    name: Testes unitarios e compilacao debug sem distribuir
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Instalar Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          "$sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Confirmar base e nao alteracao no simulador
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionName = "1.10.8"' app/build.gradle.kts
          grep -Fq 'versionCode = 184' app/build.gradle.kts
          grep -Fq 'QA_ONLY_ENABLED: Boolean = false' app/src/main/java/com/timachado/brothermatrizes/font/ImportedGlyphTatamiAdapter.kt
          test "$(git hash-object app/src/main/java/com/timachado/brothermatrizes/MachineSimulationCanvas.kt)" = '46b58e9ab7b10414970bc47542b7ee5072609646'
          test "$(git hash-object app/src/main/java/com/timachado/brothermatrizes/SimulatorScreen.kt)" = 'f51abd96933338b53ee2cf7393f1594aeb726da5'
      - name: Executar testes e compilar Android (nao publicar)
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin
  verify-skia-device:
    name: Comparar contornos Skia em emulador Android 35
    needs: test-android
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Habilitar KVM para emulador Linux
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Executar comparacao de contornos no Skia Android real
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: gradle --no-daemon :app:connectedDebugAndroidTest -PbrotherTatamiQa=true -Pandroid.testInstrumentationRunnerArguments.class=com.timachado.brothermatrizes.font.ImportedFontFullRunSkiaInstrumentedTest
